
name: SONGDNA SMART STUDIO 7.0.0 Stage175 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "*.zip"

permissions:
  contents: read

concurrency:
  group: songdna-stage175-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify Stage175 source and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Kaynak deposunu al
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js 22 kur
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Python 3.11 kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      # ANDROID SDK - V4 FIX
      - name: Android SDK ortamını hazırla
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"

      - name: Gerekli Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # STAGE175 BUILD KIT
      - name: Stage175 derleme kitini güvenli şekilde bul ve aç
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import sys

          root = Path.cwd()

          candidates = [
              p for p in root.rglob("*.zip")
              if "STAGE175" in p.name.upper()
              and "DERLEME_KITI" in p.name.upper()
          ]

          if len(candidates) != 1:
              print("Stage175 derleme kiti tekil olarak belirlenemedi.")
              for item in candidates:
                  print(item)
              sys.exit(1)

          selected = candidates[0]
          print(f"Seçilen kit: {selected}")

          Path("/tmp/songdna_stage175_kit.txt").write_text(
              str(selected.resolve()),
              encoding="utf-8"
          )
          PY

          KIT="$(cat /tmp/songdna_stage175_kit.txt)"

          mkdir -p "$RUNNER_TEMP/songdna_stage175_kit"

          unzip -q "$KIT" -d "$RUNNER_TEMP/songdna_stage175_kit"

      # SOURCE ZIP
      - name: Stage175 kaynak ZIP dosyasını bul ve proje kökünü belirle
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          import os
          import sys

          kit_dir = (
              Path(os.environ["RUNNER_TEMP"])
              / "songdna_stage175_kit"
          )

          out_dir = (
              Path(os.environ["RUNNER_TEMP"])
              / "songdna_stage175_candidates"
          )

          out_dir.mkdir(parents=True, exist_ok=True)

          archives = sorted(kit_dir.rglob("*.zip"))

          if not archives:
              sys.exit("Derleme kitinde ZIP bulunamadı.")

          extracted = 0

          for archive in archives:
              name = archive.name.upper()

              if (
                  "KAYNAK" not in name
                  and "GITHUB_BUILD_ONLY" not in name
              ):
                  continue

              target = out_dir / archive.stem
              target.mkdir(parents=True, exist_ok=True)

              with zipfile.ZipFile(archive) as zf:
                  bad = zf.testzip()

                  if bad:
                      raise RuntimeError(
                          f"Bozuk ZIP girdisi: {bad}"
                      )

                  zf.extractall(target)

              print(f"Açıldı: {archive.name}")
              extracted += 1

          if extracted == 0:
              sys.exit("Kaynak ZIP bulunamadı.")

          valid_roots = []

          for marker in out_dir.rglob(
              "scripts/verify-source.py"
          ):
              project = marker.parent.parent

              gradle_file = (
                  project
                  / "android-wrapper/app/build.gradle.kts"
              )

              gradle_wrapper = (
                  project / "android-wrapper/gradlew"
              )

              if gradle_file.is_file() and gradle_wrapper.is_file():
                  valid_roots.append(project.resolve())

          if len(valid_roots) != 1:
              print("Proje kökü tekil olarak belirlenemedi.")

              for item in valid_roots:
                  print(item)

              sys.exit(1)

          project_root = valid_roots[0]

          Path(
              "/tmp/songdna_stage175_project_root.txt"
          ).write_text(
              str(project_root),
              encoding="utf-8"
          )

          print(f"Proje kökü: {project_root}")
          PY

          PROJECT_ROOT="$(cat /tmp/songdna_stage175_project_root.txt)"

          echo "SONGDNA_PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # PYTHON
      - name: Python test bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install playwright

          if [ -f "$SONGDNA_PROJECT_ROOT/requirements.txt" ]; then
            python -m pip install \
              -r "$SONGDNA_PROJECT_ROOT/requirements.txt"
          fi

          if [ -f "$SONGDNA_PROJECT_ROOT/pyproject.toml" ]; then
            python -m pip install "$SONGDNA_PROJECT_ROOT"
          fi

      - name: Playwright Chromium kur
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      # NODE
      - name: Backend Node.js bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail

          BACKEND="$SONGDNA_PROJECT_ROOT/backend"

          test -f "$BACKEND/package.json"

          cd "$BACKEND"

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # SOURCE VALIDATION
      - name: Kaynak ve Android varlık bütünlüğünü doğrula
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT"

          test -f scripts/verify-source.py
          test -f scripts/ci-preflight.py
          test -f android-wrapper/app/build.gradle.kts
          test -f android-wrapper/gradlew

          python scripts/verify-source.py
          python scripts/ci-preflight.py

      # BACKEND VALIDATION
      - name: Backend JavaScript sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT"

          node --check server.js
          node --check backend/server.js

          cmp -s server.js backend/server.js

      - name: Backend kontrol komutunu çalıştır
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT/backend"

          npm run check --if-present

      # JAVASCRIPT TESTS
      - name: JavaScript regression testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT"

          mapfile -d '' TEST_FILES < <(
            find scripts -type f \
              -name 'test-*.js' -print0 | sort -z
          )

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "JavaScript test dosyası bulunamadı."
            exit 1
          fi

          for TEST in "${TEST_FILES[@]}"; do
            echo "Test: $TEST"
            node "$TEST"
          done

      # PYTHON AND BROWSER TESTS
      - name: Python ve tarayıcı regression testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT"

          python -m compileall -q scripts

          mapfile -d '' TEST_FILES < <(
            find scripts -type f \
              -name 'test-*.py' -print0 | sort -z
          )

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "Python test dosyası bulunamadı."
            exit 1
          fi

          for TEST in "${TEST_FILES[@]}"; do
            echo "Test: $TEST"
            python "$TEST"
          done

      # ANDROID BUILD
      - name: Android Gradle projesini derle
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT/android-wrapper"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # APK VALIDATION
      - name: APK dosyasını ve SHA-256 değerini doğrula
        shell: bash
        run: |
          set -euo pipefail

          APK="$SONGDNA_PROJECT_ROOT/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK oluşturulamadı."
            exit 1
          fi

          OUTPUT="$RUNNER_TEMP/songdna_stage175_output"

          mkdir -p "$OUTPUT"

          cp "$APK" \
            "$OUTPUT/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk"

          cd "$OUTPUT"

          sha256sum \
            SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk \
            > SHA256SUMS.txt

          ls -lh *.apk
          cat SHA256SUMS.txt

      # ARTIFACT
      - name: Stage175 debug APK çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA_SMART_STUDIO_7_0_0_STAGE175_ANDROID_DEBUG
          path: |
            ${{ runner.temp }}/songdna_stage175_output/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk
            ${{ runner.temp }}/songdna_stage175_output/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          
