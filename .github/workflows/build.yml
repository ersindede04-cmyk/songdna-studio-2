
name: SONGDNA SMART STUDIO 7.5.0 - Stage187 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: songdna-stage187-build
  cancel-in-progress: false

jobs:
  build:
    name: Verify Stage187 source and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and validate Stage187 ZIP
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Stage187 ZIP aranıyor..."

          mapfile -t ZIP_FILES < <(
            find . -type f \
              -iname 'SONGDNA_SMART_STUDIO_7_5_0_STAGE187_KAYNAK_PAKETI*.zip' \
              -not -path './.git/*' \
              -print
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::Stage187 ZIP bulunamadı."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "::error::Birden fazla Stage187 ZIP bulundu. Tek bir kaynak paketi bırakın."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_PATH="${ZIP_FILES[0]}"

          echo "Bulundu: $ZIP_PATH"

          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::ZIP dosyası boş."
            exit 1
          fi

          if ! unzip -tq "$ZIP_PATH"; then
            echo "::error::ZIP dosyası bozuk veya eksik."
            exit 1
          fi

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Extract Stage187 source
        id: extract
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/songdna-stage187"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "${{ steps.package.outputs.zip_path }}" -d "$EXTRACT_DIR"

          if [ -z "$(find "$EXTRACT_DIR" -type f -print -quit)" ]; then
            echo "::error::ZIP içerisinde kaynak dosyası bulunamadı."
            exit 1
          fi

          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"
          echo "Kaynak paketi çıkarıldı."

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT_DIR="${{ steps.extract.outputs.extract_dir }}"

          mapfile -t GRADLE_FILES < <(
            find "$EXTRACT_DIR" -type f -name gradlew \
              -not -path '*/node_modules/*' \
              -print
          )

          if [ "${#GRADLE_FILES[@]}" -ne 1 ]; then
            echo "::error::Tek bir Android Gradle projesi bekleniyordu. Bulunan wrapper sayısı: ${#GRADLE_FILES[@]}"
            printf '%s\n' "${GRADLE_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${GRADLE_FILES[0]}")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Gradle settings dosyası bulunamadı."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Stage187 package identity
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT_DIR="${{ steps.extract.outputs.extract_dir }}"

          if ! find "$EXTRACT_DIR" -type f \
            \( -iname '*STAGE187*' -o -iname '*manifest*.json' \) \
            -print -quit | grep -q .; then
            echo "::error::Stage187 paket kimliği doğrulanamadı."
            exit 1
          fi

          echo "Stage187 paket kimliği kontrol edildi."

      - name: Verify story blending endpoint
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT_DIR="${{ steps.extract.outputs.extract_dir }}"

          SERVER_FILE=""

          if [ -f "$EXTRACT_DIR/backend/server.js" ]; then
            SERVER_FILE="$EXTRACT_DIR/backend/server.js"
          elif [ -f "$EXTRACT_DIR/server.js" ]; then
            SERVER_FILE="$EXTRACT_DIR/server.js"
          else
            SERVER_FILE="$(find "$EXTRACT_DIR" -type f \
              -name server.js -not -path '*/node_modules/*' \
              -print -quit)"
          fi

          if [ -z "$SERVER_FILE" ]; then
            echo "::error::Backend server.js bulunamadı."
            exit 1
          fi

          if ! grep -q 'story-blend' "$SERVER_FILE"; then
            echo "::error::Story blending endpoint bulunamadı."
            exit 1
          fi

          if [ -f "$EXTRACT_DIR/backend/server.js" ] && \
             [ -f "$EXTRACT_DIR/server.js" ]; then
            if ! cmp -s "$EXTRACT_DIR/backend/server.js" "$EXTRACT_DIR/server.js"; then
              echo "::error::Root ve backend server.js dosyaları farklı."
              exit 1
            fi
          fi

          echo "Story blending endpoint kontrolü başarılı."

      - name: Verify backend JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT_DIR="${{ steps.extract.outputs.extract_dir }}"

          while IFS= read -r FILE; do
            echo "Kontrol: $FILE"
            node --check "$FILE"
          done < <(
            find "$EXTRACT_DIR" -type f \
              \( -name server.js -o -name app.js \) \
              -not -path '*/node_modules/*'
          )

          echo "JavaScript syntax kontrolü tamamlandı."

      - name: Run available Stage187 regression tests
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT_DIR="${{ steps.extract.outputs.extract_dir }}"
          TEST_COUNT=0

          while IFS= read -r TEST_FILE; do
            echo "Test: $TEST_FILE"
            node "$TEST_FILE"
            TEST_COUNT=$((TEST_COUNT + 1))
          done < <(
            find "$EXTRACT_DIR" -type f \
              \( -iname '*regression*.js' -o -iname '*stage187*.js' \) \
              -not -path '*/node_modules/*'
          )

          echo "Çalıştırılan test dosyası: $TEST_COUNT"

      - name: Build Android debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK and generate SHA-256
        id: apk
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          mapfile -t APK_FILES < <(
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -name '*.apk' \
              -print
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::APK oluşturulamadı."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/songdna-artifacts"

          cp "${APK_FILES[0]}" \
            "$RUNNER_TEMP/songdna-artifacts/SONGDNA_STAGE187_DEBUG.apk"

          cd "$RUNNER_TEMP/songdna-artifacts"

          sha256sum SONGDNA_STAGE187_DEBUG.apk > SHA256SUMS.txt

          echo "APK_PATH=$RUNNER_TEMP/songdna-artifacts" >> "$GITHUB_ENV"

          echo "APK doğrulandı."
          cat SHA256SUMS.txt

      - name: Upload Stage187 APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA_STAGE187_ANDROID_APK
          path: |
            ${{ env.APK_PATH }}/SONGDNA_STAGE187_DEBUG.apk
            ${{ env.APK_PATH }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          
