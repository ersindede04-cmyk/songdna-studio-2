name: SONGDNA SMART STUDIO 7.0.0 Stage175 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DERLEME_KITI.zip'
      - 'SONGDNA_SMART_STUDIO_7_0_0_STAGE175_KAYNAK.zip'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: songdna-stage175-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Stage175 source and build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Kaynak deposunu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK paketlerini hazırla
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android SDK sdkmanager bulunamadı: $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Stage175 derleme kitini ve doğru kaynak ZIP dosyasını bul
        id: source
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/songdna-stage175"
          KIT_DIR="$WORK_DIR/kit"
          SOURCE_EXTRACT="$WORK_DIR/source"
          mkdir -p "$KIT_DIR" "$SOURCE_EXTRACT"

          KIT_ZIP="$(find "$GITHUB_WORKSPACE" -type f \
            -name 'SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DERLEME_KITI.zip' \
            -not -path '*/.git/*' -print -quit)"

          DIRECT_SOURCE_ZIP="$(find "$GITHUB_WORKSPACE" -type f \
            -name 'SONGDNA_SMART_STUDIO_7_0_0_STAGE175_KAYNAK.zip' \
            -not -path '*/.git/*' -print -quit)"

          if [[ -n "$KIT_ZIP" ]]; then
            echo "Stage175 derleme kiti bulundu: $KIT_ZIP"
            unzip -tq "$KIT_ZIP"
            unzip -q "$KIT_ZIP" -d "$KIT_DIR"

            KIT_ROOT="$(find "$KIT_DIR" -type f -name 'BUILD_PACKAGE_MANIFEST_STAGE175.json' -print -quit | xargs -r dirname)"
            if [[ -z "$KIT_ROOT" ]]; then
              echo "::error::Stage175 derleme kiti manifest dosyası bulunamadı."
              exit 1
            fi

            if [[ -f "$KIT_ROOT/SHA256SUMS.txt" ]]; then
              echo "Derleme kiti SHA-256 değerleri doğrulanıyor."
              (cd "$KIT_ROOT" && sha256sum -c SHA256SUMS.txt)
            fi

            SOURCE_ZIP="$KIT_ROOT/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_KAYNAK.zip"
            if [[ ! -s "$SOURCE_ZIP" ]]; then
              echo "::error::Derleme kitinin içinde beklenen Stage175 kaynak ZIP dosyası yok."
              find "$KIT_ROOT" -maxdepth 2 -type f -print
              exit 1
            fi
          elif [[ -n "$DIRECT_SOURCE_ZIP" ]]; then
            echo "Doğrudan Stage175 kaynak ZIP bulundu: $DIRECT_SOURCE_ZIP"
            SOURCE_ZIP="$DIRECT_SOURCE_ZIP"
          else
            echo "::error::Stage175 derleme kiti veya Stage175 kaynak ZIP dosyası bulunamadı."
            echo "Depoda bulunan ZIP dosyaları:"
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print || true
            exit 1
          fi

          echo "Kullanılacak kaynak: $SOURCE_ZIP"
          unzip -tq "$SOURCE_ZIP"

          SOURCE_LIST="$(unzip -Z1 "$SOURCE_ZIP")"
          if ! grep -Eq '(^|/)scripts/verify-source\.py$' <<< "$SOURCE_LIST"; then
            echo "::error::Seçilen arşiv Stage175 kaynak kodu değil: verify-source.py yok."
            exit 1
          fi
          if ! grep -Eq '(^|/)android-wrapper/settings\.gradle(\.kts)?$' <<< "$SOURCE_LIST"; then
            echo "::error::Stage175 kaynak ZIP içinde Android Gradle projesi yok."
            exit 1
          fi
          if ! grep -Eq '(^|/)requirements-test\.txt$' <<< "$SOURCE_LIST"; then
            echo "::error::Stage175 kaynak ZIP içinde requirements-test.txt yok."
            exit 1
          fi

          unzip -q "$SOURCE_ZIP" -d "$SOURCE_EXTRACT"
          VERIFY_FILE="$(find "$SOURCE_EXTRACT" -type f -path '*/scripts/verify-source.py' -print -quit)"
          if [[ -z "$VERIFY_FILE" ]]; then
            echo "::error::Kaynak açıldı ancak scripts/verify-source.py bulunamadı."
            exit 1
          fi

          SOURCE_DIR="$(dirname "$(dirname "$VERIFY_FILE")")"
          test -f "$SOURCE_DIR/requirements-test.txt"
          test -d "$SOURCE_DIR/tests"
          test -d "$SOURCE_DIR/scripts"
          test -d "$SOURCE_DIR/backend"
          test -f "$SOURCE_DIR/android-wrapper/settings.gradle.kts" -o \
               -f "$SOURCE_DIR/android-wrapper/settings.gradle"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"
          echo "Android proje dizini: $SOURCE_DIR/android-wrapper"

      - name: Python test bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "$SOURCE_DIR/requirements-test.txt"

      - name: Playwright Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: Backend Node.js bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_DIR="$SOURCE_DIR/backend"
          if [[ -f "$BACKEND_DIR/package-lock.json" ]]; then
            npm --prefix "$BACKEND_DIR" ci --no-audit --no-fund
          elif [[ -f "$BACKEND_DIR/package.json" ]]; then
            npm --prefix "$BACKEND_DIR" install --no-audit --no-fund
          else
            echo "Backend package.json bulunamadı; bağımlılık kurulumu atlandı."
          fi

      - name: Kaynak ve Android varlık bütünlüğünü doğrula
        shell: bash
        run: |
          set -euo pipefail
          python "$SOURCE_DIR/scripts/verify-source.py"

      - name: Backend JavaScript sözdizimini ve kontrol komutunu doğrula
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$SOURCE_DIR/backend" run check

      - name: JavaScript regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          mapfile -d '' TEST_FILES < <(
            find tests -type f -name '*.js' -print0 2>/dev/null | sort -z
          )
          mapfile -d '' SCRIPT_TESTS < <(
            find scripts -maxdepth 1 -type f -name 'test-*.js' -print0 2>/dev/null | sort -z
          )
          TEST_FILES+=("${SCRIPT_TESTS[@]}")

          if (( ${#TEST_FILES[@]} == 0 )); then
            echo "::error::JavaScript regresyon testi bulunamadı."
            exit 1
          fi

          echo "Çalıştırılacak JavaScript test sayısı: ${#TEST_FILES[@]}"
          for TEST_FILE in "${TEST_FILES[@]}"; do
            echo "::group::${TEST_FILE#./}"
            node "$TEST_FILE"
            echo "::endgroup::"
          done

      - name: Python ve tarayıcı regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          python scripts/ci-preflight.py

          mapfile -d '' TEST_FILES < <(
            find scripts -maxdepth 1 -type f -name 'test-*.py' -print0 | sort -z
          )
          if (( ${#TEST_FILES[@]} == 0 )); then
            echo "::error::Python regresyon testi bulunamadı."
            exit 1
          fi

          echo "Çalıştırılacak Python test sayısı: ${#TEST_FILES[@]}"
          for TEST_FILE in "${TEST_FILES[@]}"; do
            echo "::group::${TEST_FILE#./}"
            python "$TEST_FILE"
            echo "::endgroup::"
          done

      - name: Android debug APK oluştur
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR/android-wrapper"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK dosyasını ve SHA-256 değerini doğrula
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Gradle tamamlandı ancak debug APK bulunamadı veya boş."
            find "$SOURCE_DIR/android-wrapper" -type f -path '*/build/outputs/*' -print || true
            exit 1
          fi

          OUTPUT_DIR="$GITHUB_WORKSPACE/stage175-output"
          mkdir -p "$OUTPUT_DIR"
          cp "$APK" "$OUTPUT_DIR/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk"
          sha256sum "$OUTPUT_DIR/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk" > "$OUTPUT_DIR/SHA256SUMS.txt"
          ls -lh "$OUTPUT_DIR"

      - name: Stage175 debug APK çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.0.0-STAGE175-DEBUG-APK
          path: stage175-output/*
          if-no-files-found: error
          retention-days: 14
