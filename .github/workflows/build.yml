
name: SONGDNA Studio 2.0.0 - Clean Android Build

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-studio-2-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract, validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::SONGDNA source ZIP not found."
            exit 1
          fi

          echo "Source ZIP: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" -type f -path '*/android-wrapper/settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$(dirname "$SETTINGS_FILE")")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Detected project: $PROJECT_ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses < <(yes)

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate extracted source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f scripts/verify-source.py
          test -f android-wrapper/settings.gradle.kts
          test -f android-wrapper/build.gradle.kts
          test -f android-wrapper/app/build.gradle.kts
          test -f android-wrapper/app/src/main/AndroidManifest.xml
          test -f android-wrapper/app/src/main/java/com/songdna/studio/MainActivity.kt
          test -f android-wrapper/app/src/main/assets/www/index.html
          test -f .github/workflows/build-apk.yml
          test -f www/index.html
          test -f backend/server.js

          python3 scripts/verify-source.py

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -p "$PROJECT_ROOT/android-wrapper" \
            clean assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_ROOT/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-2.0.0-debug-APK
          path: extracted/**/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
