
name: SONGDNA SMART STUDIO 6.2.0 - Stage156 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SONGDNA_SMART_STUDIO_6_2_0_STAGE156_SOURCE.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-6-2-0-stage156-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Stage156 Source Validation and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. GitHub deposunu indir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Kaynak ZIP dosyasını bul ve aç
      - name: Extract and validate Stage156 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_SMART_STUDIO_6_2_0_STAGE156_SOURCE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          echo "Checking ZIP integrity..."
          unzip -t "$ZIP_FILE"

          SOURCE_ROOT="$GITHUB_WORKSPACE/_stage156_source"

          mkdir -p "$SOURCE_ROOT"

          unzip -q "$ZIP_FILE" -d "$SOURCE_ROOT"

          PROJECT_ROOT="$SOURCE_ROOT/songdna95"

          # Ana kaynak dosyalarını doğrula
          test -f "$PROJECT_ROOT/BUILD_MANIFEST.json"
          test -f "$PROJECT_ROOT/BUILD_PACKAGE_MANIFEST_STAGE156.json"
          test -f "$PROJECT_ROOT/requirements-test.txt"
          test -f "$PROJECT_ROOT/scripts/verify-source.py"

          # Android proje dosyalarını doğrula
          test -f "$PROJECT_ROOT/android-wrapper/settings.gradle.kts"
          test -f "$PROJECT_ROOT/android-wrapper/build.gradle.kts"
          test -f "$PROJECT_ROOT/android-wrapper/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/android-wrapper/app/src/main/AndroidManifest.xml"

          # Sürüm manifestini doğrula
          python - "$PROJECT_ROOT/BUILD_MANIFEST.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              manifest = json.load(f)

          assert manifest.get("version") == "6.2.0"

          android = manifest.get("android", {})

          assert android.get("version_code") == 33
          assert android.get("version_name") == "6.2.0"

          print("SONGDNA version: 6.2.0")
          print("Stage: 156")
          print("Android versionCode: 33")
          PY

          echo "source_root=$SOURCE_ROOT" >> "$GITHUB_OUTPUT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          echo "Source archive extracted successfully."

      # 3. Android proje yolunu bul
      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="${{ steps.source.outputs.project_root }}"

          mapfile -t SETTINGS_FILES < <(
            find "$PROJECT_ROOT" \
              -type f \
              -path '*/android-wrapper/settings.gradle.kts' \
              | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Android project."
            exit 1
          fi

          ANDROID_DIR="$(dirname "${SETTINGS_FILES[0]}")"

          test -f "$ANDROID_DIR/build.gradle.kts"
          test -f "$ANDROID_DIR/app/build.gradle.kts"
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          echo "Android project: $ANDROID_DIR"

      # 4. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Node.js 22
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 6. Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 7. Test bağımlılıklarını ZIP içinden yükle
      - name: Install Python test dependencies
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install -r requirements-test.txt

          python -m playwright install --with-deps chromium

      # 8. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 9. Android SDK 35
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      # 10. Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 11. Kaynak bütünlüğü
      - name: Verify source integrity
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          python scripts/verify-source.py

      # 12. JavaScript ve backend kontrolü
      - name: Check JavaScript and backend syntax
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          node --check app.js
          node --check www/app.js
          node --check backend/server.js

          npm --prefix backend run check

      # 13. JavaScript testleri
      - name: Run JavaScript regression tests
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          TESTS=(
            scripts/test-*.js
            tests/test-*.js
            test-gemini-instruction-engine.js
          )

          COUNT=0

          for test_file in "${TESTS[@]}"; do
            [ -f "$test_file" ] || continue

            echo "::group::$test_file"

            node "$test_file"

            echo "::endgroup::"

            COUNT=$((COUNT + 1))
          done

          echo "JavaScript test files passed: $COUNT"

          if [ "$COUNT" -ne 121 ]; then
            echo "ERROR: Expected 121 JavaScript test files."
            echo "Found: $COUNT"
            exit 1
          fi

      # 14. Python testleri
      - name: Run Python regression tests
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          TESTS=(scripts/test-*.py)

          COUNT=0

          for test_file in "${TESTS[@]}"; do
            [ -f "$test_file" ] || continue

            echo "::group::$test_file"

            python "$test_file"

            echo "::endgroup::"

            COUNT=$((COUNT + 1))
          done

          echo "Python test files passed: $COUNT"

          if [ "$COUNT" -ne 5 ]; then
            echo "ERROR: Expected 5 Python test files."
            echo "Found: $COUNT"
            exit 1
          fi

      # 15. Android APK derlemesi
      - name: Build Android Debug APK
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -p "${{ steps.android.outputs.android_dir }}" \
            clean assembleDebug

      # 16. APK doğrulama ve SHA256
      - name: Verify APK and generate SHA256
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="${{ steps.android.outputs.android_dir }}"

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          RELEASE_DIR="$GITHUB_WORKSPACE/release"

          mkdir -p "$RELEASE_DIR"

          cp "$APK" \
            "$RELEASE_DIR/SONGDNA-6.2.0-Stage156-debug.apk"

          SHA256="$(
            sha256sum \
              "$RELEASE_DIR/SONGDNA-6.2.0-Stage156-debug.apk" \
              | awk '{print $1}'
          )"

          echo "$SHA256  SONGDNA-6.2.0-Stage156-debug.apk" \
            > "$RELEASE_DIR/SHA256SUMS.txt"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "APK generated successfully."
          echo "SHA256: $SHA256"

          {
            echo "## SONGDNA SMART STUDIO 6.2.0 - Stage156"
            echo ""
            echo "- Source ZIP: validated"
            echo "- JavaScript tests: 121 passed"
            echo "- Python tests: 5 passed"
            echo "- Android Debug APK: generated"
            echo "- SHA256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 17. APK dosyasını GitHub Actions çıktısına ekle
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-6.2.0-Stage156-Android-APK

          path: |
            ${{ github.workspace }}/release/SONGDNA-6.2.0-Stage156-debug.apk
            ${{ github.workspace }}/release/SHA256SUMS.txt

          if-no-files-found: error
          retention-days: 30
