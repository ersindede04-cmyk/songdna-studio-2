
name: SONGDNA Studio 4.3.2 - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-studio-4-3-2-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build SONGDNA Studio 4.3.2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract 4.3.2 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SONGDNA_Studio_4_3_2_Developer_Package.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::4.3.2 source ZIP not found: $ZIP_FILE"
            echo "Repository root files:"
            ls -la
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/songdna-source"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/SONGDNA-Studio-4.3.2"

          if [[ ! -d "$PROJECT_DIR" ]]; then
            echo "::error::SONGDNA-Studio-4.3.2 project directory not found."
            find "$EXTRACT_DIR" -maxdepth 3 -type d
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "4.3.2 source extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          PIPE_STATUS=("${PIPESTATUS[@]}")
          set -e

          SDKMANAGER_STATUS="${PIPE_STATUS[1]}"

          if [[ "$SDKMANAGER_STATUS" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$SDKMANAGER_STATUS"
          fi

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate SONGDNA 4.3.2 source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/verify-source.py

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR/android-wrapper" \
            clean assembleDebug

      - name: Verify debug APK
        run: |
          test -s "$PROJECT_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-4.3.2-debug-APK
          path: SONGDNA-Studio-4.3.2/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SONGDNA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SONGDNA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONGDNA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONGDNA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$KEYSTORE_B64" &&
                -n "$STORE_PASSWORD" &&
                -n "$KEY_ALIAS" &&
                -n "$KEY_PASSWORD" ]]; then

            KEYSTORE_PATH="$RUNNER_TEMP/songdna-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"

            {
              echo "SONGDNA_KEYSTORE_FILE=$KEYSTORE_PATH"
              echo "SONGDNA_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "SONGDNA_KEY_ALIAS=$KEY_ALIAS"
              echo "SONGDNA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"

            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets missing. Debug APK will still be built."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR/android-wrapper" \
            assembleRelease

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-4.3.2-signed-release-APK
          path: SONGDNA-Studio-4.3.2/android-wrapper/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
