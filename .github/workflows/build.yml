
name: SONGDNA Studio 3.0.0 - Gemini Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-studio-3-gemini-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract, validate and build 3.0.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract exact 3.0.0 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_Studio_3_0_0_Gemini_Developer.zip"

          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "::error::SONGDNA 3.0.0 source ZIP not found."
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/songdna-3.0.0"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f -path '*/android-wrapper/settings.gradle.kts' -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Android project settings.gradle.kts not found."
            find "$EXTRACT_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$(dirname "$SETTINGS_FILE")")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -e

          if [[ "$SDK_STATUS" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$SDK_STATUS"
          fi

          echo "Android SDK licenses accepted."

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate SONGDNA 3.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          REQUIRED_FILES=(
            "android-wrapper/settings.gradle.kts"
            "android-wrapper/build.gradle.kts"
            "android-wrapper/app/build.gradle.kts"
            "android-wrapper/app/src/main/AndroidManifest.xml"
            "backend/server.js"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          if [[ -f "scripts/verify-source.py" ]]; then
            python3 scripts/verify-source.py
          else
            echo "Source verification script not present; basic checks completed."
          fi

      - name: Build SONGDNA Studio 3.0.0 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -p "$PROJECT_ROOT/android-wrapper" \
            clean assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_ROOT/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated or is empty."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload SONGDNA Studio 3.0.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-3.0.0-Gemini-debug-APK
          path: ${{ env.PROJECT_ROOT }}/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
