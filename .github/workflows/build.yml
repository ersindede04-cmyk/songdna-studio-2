
name: SONGDNA SMART STUDIO 7.5.0 - Stage185 Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/SONGDNA_SMART_STUDIO_7_5_0_STAGE185_KAYNAK_PAKETI*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage185-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Stage185 source and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and validate Stage185 ZIP
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import glob
          import os
          import zipfile

          pattern = os.path.join(
              os.environ["GITHUB_WORKSPACE"],
              "**",
              "SONGDNA_SMART_STUDIO_7_5_0_STAGE185_KAYNAK_PAKETI*.zip"
          )

          files = sorted(
              glob.glob(pattern, recursive=True),
              key=os.path.getmtime,
              reverse=True
          )

          print(f"Found {len(files)} Stage185 archive(s).")

          valid = []

          for path in files:
              print(f"Checking: {path}")

              if zipfile.is_zipfile(path):
                  try:
                      with zipfile.ZipFile(path) as archive:
                          bad_file = archive.testzip()

                      if bad_file is None:
                          valid.append(path)
                          print("VALID ZIP")
                      else:
                          print(f"INVALID ZIP: {bad_file}")

                  except Exception as error:
                      print(f"ZIP ERROR: {error}")
              else:
                  print("INVALID: Not a ZIP archive.")

          if not valid:
              raise SystemExit(
                  "ERROR: No valid Stage185 ZIP found. "
                  "Delete the damaged GitHub upload and upload "
                  "the verified original Stage185 ZIP again."
              )

          selected = valid[0]

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"STAGE185_ZIP={selected}\n")

          print(f"Selected valid archive: {selected}")
          PY

      - name: Extract Stage185 source archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$STAGE185_ZIP" \
            -d "$GITHUB_WORKSPACE/source"

          SOURCE_DIR="$(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              -name 'requirements-test.txt' \
              -print -quit |
              xargs -r dirname
          )"

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: Stage185 project directory not found."
            exit 1
          fi

          test -f "$SOURCE_DIR/backend/server.js"
          test -f "$SOURCE_DIR/backend/package.json"
          test -f "$SOURCE_DIR/scripts/verify-source.py"
          test -f "$SOURCE_DIR/scripts/test-stage185-story-blend-deployment.js"
          test -f "$SOURCE_DIR/BUILD_PACKAGE_MANIFEST_STAGE185.json"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Stage185 source extracted successfully."

      - name: Verify Stage185 package identity
        shell: bash
        run: |
          set -euo pipefail

          python - "$SOURCE_DIR/BUILD_PACKAGE_MANIFEST_STAGE185.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              manifest = json.load(file)

          assert manifest["package_stage"] == 185
          assert manifest["application_version"] == "7.5.0"
          assert manifest["backend"]["health_stage"] == 185
          assert manifest["backend"]["story_blend_endpoint"] == "POST /api/story-blend"

          print("PASS: Stage185 package identity verified.")
          PY

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$SOURCE_DIR/requirements-test.txt"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify source and Android asset integrity
        run: python "$SOURCE_DIR/scripts/verify-source.py"

      - name: Verify backend JavaScript syntax
        run: npm --prefix "$SOURCE_DIR/backend" run check

      - name: Verify Stage185 story blending endpoint
        run: node "$SOURCE_DIR/scripts/test-stage185-story-blend-deployment.js"

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find tests scripts \
              -maxdepth 1 \
              -type f \
              -name '*.js' \
              ! -name 'test-stage185-story-blend-deployment.js' \
              -print0 | sort -z
          )

          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "ERROR: No JavaScript tests found."
            exit 1
          fi

          for TEST_FILE in "${TESTS[@]}"; do
            echo "Running: $TEST_FILE"
            node "$TEST_FILE"
          done

      - name: Run Python preflight and regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          python scripts/ci-preflight.py

          mapfile -d '' TESTS < <(
            find scripts \
              -maxdepth 1 \
              -type f \
              -name 'test-*.py' \
              -print0 | sort -z
          )

          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "ERROR: No Python tests found."
            exit 1
          fi

          for TEST_FILE in "${TESTS[@]}"; do
            echo "Running: $TEST_FILE"
            python "$TEST_FILE"
          done

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR/android-wrapper"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK and generate SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/stage185-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/stage185-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE185_DEBUG.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/stage185-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE185_DEBUG.apk" \
            > "$GITHUB_WORKSPACE/stage185-output/SHA256SUMS.txt"

          echo "APK generated successfully."

          {
            echo "## SONGDNA SMART STUDIO 7.5.0 - Stage185"
            echo ""
            echo "- Stage185 ZIP validated."
            echo "- Source extracted."
            echo "- Package identity verified."
            echo "- Source integrity checked."
            echo "- Backend syntax checked."
            echo "- Story blending endpoint tested."
            echo "- Regression tests completed."
            echo "- Android debug APK generated."
            echo "- SHA-256 checksum generated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage185 APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.5.0-STAGE185-ANDROID-DEBUG
          path: stage185-output/*
          if-no-files-found: error
          retention-days: 30
          
