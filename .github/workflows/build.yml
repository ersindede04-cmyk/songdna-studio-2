
name: SONGDNA Studio 5.2.0 Stage 34 - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-stage34-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract, Test and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Stage 34 ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=$(find . -maxdepth 1 -type f \
            -iname '*Stage34*Select*Theme*.zip' \
            -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "::error::Stage 34 ZIP not found in repository root."
            exit 1
          fi

          echo "Found archive: $ARCHIVE"

          mkdir -p stage34-extracted
          unzip -q "$ARCHIVE" -d stage34-extracted

          APP_FILE=$(find stage34-extracted -type f \
            -path '*/www/app.js' -print -quit)

          if [ -z "$APP_FILE" ]; then
            echo "::error::www/app.js not found after ZIP extraction."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_FILE")")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

          test -f "$PROJECT_DIR/www/index.html"
          test -f "$PROJECT_DIR/www/production-preset-engine.js"
          test -f "$PROJECT_DIR/backend/server.js"
          test -f "$PROJECT_DIR/android-wrapper/settings.gradle.kts"
          test -f "$PROJECT_DIR/android-wrapper/app/build.gradle.kts"
          test -f "$PROJECT_DIR/scripts/verify-source.py"
          test -f "$PROJECT_DIR/scripts/test-production-preset-engine.js"

          echo "All required project files verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          python scripts/verify-source.py

      - name: Check JavaScript syntax
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          node --check www/app.js
          node --check www/production-preset-engine.js

      - name: Run production preset tests
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          node scripts/test-production-preset-engine.js

      - name: Run regression tests
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          node scripts/test-stage31-2-music-dna-arrangement.js
          node scripts/test-stage32-arrangement-adlib.js
          node scripts/test-adlib-catalog.js
          node scripts/test-genre-adlib-engine.js
          node scripts/test-global-cultural-adlib.js
          node scripts/test-stage28-cultural-routing.js
          node scripts/test-stage29-client-api-contract.js
          node tests/test-saved-library.js
          node tests/test-production-history.js
          node test-gemini-instruction-engine.js

      - name: Build Android debug APK
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR/android-wrapper" \
            clean assembleDebug

      - name: Verify APK
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          APK="$PROJECT_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          sha256sum "$APK"
          echo "APK verification successful."

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.2.0-Stage34-APK
          path: ${{ steps.source.outputs.project_dir }}/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
