
name: SONGDNA SMART STUDIO 5.2.0 - Stage 60 APK Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SONGDNA_Studio_5_2_0_Stage60_*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage60-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build SONGDNA 5.2.0 APK from Stage 60 source
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Stage 60 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_Studio_5_2_0_Stage60_Android_Build_Fixed.zip"
          if [[ ! -s "$ZIP_FILE" ]]; then
            ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_Studio_5_2_0_Stage60_Production_Model_Editing.zip"
          fi
          test -s "$ZIP_FILE" || { echo '::error::Stage 60 source ZIP not found. Upload the fixed ZIP or the original Stage 60 ZIP to the repository root.'; exit 1; }
          DEST="$RUNNER_TEMP/songdna-stage60"
          mkdir -p "$DEST"
          unzip -q "$ZIP_FILE" -d "$DEST"
          SOURCE_ROOT="$DEST/stage58_work"
          test -d "$SOURCE_ROOT"
          for required in index.html app.js backend/server.js android-wrapper/app/build.gradle.kts scripts/verify-source.py; do
            test -f "$SOURCE_ROOT/$required" || { echo "::error::Missing Stage 60 file: $required"; exit 1; }
          done
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo 'Stage 60 source extracted and verified.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Stage 60 source and run tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          python3 scripts/verify-source.py
          node --check www/app.js
          node --check server.js
          node --check backend/server.js
          npm --prefix backend run check
          shopt -s nullglob
          js_tests=(scripts/test-*.js tests/test-*.js test-gemini-instruction-engine.js)
          for test_file in "${js_tests[@]}"; do node "$test_file"; done
          py_tests=(scripts/test-*.py)
          for test_file in "${py_tests[@]}"; do python3 "$test_file"; done

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/android-wrapper"
          gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$SOURCE_ROOT/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.2.0-Stage60-debug-APK
          path: ${{ runner.temp }}/songdna-stage60/stage58_work/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
