name: SONGDNA SMART STUDIO 7.5.0 - Stage190 Stable Build

on:
  workflow_dispatch:
  push:
    paths:
      - '*STAGE190*KAYNAK*PAKETI*.zip'
      - '*STAGE190*KAYNAK*.zip'
      - '.github/workflows/build.yml'
      - '.github/workflows/songdna-stage190.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage190-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify Stage190 and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate and validate Stage190 ZIP
        id: source_zip
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, zipfile

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          found = set()

          for pattern in (
              '*STAGE190*KAYNAK*PAKETI*.zip',
              '*STAGE190*KAYNAK*.zip'
          ):
              found.update(p for p in root.glob(pattern) if p.is_file())

          candidates = sorted(found)

          if len(candidates) != 1:
              raise SystemExit(
                  '::error::Depo ana dizininde tam olarak bir Stage190 kaynak ZIP bulunmalı. '
                  + str([p.name for p in candidates])
              )

          archive = candidates[0]

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit('ZIP CRC hatası: ' + bad)

              names = z.namelist()

              for name in names:
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Güvensiz ZIP yolu: ' + name)

              manifests = [
                  n for n in names
                  if pathlib.PurePosixPath(n).name
                  == 'BUILD_PACKAGE_MANIFEST_STAGE190.json'
              ]

              if len(manifests) != 1:
                  raise SystemExit(
                      'Stage190 manifest tam olarak bir adet olmalı'
                  )

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'zip_path={archive}\n')
              f.write(f'manifest_path={manifests[0]}\n')

          print('ZIP CRC ve manifest doğrulandı:', archive.name)
          PY

      - name: Extract Stage190 source safely
        id: extract
        shell: bash
        env:
          ZIP_PATH: ${{ steps.source_zip.outputs.zip_path }}
          MANIFEST_PATH: ${{ steps.source_zip.outputs.manifest_path }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import zipfile
          import json

          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'songdna-stage190'
          dest.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(os.environ['ZIP_PATH']) as z:
              z.extractall(dest)

          manifest = dest / os.environ['MANIFEST_PATH']
          root = manifest.parent

          data = json.loads(manifest.read_text())

          if data.get('package_stage') != 190:
              raise SystemExit('Stage190 manifest kimliği geçersiz')

          if data.get('application_version') != '7.5.0':
              raise SystemExit('Uygulama sürümü 7.5.0 değil')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'source_dir={root}\n')

          print('Stage190 kaynak dizini:', root)
          PY

      - name: Verify backend and Render deployment contract
        env:
          SOURCE_DIR: ${{ steps.extract.outputs.source_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          node --check backend/server.js
          node --check server.js

          node tests/test-stage189-render-story-blend.js
          node tests/test-stage181-story-api-integration.js
          node tests/test-stage179-story-blending.js
          node tests/test-stage179-story-lyrics-alignment.js

          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          manifest = json.loads(
              (root / 'BUILD_PACKAGE_MANIFEST_STAGE190.json').read_text()
          )

          assert manifest['render_deployment']['root_directory'] == 'backend'
          assert manifest['backend_contract']['health_stage'] == 190

          assert (
              (root / 'server.js').read_bytes()
              == (root / 'backend/server.js').read_bytes()
          )

          print('Render ve Stage190 deployment metadata doğrulandı')
          PY

      - name: Run complete JavaScript regression suite
        env:
          SOURCE_DIR: ${{ steps.extract.outputs.source_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find tests -type f -name '*.js' -print0 | sort -z
          )

          test "${#TESTS[@]}" -gt 0

          for test_file in "${TESTS[@]}"; do
            echo "--- $test_file"
            node "$test_file"
          done

          echo "JavaScript regression files passed: ${#TESTS[@]}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Install browser regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run Python browser regression suite
        env:
          SOURCE_DIR: ${{ steps.extract.outputs.source_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          for test_file in \
            scripts/test-stage166-interface-browser.py \
            scripts/test-stage170-workspace-browser.py \
            scripts/test-stage30-2-two-tab-navigation.py \
            scripts/test-stage30-3-output-layout.py \
            scripts/test-stage30-4-theme-persistence.py \
            scripts/test-stage31-scene-jargon-browser.py \
            scripts/test-stage54-unified-menus.py
          do
            echo "--- $test_file"
            python "$test_file"
          done

          echo "Python browser regression files passed: 7" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Locate Android Gradle project
        id: android_project
        env:
          SOURCE_DIR: ${{ steps.extract.outputs.source_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib

          root = pathlib.Path(os.environ['SOURCE_DIR'])

          settings = (
              list(root.rglob('settings.gradle'))
              + list(root.rglob('settings.gradle.kts'))
          )

          settings = [
              p for p in settings
              if 'node_modules' not in p.parts
              and '.gradle' not in p.parts
          ]

          preferred = [
              p for p in settings
              if p.parent.name == 'android-wrapper'
          ]

          options = preferred or settings

          if len(options) != 1:
              raise SystemExit(
                  'Android Gradle projesi bulunamadı veya belirsiz'
              )

          if not (options[0].parent / 'app').is_dir():
              raise SystemExit('Android app klasörü bulunamadı')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'project_dir={options[0].parent}\n')

          print('Android project:', options[0].parent)
          PY

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          test -d "$SDK_ROOT" || {
            echo "::error::Android SDK bulunamadı: $SDK_ROOT"
            exit 1
          }

          SDKMANAGER="$(
            find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null \
              | sort | tail -n 1
          )"

          test -n "$SDKMANAGER" || {
            echo '::error::cmdline-tools/sdkmanager bulunamadı'
            exit 1
          }

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Build Android debug APK
        env:
          PROJECT_DIR: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK and create checksum
        env:
          PROJECT_DIR: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK" || {
            echo '::error::APK bulunamadı'
            exit 1
          }

          mkdir -p stage190-output

          cp "$APK" \
            stage190-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE190_DEBUG.apk

          (
            cd stage190-output
            sha256sum *.apk > SHA256SUMS.txt
          )

          {
            echo '## Stage190'
            echo ''
            echo '- Stage190 source and Render story-blend contract verified.'
            echo '- Story blending focused regression tests passed.'
            echo '- Android debug APK built and SHA-256 generated.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage190 APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.5.0-STAGE190-ANDROID
          path: stage190-output/*
          if-no-files-found: error
          retention-days: 30
          
