
name: SONGDNA SMART STUDIO 5.5.0 FINAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SONGDNA_SMART_STUDIO_v5_5_0_FINAL.zip'
      - '**/SONGDNA_SMART_STUDIO_v5_5_0_FINAL.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-5-5-0-final-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract source, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Locate and extract 5.5.0 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SONGDNA_SMART_STUDIO_v5_5_0_FINAL.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found: $ZIP_FILE"
            echo "Repository root contents:"
            ls -lah
            exit 1
          fi

          mkdir -p _songdna_source
          unzip -tq "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d _songdna_source

          SOURCE_DIR="_songdna_source/songdna_stage82"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: Expected folder songdna_stage82 was not found."
            find _songdna_source -maxdepth 3 -type d
            exit 1
          fi

          cp -a "$SOURCE_DIR/." .

          echo "Source ZIP extracted successfully."
          test -f app.js
          test -f index.html
          test -f scripts/verify-source.py
          test -d android-wrapper
          test -f backend/server.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source files and synchronized copies
        run: |
          python3 scripts/verify-source.py

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check www/app.js
          node --check backend/server.js

      - name: Check backend package
        run: npm --prefix backend run check

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          JS_TESTS=(
            scripts/test-*.js
            tests/test-*.js
            test-gemini-instruction-engine.js
          )

          for test_file in "${JS_TESTS[@]}"; do
            echo "Running: $test_file"
            node "$test_file"
          done

      - name: Run Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          PY_TESTS=(scripts/test-*.py)

          for test_file in "${PY_TESTS[@]}"; do
            echo "Running: $test_file"
            python3 "$test_file"
          done

      - name: Build SONGDNA 5.5.0 Debug APK
        run: |
          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            -p android-wrapper \
            clean assembleDebug

      - name: Verify APK and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          echo "APK build successful."
          echo "SHA256: $SHA256"

          {
            echo "## SONGDNA SMART STUDIO 5.5.0 FINAL"
            echo ""
            echo "- Source: GitHub uploaded ZIP"
            echo "- Source extraction: successful"
            echo "- Regression tests: successful"
            echo "- APK: app-debug.apk"
            echo "- SHA256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-v5.5.0-FINAL-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
