
name: SONGDNA SMART STUDIO 7.0.0 Stage173 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SONGDNA_SMART_STUDIO_7_0_0_STAGE173_DERLEME_KITI*.zip'
      - 'SONGDNA_SMART_STUDIO_7_0_0_STAGE173_KAYNAK.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-7-0-0-stage173-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify source and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract uploaded build kit or source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          KIT_ZIP=""
          SOURCE_ZIP=""

          while IFS= read -r -d '' candidate; do
            KIT_ZIP="$candidate"
            break
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
            -name 'SONGDNA_SMART_STUDIO_7_0_0_STAGE173_DERLEME_KITI*.zip' -print0)

          mkdir -p "$GITHUB_WORKSPACE/package-unpacked" "$GITHUB_WORKSPACE/source"

          if [[ -n "$KIT_ZIP" ]]; then
            echo "Full build kit found: $(basename "$KIT_ZIP")"
            unzip -q "$KIT_ZIP" -d "$GITHUB_WORKSPACE/package-unpacked"

            while IFS= read -r -d '' candidate; do
              SOURCE_ZIP="$candidate"
              break
            done < <(find "$GITHUB_WORKSPACE/package-unpacked" -type f \
              -name 'SONGDNA_SMART_STUDIO_7_0_0_STAGE173_KAYNAK.zip' -print0)
          else
            SOURCE_ZIP="$GITHUB_WORKSPACE/SONGDNA_SMART_STUDIO_7_0_0_STAGE173_KAYNAK.zip"
          fi

          test -n "$SOURCE_ZIP"
          test -s "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE/source"

          SOURCE_DIR="$(find "$GITHUB_WORKSPACE/source" -type f \
            -name 'requirements-test.txt' -printf '%h\n' -quit)"
          test -n "$SOURCE_DIR"
          test -f "$SOURCE_DIR/scripts/verify-source.py"
          test -d "$SOURCE_DIR/android-wrapper"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Using source directory: $SOURCE_DIR"

      - name: Install Python test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "$SOURCE_DIR/requirements-test.txt"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify source and Android asset synchronization
        run: python "$SOURCE_DIR/scripts/verify-source.py"

      - name: Check backend JavaScript syntax
        run: npm --prefix "$SOURCE_DIR/backend" run check

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          mapfile -d '' TESTS < <(find tests scripts -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          echo "JavaScript test files found: ${#TESTS[@]}"
          test "${#TESTS[@]}" -eq 130
          for TEST_FILE in "${TESTS[@]}"; do
            echo "--- Running $TEST_FILE"
            node "$TEST_FILE"
          done

      - name: Run Python and browser regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          python scripts/ci-preflight.py
          mapfile -d '' TESTS < <(find scripts -maxdepth 1 -type f -name 'test-*.py' -print0 | sort -z)
          echo "Python/browser test files found: ${#TESTS[@]}"
          test "${#TESTS[@]}" -eq 7
          for TEST_FILE in "${TESTS[@]}"; do
            echo "--- Running $TEST_FILE"
            python "$TEST_FILE"
          done

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR/android-wrapper"
          gradle :app:assembleDebug --no-daemon

      - name: Verify APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="$SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/stage173-output"
          cp "$APK" "$GITHUB_WORKSPACE/stage173-output/SONGDNA_SMART_STUDIO_7_0_0_STAGE173_DEBUG.apk"
          cd "$GITHUB_WORKSPACE/stage173-output"
          sha256sum SONGDNA_SMART_STUDIO_7_0_0_STAGE173_DEBUG.apk > SHA256SUMS.txt

      - name: Upload Android debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.0.0-STAGE173-DEBUG-APK
          path: stage173-output/*
          if-no-files-found: error
          retention-days: 14
          
