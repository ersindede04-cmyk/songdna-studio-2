
name: SONGDNA Studio 4.7.0 - Android APK

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-studio-4-7-0-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract, clean, validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and safely extract 4.7.0 package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SONGDNA_Studio_4_7_0_Developer_Package.zip"
          PACKAGE_COPY="$RUNNER_TEMP/SONGDNA_Studio_4_7_0_Developer_Package.zip"
          EXTRACT_DIR="$RUNNER_TEMP/songdna-source"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::4.7.0 ZIP package not found in repository root."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi

          cp "$ZIP_FILE" "$PACKAGE_COPY"

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$PACKAGE_COPY" -d "$EXTRACT_DIR"

          SOURCE_DIR="$EXTRACT_DIR/SONGDNA-Studio-4.7.0"

          if [[ ! -d "$SOURCE_DIR" ]]; then
            echo "::error::Expected SONGDNA-Studio-4.7.0 folder was not found."
            find "$EXTRACT_DIR" -maxdepth 4 -type d -print
            exit 1
          fi

          if [[ ! -f "$SOURCE_DIR/scripts/verify-source.py" ]]; then
            echo "::error::Source validation script is missing."
            exit 1
          fi

          rsync -a "$SOURCE_DIR/" "$GITHUB_WORKSPACE/" \
            --exclude='.git/'

          echo "SONGDNA Studio 4.7.0 source extracted successfully."

      - name: Remove all ZIP archives from build workspace
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          removed = []

          for item in root.rglob("*"):
              if item.suffix.lower() == ".zip" and (item.is_file() or item.is_symlink()):
                  removed.append(item)
          
          for item in removed:
              print("Removing:", item.relative_to(root))
              item.unlink()

          print(f"ZIP cleanup completed. Removed: {len(removed)}")
          PY

      - name: Verify ZIP cleanup
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          remaining = [
              item for item in Path.cwd().rglob("*")
              if item.suffix.lower() == ".zip"
              and (item.is_file() or item.is_symlink())
          ]

          if remaining:
              print("ERROR: ZIP archives remain:")
              for item in remaining:
                  print(item)
              raise SystemExit(1)

          print("PASS: No ZIP archives remain in build workspace.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          PIPE_STATUS=("${PIPESTATUS[@]}")
          set -e

          SDKMANAGER_STATUS="${PIPE_STATUS[1]}"

          if [[ "$SDKMANAGER_STATUS" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$SDKMANAGER_STATUS"
          fi

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-source.py

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all \
            -p android-wrapper clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-4.7.0-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SONGDNA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SONGDNA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONGDNA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONGDNA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/songdna-release.jks"

            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"

            {
              echo "SONGDNA_KEYSTORE_FILE=$KEYSTORE_PATH"
              echo "SONGDNA_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "SONGDNA_KEY_ALIAS=$KEY_ALIAS"
              echo "SONGDNA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"

            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are incomplete; skipping signed release."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p android-wrapper assembleRelease

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-4.7.0-signed-release-APK
          path: android-wrapper/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
