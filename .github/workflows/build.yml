
name: SONGDNA SMART STUDIO 6.1.0 - Stage152 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: songdna-stage152-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ZIP_NAME: SONGDNA_SMART_STUDIO_6_1_0_STAGE152_SOURCE.zip
  JAVA_VERSION: "17"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Stage152 source validation and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract exact Stage152 ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for exact Stage152 source archive..."

          ZIP_PATH="$(find . -type f \
            -name "$SOURCE_ZIP_NAME" \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Exact Stage152 ZIP not found: $SOURCE_ZIP_NAME"
            echo "Available ZIP files:"
            find . -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "Found: $ZIP_PATH"

          SOURCE_DIR="$RUNNER_TEMP/SONGDNA_STAGE152_SOURCE"
          mkdir -p "$SOURCE_DIR"

          unzip -t "$ZIP_PATH"
          unzip -q "$ZIP_PATH" -d "$SOURCE_DIR"

          if [ -z "$(find "$SOURCE_DIR" -type f -print -quit)" ]; then
            echo "::error::Source ZIP is empty."
            exit 1
          fi

          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"

          echo "Stage152 source extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          elif [ -f backend/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r backend/requirements.txt
          else
            echo "No Python requirements file found."
          fi

      - name: Install backend dependencies
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          if [ -f backend/package-lock.json ]; then
            npm ci --prefix backend
          elif [ -f backend/package.json ]; then
            npm install --prefix backend
          else
            echo "Backend package.json not found; skipping."
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses and install SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate Android project automatically
        id: android
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/node_modules/*' \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          else
            BUILD_FILE="$(find "$SOURCE_DIR" -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -not -path '*/node_modules/*' \
              -not -path '*/.gradle/*' \
              -exec grep -l 'com.android.application' {} \; \
              -print -quit)"

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_ROOT="$(dirname "$BUILD_FILE")"
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Android Gradle project could not be located."
            find "$SOURCE_DIR" -type f \
              \( -name build.gradle -o -name settings.gradle \
              -o -name build.gradle.kts -o -name settings.gradle.kts \) \
              -print
            exit 1
          fi

          echo "Android project: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Verify source integrity and synchronized assets
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          if [ -f scripts/verify-source.py ]; then
            python scripts/verify-source.py
          else
            echo "Source verification script not found; basic ZIP validation already passed."
          fi

      - name: Check JavaScript syntax and backend scripts
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          for FILE in app.js www/app.js backend/server.js; do
            if [ -f "$FILE" ]; then
              echo "Checking $FILE"
              node --check "$FILE"
            fi
          done

          if [ -f backend/package.json ]; then
            npm --prefix backend run check --if-present
          fi

      - name: Run JavaScript regression tests
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          shopt -s nullglob

          TESTS=(
            scripts/test-*.js
            tests/test-*.js
            test-gemini-instructions.js
          )

          COUNT=0

          for TEST_FILE in "${TESTS[@]}"; do
            if [ ! -f "$TEST_FILE" ]; then
              continue
            fi

            echo "::group::JavaScript test: $TEST_FILE"
            node "$TEST_FILE"
            echo "::endgroup::"

            COUNT=$((COUNT + 1))
          done

          echo "Passed JavaScript test files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No matching JavaScript regression test files were found."
          fi

      - name: Run Python regression tests
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          shopt -s nullglob

          TESTS=(
            scripts/test-*.py
            tests/test_*.py
          )

          COUNT=0

          for TEST_FILE in "${TESTS[@]}"; do
            if [ ! -f "$TEST_FILE" ]; then
              continue
            fi

            echo "::group::Python test: $TEST_FILE"
            python "$TEST_FILE"
            echo "::endgroup::"

            COUNT=$((COUNT + 1))
          done

          echo "Passed Python test files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No matching Python regression test files were found."
          fi

      - name: Build Android debug APK
        id: build
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.android.outputs.project_root }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Building SONGDNA SMART STUDIO 6.1.0 Stage152"

          gradle assembleDebug --no-daemon --stacktrace

          APK_PATH="$(find "$PROJECT_ROOT" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Generated APK is empty."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/SONGDNA_STAGE152_RELEASE"

          FINAL_APK="$RUNNER_TEMP/SONGDNA_STAGE152_RELEASE/SONGDNA-6.1.0-Stage152-debug.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo "apk_path=$FINAL_APK" >> "$GITHUB_OUTPUT"

          echo "APK generated successfully."
          ls -lh "$FINAL_APK"

      - name: Verify APK and generate SHA256
        id: verify
        shell: bash
        env:
          APK_PATH: ${{ steps.build.outputs.apk_path }}
        run: |
          set -euo pipefail

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK verification failed."
            exit 1
          fi

          if ! command -v aapt >/dev/null 2>&1; then
            echo "::error::Android aapt tool is unavailable."
            exit 1
          fi

          aapt dump badging "$APK_PATH" >/dev/null

          RELEASE_DIR="$(dirname "$APK_PATH")"

          cd "$RELEASE_DIR"

          sha256sum "$(basename "$APK_PATH")" \
            > SHA256SUMS.txt

          SHA256="$(sha256sum "$(basename "$APK_PATH")" | awk '{print $1}')"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "APK integrity verification passed."
          echo "SHA-256: $SHA256"

      - name: Upload Stage152 APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-6.1.0-Stage152-Android-APK
          path: |
            ${{ steps.build.outputs.apk_path }}
            ${{ runner.temp }}/SONGDNA_STAGE152_RELEASE/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        env:
          SOURCE_NAME: ${{ env.SOURCE_ZIP_NAME }}
          PROJECT_ROOT: ${{ steps.android.outputs.project_root }}
          APK_PATH: ${{ steps.build.outputs.apk_path }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          {
            echo "## SONGDNA SMART STUDIO 6.1.0"
            echo ""
            echo "### Stage152 Android Build"
            echo ""
            echo "- Source ZIP: $SOURCE_NAME"
            echo "- Java: $JAVA_VERSION"
            echo "- Node.js: $NODE_VERSION"
            echo "- Python: $PYTHON_VERSION"
            echo "- Android SDK: $ANDROID_API"
            echo "- Build Tools: $ANDROID_BUILD_TOOLS"
            echo "- Gradle: $GRADLE_VERSION"
            echo "- Android project: ${PROJECT_ROOT:-Not detected}"
            echo "- APK: ${APK_PATH:-Not generated}"
            echo "- SHA-256: ${SHA256:-Not available}"
            echo ""
            if [ -n "$APK_PATH" ] && [ -s "$APK_PATH" ]; then
              echo "APK file generated."
            else
              echo "APK was not generated. Check failed workflow step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
