
name: SONGDNA Studio 5.0.0 - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-studio-5-0-0-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build SONGDNA 5.0.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source
        run: python3 scripts/verify-source.py

      - name: Check JavaScript syntax
        run: |
          node --check www/app.js
          node --check backend/server.js

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all -p android-wrapper clean assembleDebug

      - name: Verify APK
        run: test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.0.0-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
