name: SONGDNA SMART STUDIO 7.5.0 - Stage187 Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'SONGDNA_SMART_STUDIO_7_5_0_STAGE187_KAYNAK_PAKETI.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage187-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Stage187 source and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and validate exact Stage187 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME='SONGDNA_SMART_STUDIO_7_5_0_STAGE187_KAYNAK_PAKETI.zip'
          ZIP_FILE="$GITHUB_WORKSPACE/$ZIP_NAME"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Stage187 ZIP not found. Upload the exact original file '$ZIP_NAME' to the repository root."
            echo "ZIP files currently in repository root:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f (%s bytes)\n' || true
            exit 1
          fi

          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "::error::Stage187 ZIP is empty. Upload the complete original archive again."
            exit 1
          fi

          python - "$ZIP_FILE" <<'PY'
          import sys, zipfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]
          required = 'SONGDNA_SMART_STUDIO_7_5_0_STAGE187/BUILD_PACKAGE_MANIFEST_STAGE187.json'

          try:
              with zipfile.ZipFile(archive) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f'ZIP CRC error: {bad}')

                  names = set(z.namelist())

                  if required not in names:
                      raise SystemExit(
                          f'Wrong archive or missing Stage187 manifest: {required}'
                      )

                  if any(
                      PurePosixPath(n).is_absolute()
                      or '..' in PurePosixPath(n).parts
                      for n in names
                  ):
                      raise SystemExit('Unsafe path found in ZIP archive')

          except (zipfile.BadZipFile, OSError) as exc:
              raise SystemExit(f'Invalid ZIP archive: {exc}')

          print('Stage187 ZIP integrity and package identity: PASS')
          PY

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Stage187 source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="$GITHUB_WORKSPACE/stage187-source"
          mkdir -p "$SOURCE_ROOT"

          python - "$ZIP_FILE" "$SOURCE_ROOT" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as z:
              z.extractall(sys.argv[2])
          PY

          SOURCE_DIR="$SOURCE_ROOT/SONGDNA_SMART_STUDIO_7_5_0_STAGE187"

          test -f "$SOURCE_DIR/BUILD_PACKAGE_MANIFEST_STAGE187.json"
          test -f "$SOURCE_DIR/requirements-test.txt"
          test -f "$SOURCE_DIR/android-wrapper/settings.gradle.kts"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Verify Stage187 package identity and verifier copies
        shell: bash
        run: |
          set -euo pipefail

          python - "$SOURCE_DIR" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])

          manifest = json.loads(
              (root / 'BUILD_PACKAGE_MANIFEST_STAGE187.json')
              .read_text(encoding='utf-8')
          )

          assert manifest.get('package_stage') == 187, \
              'Manifest must identify Stage187'

          assert manifest.get('application_version') == '7.5.0', \
              'Unexpected application version'

          canonical = (root / 'scripts/verify-source.py').read_bytes()

          copies = [
              root / 'www/scripts/verify-source.py',
              root / 'android-wrapper/app/src/main/assets/scripts/verify-source.py'
          ]

          for path in copies:
              assert path.is_file() and path.read_bytes() == canonical, \
                  f'Verifier copy mismatch: {path}'

          print('Stage187 identity and all verifier copies: PASS')
          PY

      - name: Install Python test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "$SOURCE_DIR/requirements-test.txt"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify source and Android asset integrity
        run: python "$SOURCE_DIR/scripts/verify-source.py"

      - name: Verify backend JavaScript syntax
        run: npm --prefix "$SOURCE_DIR/backend" run check

      - name: Verify Stage187 story blending endpoint
        run: node "$SOURCE_DIR/scripts/test-stage185-story-blend-deployment.js"

      - name: Run all JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find tests scripts -maxdepth 1 -type f -name '*.js' -print0 2>/dev/null | sort -z
          )

          echo "JavaScript regression files found: ${#TESTS[@]}"

          if [[ ${#TESTS[@]} -eq 0 ]]; then
            echo "::error::No JavaScript regression tests found."
            exit 1
          fi

          for TEST_FILE in "${TESTS[@]}"; do
            echo "--- $TEST_FILE"
            node "$TEST_FILE"
          done

      - name: Run Python preflight and regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          python scripts/ci-preflight.py

          mapfile -d '' TESTS < <(
            find scripts -maxdepth 1 -type f -name 'test-*.py' -print0 | sort -z
          )

          echo "Python regression files found: ${#TESTS[@]}"

          for TEST_FILE in "${TESTS[@]}"; do
            echo "--- $TEST_FILE"
            python "$TEST_FILE"
          done

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR/android-wrapper"

          gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK and generate SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/stage187-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/stage187-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE187_DEBUG.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/stage187-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE187_DEBUG.apk" \
            > "$GITHUB_WORKSPACE/stage187-output/SHA256SUMS.txt"

          {
            echo '## SONGDNA SMART STUDIO 7.5.0 — Stage187'
            echo ''
            echo '- Stage187 source ZIP validated before extraction.'
            echo '- Source and WebView/Android verifier copies synchronized.'
            echo '- JavaScript and Python regression suites completed.'
            echo '- Android debug APK and SHA-256 generated.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage187 APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.5.0-STAGE187-ANDROID
          path: stage187-output/*
          if-no-files-found: error
          retention-days: 30
