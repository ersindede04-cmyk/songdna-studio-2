
name: SONGDNA SMART STUDIO 7.0.0 Stage175 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: songdna-stage175-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Verify Stage175 source and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      GRADLE_VERSION: "8.9"

    steps:
      - name: Kaynak deposunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK ortamını hazırla
        uses: android-actions/setup-android@v3

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          sdkmanager --list_installed

      - name: Stage175 kaynak ZIP dosyasını bul ve güvenli şekilde aç
        id: source
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          repo = Path.cwd()
          work = Path("/tmp/songdna-stage175")
          work.mkdir(parents=True, exist_ok=True)

          archives = [
              p for p in repo.rglob("*.zip")
              if ".git" not in p.parts
              and "node_modules" not in p.parts
              and "build" not in p.parts
          ]

          def priority(path):
              name = path.name.upper()
              if "STAGE175" in name and "KAYNAK" in name:
                  return 0
              if "STAGE175" in name and "DERLEME_KITI" in name:
                  return 1
              if "STAGE175" in name:
                  return 2
              return 3

          archives.sort(key=lambda p: (priority(p), len(p.parts), str(p)))

          if not archives:
              raise SystemExit("Stage175 kaynak ZIP dosyası bulunamadı.")

          extracted = set()

          def safe_extract(archive, destination):
              destination = destination.resolve()
              with zipfile.ZipFile(archive) as zf:
                  for member in zf.infolist():
                      target = (destination / member.filename).resolve()
                      if target != destination and destination not in target.parents:
                          raise RuntimeError(
                              f"Güvenli olmayan ZIP yolu: {member.filename}"
                          )
                  zf.extractall(destination)

          for index, archive in enumerate(archives):
              target = work / f"archive_{index}"
              target.mkdir(parents=True, exist_ok=True)
              print(f"Arşiv açılıyor: {archive.name}")
              safe_extract(archive, target)
              extracted.add(target)

          # Arşivlerin içinde bulunan kaynak ZIP dosyalarını da aç.
          for depth in range(4):
              nested = []
              for folder in list(extracted):
                  nested.extend(
                      p for p in folder.rglob("*.zip")
                      if p not in extracted
                  )

              if not nested:
                  break

              for index, archive in enumerate(nested):
                  target = work / f"nested_{depth}_{index}"
                  target.mkdir(parents=True, exist_ok=True)
                  print(f"İç kaynak arşivi açılıyor: {archive.name}")
                  safe_extract(archive, target)
                  extracted.add(target)

          all_dirs = {work}
          for folder in extracted:
              all_dirs.add(folder)
              all_dirs.update(p for p in folder.rglob("*") if p.is_dir())

          candidates = []

          for folder in all_dirs:
              has_verify = (folder / "scripts" / "verify-source.py").is_file()
              has_gradle = (
                  (folder / "settings.gradle").is_file()
                  or (folder / "settings.gradle.kts").is_file()
              )

              if has_verify and has_gradle:
                  candidates.append(folder)

          if not candidates:
              # Bazı projelerde Android Gradle kökü alt dizindedir.
              for folder in all_dirs:
                  has_verify = (folder / "scripts" / "verify-source.py").is_file()
                  if not has_verify:
                      continue

                  gradle_files = list(folder.rglob("settings.gradle")) + \
                                 list(folder.rglob("settings.gradle.kts"))
                  if gradle_files:
                      candidates.append(folder)

          if not candidates:
              raise SystemExit(
                  "Kaynak arşivleri açıldı ancak verify-source.py "
                  "ve Android Gradle proje kökü birlikte bulunamadı."
              )

          candidates = sorted(
              set(candidates),
              key=lambda p: (
                  len(p.relative_to(work).parts),
                  str(p)
              )
          )

          project_root = candidates[0]
          verify_script = project_root / "scripts" / "verify-source.py"

          gradle_roots = []
          for folder in [project_root] + [
              p for p in project_root.rglob("*") if p.is_dir()
          ]:
              if (
                  (folder / "settings.gradle").is_file()
                  or (folder / "settings.gradle.kts").is_file()
              ):
                  gradle_roots.append(folder)

          if not gradle_roots:
              raise SystemExit("Android Gradle proje kökü bulunamadı.")

          gradle_root = sorted(
              set(gradle_roots),
              key=lambda p: (len(p.parts), str(p))
          )[0]

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"PROJECT_ROOT={project_root}\n")
              env.write(f"GRADLE_ROOT={gradle_root}\n")

          print(f"Proje kökü: {project_root}")
          print(f"Gradle kökü: {gradle_root}")
          print(f"Kaynak doğrulama dosyası: {verify_script}")
          PY

      - name: Python test bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f "$PROJECT_ROOT/requirements.txt" ]; then
            pip install -r "$PROJECT_ROOT/requirements.txt"
          elif [ -f "$PROJECT_ROOT/pyproject.toml" ]; then
            echo "pyproject.toml bulundu; zorunlu olmayan bağımlılıklar atlandı."
          else
            echo "Python bağımlılık dosyası bulunmadı; devam ediliyor."
          fi

          pip install playwright
          playwright install --with-deps chromium

      - name: Backend Node.js bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_ROOT/backend/package-lock.json" ]; then
            npm --prefix "$PROJECT_ROOT/backend" ci
          elif [ -f "$PROJECT_ROOT/backend/package.json" ]; then
            npm --prefix "$PROJECT_ROOT/backend" install
          else
            echo "Backend package.json bulunamadı."
          fi

      - name: Kaynak ve Android varlık bütünlüğünü doğrula
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python scripts/verify-source.py

      - name: Backend JavaScript sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_ROOT/server.js" ]; then
            node --check "$PROJECT_ROOT/server.js"
          fi

          if [ -f "$PROJECT_ROOT/backend/server.js" ]; then
            node --check "$PROJECT_ROOT/backend/server.js"
          fi

      - name: Backend kontrol komutunu çalıştır
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_ROOT/backend/package.json" ]; then
            npm --prefix "$PROJECT_ROOT/backend" run check --if-present
          fi

      - name: JavaScript regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          count=0

          while IFS= read -r -d '' test_file; do
            echo "Test: $test_file"
            node "$test_file"
            count=$((count + 1))
          done < <(
            find scripts -maxdepth 1 -type f \
              -name 'test-*.js' -print0 2>/dev/null
          )

          echo "Çalıştırılan JavaScript test sayısı: $count"

      - name: Python ve tarayıcı regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          count=0

          while IFS= read -r -d '' test_file; do
            echo "Python testi: $test_file"
            python "$test_file"
            count=$((count + 1))
          done < <(
            find scripts -maxdepth 1 -type f \
              -name 'test-*.py' -print0 2>/dev/null
          )

          echo "Çalıştırılan Python test sayısı: $count"

      - name: Android Gradle projesini derle
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRADLE_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: APK dosyasını ve SHA-256 değerini doğrula
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$GITHUB_WORKSPACE/stage175-apk"
          mkdir -p "$OUTPUT_DIR"

          mapfile -t APK_FILES < <(
            find "$GRADLE_ROOT" -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -name '*debug*.apk' | sort
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "Debug APK bulunamadı."
            exit 1
          fi

          APK="${APK_FILES[0]}"
          cp "$APK" "$OUTPUT_DIR/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk"

          cd "$OUTPUT_DIR"
          sha256sum SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk \
            | tee SHA256SUMS.txt

          echo "APK_PATH=$OUTPUT_DIR/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk" \
            >> "$GITHUB_ENV"

      - name: Stage175 debug APK çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG_APK
          path: |
            stage175-apk/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk
            stage175-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          
