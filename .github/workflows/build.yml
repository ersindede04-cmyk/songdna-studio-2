
name: SONGDNA Studio 4.7.0 - Android APK

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-studio-4-7-0-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract, validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract 4.7.0 package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SONGDNA_Studio_4_7_0_Developer_Package.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::4.7.0 ZIP package not found in repository root."
            echo "Available 4.7.0 packages:"
            find . -maxdepth 1 -iname '*4_7_0*.zip' -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/songdna-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/songdna-source"

          SOURCE_DIR="$RUNNER_TEMP/songdna-source/SONGDNA-Studio-4.7.0"

          if [[ ! -d "$SOURCE_DIR" ]]; then
            echo "::error::Expected source folder was not found inside ZIP."
            find "$RUNNER_TEMP/songdna-source" -maxdepth 3 -type d -print
            exit 1
          fi

          if [[ ! -f "$SOURCE_DIR/scripts/verify-source.py" ]]; then
            echo "::error::Source validation script is missing."
            exit 1
          fi

          rsync -a "$SOURCE_DIR/" "$GITHUB_WORKSPACE/" \
            --exclude='.git/'

          echo "SONGDNA Studio 4.7.0 source extracted successfully."

      - name: Remove nested ZIP archives
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          folders = ("www", "android-wrapper", "backend", "scripts")
          removed = []

          for name in folders:
              folder = Path(name)
              if not folder.exists():
                  continue

              for item in folder.rglob("*"):
                  if item.suffix.lower() == ".zip" and (item.is_file() or item.is_symlink()):
                      removed.append(str(item))
                      item.unlink()

          print("Removed nested ZIP archives:")
          for item in removed:
              print(" -", item)

          print(f"Total removed: {len(removed)}")
          PY

      - name: Verify no nested ZIP archives remain
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          folders = ("www", "android-wrapper", "backend", "scripts")
          remaining = []

          for name in folders:
              folder = Path(name)
              if folder.exists():
                  for item in folder.rglob("*"):
                      if item.suffix.lower() == ".zip" and (item.is_file() or item.is_symlink()):
                          remaining.append(str(item))

          if remaining:
              print("ERROR: Nested ZIP archives still exist:")
              for item in remaining:
                  print(" -", item)
              raise SystemExit(1)

          print("PASS: No nested ZIP archives remain.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          PIPE_STATUS=("${PIPESTATUS[@]}")
          set -e

          SDKMANAGER_STATUS="${PIPE_STATUS[1]}"

          if [[ "$SDKMANAGER_STATUS" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$SDKMANAGER_STATUS"
          fi

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source
        run: python3 scripts/verify-source.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all -p android-wrapper clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not created."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-4.7.0-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SONGDNA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SONGDNA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONGDNA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONGDNA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/songdna-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"

            {
              echo "SONGDNA_KEYSTORE_FILE=$KEYSTORE_PATH"
              echo "SONGDNA_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "SONGDNA_KEY_ALIAS=$KEY_ALIAS"
              echo "SONGDNA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"

            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are incomplete; skipping signed release."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: gradle --no-daemon --stacktrace -p android-wrapper assembleRelease

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-4.7.0-signed-release-APK
          path: android-wrapper/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
