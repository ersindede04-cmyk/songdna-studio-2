
name: SONGDNA Studio 5.2.0 Stage 34 - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-studio-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Validate and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f www/app.js
          test -f www/index.html
          test -f www/production-preset-engine.js
          test -f android-wrapper/app/build.gradle.kts
          test -f backend/server.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          status=${PIPESTATUS[1]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source
        run: python scripts/verify-source.py

      - name: Check JavaScript syntax
        run: |
          node --check www/app.js
          node --check www/production-preset-engine.js

      - name: Run production preset tests
        run: node scripts/test-production-preset-engine.js

      - name: Run existing regression tests
        run: |
          node scripts/test-stage31-2-music-dna-arrangement.js
          node scripts/test-stage32-arrangement-adlib.js
          node scripts/test-adlib-catalog.js
          node scripts/test-genre-adlib-engine.js
          node scripts/test-global-cultural-adlib.js
          node scripts/test-stage28-cultural-routing.js
          node scripts/test-stage29-client-api-contract.js
          node tests/test-saved-library.js
          node tests/test-production-history.js
          node test-gemini-instruction-engine.js

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace \
            --warning-mode all \
            -p android-wrapper clean assembleDebug

      - name: Verify APK
        run: |
          test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.2.0-Stage34-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
