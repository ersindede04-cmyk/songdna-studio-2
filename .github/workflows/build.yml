
name: SONGDNA SMART STUDIO 7.0.0 Stage175 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: songdna-stage175-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify Stage175 source and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # --------------------------------------------------
      # 1. Geliştirme ortamı
      # --------------------------------------------------

      - name: Kaynak deposunu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache kapalı: Depoda henüz bulunmayan lock dosyaları
      # nedeniyle setup-node adımının başarısız olması önlenir.
      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Gradle sürümünü kaynak projenin Gradle Wrapper'ı belirler.
      - name: Gradle ortamını hazırla
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------
      # 2. Android SDK
      # --------------------------------------------------

      - name: Android SDK ortamını hazırla
        uses: android-actions/setup-android@v3

      - name: Gerekli Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK yolu bulunamadı."
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager \
              -path '*/bin/sdkmanager' \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager bulunamadı."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK paketleri hazır."

      # --------------------------------------------------
      # 3. Stage175 kaynak ZIP dosyasını bul ve aç
      # --------------------------------------------------

      - name: Stage175 kaynak ZIP dosyasını güvenli şekilde bul ve aç
        shell: bash
        run: |
          set -euo pipefail

          echo "Stage175 kaynak arşivi aranıyor..."

          mapfile -d '' ARCHIVES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*stage175*.zip' \
              -not -path '*/.git/*' \
              -print0 | sort -z
          )

          if [ "${#ARCHIVES[@]}" -eq 0 ]; then
            echo "::error::Stage175 kaynak ZIP dosyası bulunamadı."

            echo "Depodaki ZIP dosyaları:"
            find "$GITHUB_WORKSPACE" \
              -type f -iname '*.zip' -print

            exit 1
          fi

          echo "Bulunan arşivler:"
          printf '%s\n' "${ARCHIVES[@]}"

          SOURCE_ZIP=""

          for ARCHIVE in "${ARCHIVES[@]}"; do
            if [[ "$ARCHIVE" =~ [Ss][Oo][Uu][Rr][Cc][Ee] ]]; then
              SOURCE_ZIP="$ARCHIVE"
              break
            fi
          done

          if [ -z "$SOURCE_ZIP" ]; then
            if [ "${#ARCHIVES[@]}" -ne 1 ]; then
              echo "::error::Birden fazla Stage175 ZIP bulundu ancak SOURCE arşivi belirlenemedi."
              exit 1
            fi

            SOURCE_ZIP="${ARCHIVES[0]}"
          fi

          echo "Seçilen arşiv: $SOURCE_ZIP"

          unzip -tq "$SOURCE_ZIP"

          mkdir -p "$RUNNER_TEMP/songdna-source"

          unzip -q "$SOURCE_ZIP" \
            -d "$RUNNER_TEMP/songdna-source"

          echo "SONGDNA_SOURCE_DIR=$RUNNER_TEMP/songdna-source" \
            >> "$GITHUB_ENV"

          echo "Stage175 kaynak arşivi başarıyla açıldı."

      # --------------------------------------------------
      # 4. Python test bağımlılıkları
      # --------------------------------------------------

      - name: Python test bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"

          python -m pip install --upgrade pip

          if [ -f "$ROOT/requirements.txt" ]; then
            python -m pip install -r "$ROOT/requirements.txt"

          elif [ -f "$ROOT/pyproject.toml" ]; then
            python -m pip install "$ROOT"

          else
            echo "Kaynak kökünde Python bağımlılık dosyası yok."
          fi

          python -m pip install playwright

      - name: Playwright Chromium kur
        shell: bash
        run: |
          set -euo pipefail

          python -m playwright install --with-deps chromium

      # --------------------------------------------------
      # 5. Kaynak bütünlüğü ve backend kontrolü
      # --------------------------------------------------

      - name: Kaynak ve Android varlık bütünlüğünü doğrula
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"

          VERIFY="$(find "$ROOT" -type f \
            -path '*/scripts/verify-source.py' \
            -print -quit)"

          if [ -z "$VERIFY" ]; then
            echo "::error::verify-source.py bulunamadı."
            exit 1
          fi

          python "$VERIFY"

      - name: Backend JavaScript sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"
          BACKEND="$ROOT/backend"

          if [ ! -f "$BACKEND/package.json" ]; then
            echo "::error::Backend package.json bulunamadı."
            exit 1
          fi

          cd "$BACKEND"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          npm run check

      # --------------------------------------------------
      # 6. JavaScript regresyon testleri
      # --------------------------------------------------

      - name: JavaScript regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"
          cd "$ROOT"

          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          fi

          COUNT=0

          while IFS= read -r -d '' TEST; do
            echo "JavaScript testi: $TEST"
            node "$TEST"
            COUNT=$((COUNT + 1))
          done < <(
            find scripts \
              -maxdepth 1 \
              -type f \
              -name 'test-*.js' \
              -print0 2>/dev/null | sort -z
          )

          echo "JavaScript test sayısı: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::JavaScript testleri bulunamadı."
            exit 1
          fi

      # --------------------------------------------------
      # 7. Python ve tarayıcı regresyon testleri
      # --------------------------------------------------

      - name: Python ve tarayıcı regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"
          cd "$ROOT"

          COUNT=0

          while IFS= read -r -d '' TEST; do
            echo "Python testi: $TEST"
            python "$TEST"
            COUNT=$((COUNT + 1))
          done < <(
            find scripts \
              -maxdepth 1 \
              -type f \
              \( -name 'test-*.py' -o -name 'test_*.py' \) \
              -print0 2>/dev/null | sort -z
          )

          echo "Python test sayısı: $COUNT"

      # --------------------------------------------------
      # 8. Android Gradle projesini bul
      # --------------------------------------------------

      - name: Android Gradle projesini bul
        id: android
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"

          mapfile -d '' WRAPPERS < <(
            find "$ROOT" \
              -type f \
              -name gradlew \
              -not -path '*/.gradle/*' \
              -print0 | sort -z
          )

          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "::error::Android Gradle Wrapper bulunamadı."
            exit 1
          fi

          if [ "${#WRAPPERS[@]}" -gt 1 ]; then
            echo "Birden fazla Gradle Wrapper bulundu:"
            printf '%s\n' "${WRAPPERS[@]}"
          fi

          WRAPPER="${WRAPPERS[0]}"
          PROJECT_DIR="$(dirname "$WRAPPER")"

          chmod +x "$WRAPPER"

          echo "Gradle Wrapper: $WRAPPER"
          echo "Proje dizini: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 9. Android Debug APK oluştur
      # --------------------------------------------------

      - name: Android debug APK oluştur
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.android.outputs.project_dir }}"
          WRAPPER="${{ steps.android.outputs.wrapper }}"

          cd "$PROJECT_DIR"

          "$WRAPPER" --version

          "$WRAPPER" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 10. APK ve SHA-256 doğrulaması
      # --------------------------------------------------

      - name: APK dosyasını ve SHA-256 değerini doğrula
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"

          mapfile -d '' APKS < <(
            find "$ROOT" \
              -type f \
              -path '*/build/outputs/apk/*/debug/*.apk' \
              -print0 | sort -z
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Debug APK çıktısı bulunamadı."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          APK="${APKS[0]}"

          DEST="$GITHUB_WORKSPACE/artifacts/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk"

          cp "$APK" "$DEST"

          test -s "$DEST"

          sha256sum "$DEST" \
            | tee "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"

          echo "APK başarıyla doğrulandı."

      # --------------------------------------------------
      # 11. GitHub Actions çıktısını yükle
      # --------------------------------------------------

      - name: Stage175 debug APK çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG_APK
          path: |
            artifacts/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          
