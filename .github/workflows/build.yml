
name: SONGDNA SMART STUDIO 7.1.0 - Stage180 Full Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'SONGDNA_SMART_STUDIO_7_1_0_STAGE180_KAYNAK.zip'
      - '.github/workflows/SONGDNA_STAGE180.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage180-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Stage180 Full Verification and APK Build
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Stage180 Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_SMART_STUDIO_7_1_0_STAGE180_KAYNAK.zip"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "Stage180 ZIP file not found!"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          SOURCE_DIR="$GITHUB_WORKSPACE/source/SONGDNA_SMART_STUDIO_7_1_0_STAGE180"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Stage180 source directory not found!"
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Install Python Test Dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r "$SOURCE_DIR/requirements-test.txt"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify Stage180 Source Integrity
        run: |
          python "$SOURCE_DIR/scripts/verify-source.py"

      - name: Verify Backend JavaScript Syntax
        run: |
          npm --prefix "$SOURCE_DIR/backend" run check

      - name: Run 139 JavaScript Regression Tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find tests scripts -maxdepth 1 \
              -type f -name '*.js' -print0 | sort -z
          )

          echo "JavaScript tests: ${#TESTS[@]}"

          if [ "${#TESTS[@]}" -ne 139 ]; then
            echo "Unexpected JavaScript test count!"
            exit 1
          fi

          for TEST_FILE in "${TESTS[@]}"; do
            echo "Running: $TEST_FILE"
            node "$TEST_FILE"
          done

      - name: Run Python Preflight
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python scripts/ci-preflight.py

      - name: Run 7 Python Browser Regression Tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find scripts -maxdepth 1 \
              -type f -name 'test-*.py' -print0 | sort -z
          )

          echo "Python tests: ${#TESTS[@]}"

          if [ "${#TESTS[@]}" -ne 7 ]; then
            echo "Unexpected Python test count!"
            exit 1
          fi

          for TEST_FILE in "${TESTS[@]}"; do
            echo "Running: $TEST_FILE"
            python "$TEST_FILE"
          done

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android-wrapper"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK and Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK build failed!"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/stage180-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/stage180-output/SONGDNA_SMART_STUDIO_7_1_0_STAGE180_DEBUG.apk"

          cd "$GITHUB_WORKSPACE/stage180-output"

          sha256sum SONGDNA_SMART_STUDIO_7_1_0_STAGE180_DEBUG.apk \
            > SHA256SUMS.txt

          echo "Stage180 APK successfully generated."

      - name: Publish Build Summary
        if: always()
        run: |
          {
            echo "# SONGDNA SMART STUDIO 7.1.0"
            echo "## Stage180 Build Report"
            echo ""
            echo "- Source: Stage180"
            echo "- Version: 7.1.0"
            echo "- Android versionCode: 40"
            echo "- Backend: Node.js 20"
            echo "- JavaScript regression target: 139"
            echo "- Python regression target: 7"
            echo "- Android APK: Debug"
            echo ""
            echo "See individual workflow steps for actual test results."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage180 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.1.0-STAGE180-ANDROID
          path: stage180-output/
          if-no-files-found: error
          retention-days: 30
          
