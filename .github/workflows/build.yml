
name: SONGDNA SMART STUDIO 7.0.0 Stage175 Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SONGDNA_SMART_STUDIO_7_0_0_STAGE175_KAYNAK.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-7-0-0-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify source and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Kaynak deposunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Stage175 kaynak ZIP dosyasını aç
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_KAYNAK.zip"

          test -s "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          SOURCE_DIR="$GITHUB_WORKSPACE/source/SONGDNA_SMART_STUDIO_7_0_0_STAGE175"

          test -d "$SOURCE_DIR"
          test -f "$SOURCE_DIR/requirements-test.txt"
          test -f "$SOURCE_DIR/scripts/verify-source.py"
          test -d "$SOURCE_DIR/android-wrapper"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Python test bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            -r "$SOURCE_DIR/requirements-test.txt"

      - name: Playwright Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: Kaynak ve Android varlık bütünlüğünü doğrula
        run: python "$SOURCE_DIR/scripts/verify-source.py"

      - name: Backend JavaScript sözdizimini doğrula
        run: npm --prefix "$SOURCE_DIR/backend" run check

      - name: JavaScript regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find tests scripts -maxdepth 1 \
              -type f -name '*.js' -print0 | sort -z
          )

          echo "Bulunan JavaScript test dosyası: ${#TESTS[@]}"

          test "${#TESTS[@]}" -eq 131

          for TEST_FILE in "${TESTS[@]}"; do
            echo "--- $TEST_FILE"
            node "$TEST_FILE"
          done

      - name: Python ve tarayıcı regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python scripts/ci-preflight.py

          mapfile -d '' TESTS < <(
            find scripts -maxdepth 1 \
              -type f -name 'test-*.py' -print0 | sort -z
          )

          echo "Bulunan Python test dosyası: ${#TESTS[@]}"

          test "${#TESTS[@]}" -eq 7

          for TEST_FILE in "${TESTS[@]}"; do
            echo "--- $TEST_FILE"
            python "$TEST_FILE"
          done

      - name: Android debug APK oluştur
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android-wrapper"

          gradle :app:assembleDebug --no-daemon

      - name: APK ve SHA-256 doğrula
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/stage175-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/stage175-output/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/stage175-output/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk" \
            > "$GITHUB_WORKSPACE/stage175-output/SHA256SUMS.txt"

      - name: Debug APK çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.0.0-STAGE175-DEBUG-APK
          path: stage175-output/*
          if-no-files-found: error
          retention-days: 14
          
