
name: SONGDNA SMART STUDIO 7.5.0 - Stage195 Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-stage195-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify and Build Stage195 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Stage195 source
        uses: actions/checkout@v4

      - name: Locate Stage195 project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "requirements-test.txt" ]; then
            PROJECT="$PWD"

          elif [ -f "SONGDNA_SMART_STUDIO_7_5_0_STAGE195/requirements-test.txt" ]; then
            PROJECT="$PWD/SONGDNA_SMART_STUDIO_7_5_0_STAGE195"

          else
            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -iname '*STAGE195*.zip' -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "Stage195 kaynak klasörü veya ZIP dosyası bulunamadı."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/stage195-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/stage195-source"

            REQUIREMENTS=$(find "$RUNNER_TEMP/stage195-source" \
              -type f -name requirements-test.txt -print -quit)

            if [ -z "$REQUIREMENTS" ]; then
              echo "requirements-test.txt bulunamadı."
              exit 1
            fi

            PROJECT=$(dirname "$REQUIREMENTS")
          fi

          if [ ! -f "$PROJECT/android-wrapper/settings.gradle" ] && \
             [ ! -f "$PROJECT/android-wrapper/settings.gradle.kts" ]; then
            echo "Android wrapper proje dosyaları bulunamadı."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Stage195 proje dizini: $PROJECT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Python test dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Verify Stage195 source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python scripts/verify-source.py
          npm --prefix backend run check

      - name: Run JavaScript regression tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' TESTS < <(
            find tests scripts -maxdepth 1 \
              -type f -name '*.js' -print0 | sort -z
          )

          test "${#TESTS[@]}" -gt 0

          for test_file in "${TESTS[@]}"; do
            echo "Running: $test_file"
            node "$test_file"
          done

      - name: Run Python and browser regression tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python scripts/ci-preflight.py

          shopt -s nullglob
          TESTS=(scripts/test-*.py)

          for test_file in "${TESTS[@]}"; do
            echo "Running: $test_file"
            python "$test_file"
          done

      - name: Build Stage195 Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle -p android-wrapper \
            :app:assembleDebug \
            --no-daemon

      - name: Verify APK and calculate checksum
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK oluşturulamadı veya dosya boş."
            exit 1
          fi

          mkdir -p stage195-output

          cp "$APK" \
            stage195-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE195_DEBUG.apk

          cd stage195-output
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload Stage195 APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.5.0-STAGE195-ANDROID
          path: ${{ env.PROJECT_DIR }}/stage195-output/*
          if-no-files-found: error
          retention-days: 30
          
  
