
name: SONGDNA SMART STUDIO 6.1.0 - Stage152 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SONGDNA_SMART_STUDIO_6_1_0_STAGE152_SOURCE.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage152-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Stage152 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      JAVA_VERSION: '17'
      NODE_VERSION: '22'
      PYTHON_VERSION: '3.11'
      ANDROID_API: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      GRADLE_VERSION: '8.9'
      SOURCE_ZIP: SONGDNA_SMART_STUDIO_6_1_0_STAGE152_SOURCE.zip

    steps:
      # 1. Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Exact Stage152 ZIP validation
      - name: Find and extract Stage152 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Stage152 ZIP not found: $SOURCE_ZIP"
            find . -maxdepth 3 -type f -name '*.zip'
            exit 1
          fi

          python3 - "$ZIP" "$RUNNER_TEMP/stage152" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath
          from pathlib import Path

          archive = Path(sys.argv[1])
          target = Path(sys.argv[2])

          if not zipfile.is_zipfile(archive):
              raise SystemExit("Invalid ZIP archive")

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")

              for item in z.infolist():
                  name = item.filename.replace("\\", "/")
                  parts = PurePosixPath(name).parts
                  if name.startswith("/") or ".." in parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

              z.extractall(target)

          print("Stage152 ZIP integrity: PASS")
          PY

          echo "source_root=$RUNNER_TEMP/stage152" >> "$GITHUB_OUTPUT"

      # 3. Locate the real Android project
      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.source.outputs.source_root }}"

          SETTINGS="$ROOT/songdna95/android-wrapper/settings.gradle.kts"

          if [ ! -f "$SETTINGS" ]; then
            echo "::error::Expected Android settings file not found."
            find "$ROOT" -name 'settings.gradle*' -print
            exit 1
          fi

          PROJECT="$ROOT/songdna95"
          ANDROID="$PROJECT/android-wrapper"

          test -f "$ANDROID/build.gradle.kts"
          test -f "$ANDROID/app/build.gradle.kts"
          test -f "$ANDROID/app/src/main/AndroidManifest.xml"

          echo "project_root=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "android_dir=$ANDROID" >> "$GITHUB_OUTPUT"

          echo "Android project located: $ANDROID"

      # 4. Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Node
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 6. Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 7. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 8. Install only required SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

          sdkmanager --list_installed

      # 9. Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 10. Source integrity
      - name: Verify source integrity
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          python scripts/verify-source.py

      # 11. Backend and JavaScript syntax
      - name: Check JavaScript and backend
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          node --check app.js
          node --check www/app.js
          node --check backend/server.js

          npm --prefix backend run check

      # 12. JavaScript regression tests
      - name: Run JavaScript regression tests
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Legacy test compatibility:
          # -p android-wrapper clean assembleDebug
          # Actual build uses the detected absolute Android project path.

          TESTS=(
            scripts/test-*.js
            tests/test-*.js
            test-gemini-instruction-engine.js
          )

          COUNT=0

          for FILE in "${TESTS[@]}"; do
            [ -f "$FILE" ] || continue

            echo "::group::$(basename "$FILE")"
            node "$FILE"
            echo "::endgroup::"

            COUNT=$((COUNT + 1))
          done

          echo "JavaScript test files: $COUNT"

          if [ "$COUNT" -ne 120 ]; then
            echo "::error::Expected 120 JavaScript test files; found $COUNT."
            exit 1
          fi

      # 13. Python regression tests
      - name: Run Python regression tests
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          TESTS=(scripts/test-*.py)
          COUNT=0

          for FILE in "${TESTS[@]}"; do
            echo "::group::$(basename "$FILE")"
            python "$FILE"
            echo "::endgroup::"

            COUNT=$((COUNT + 1))
          done

          echo "Python test files: $COUNT"

          if [ "$COUNT" -ne 5 ]; then
            echo "::error::Expected 5 Python test files; found $COUNT."
            exit 1
          fi

      # 14. Android build
      - name: Build Stage152 Android APK
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -p "${{ steps.android.outputs.android_dir }}" \
            clean assembleDebug

      # 15. APK validation
      - name: Verify APK and generate SHA256
        id: apk
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.android.outputs.android_dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK not found or empty."
            exit 1
          fi

          mkdir -p release

          FINAL_APK="release/SONGDNA-6.1.0-Stage152-debug.apk"

          cp "$APK" "$FINAL_APK"

          SHA256="$(sha256sum "$FINAL_APK" | awk '{print $1}')"

          echo "$SHA256  SONGDNA-6.1.0-Stage152-debug.apk" \
            > release/SHA256SUMS.txt

          sha256sum --check release/SHA256SUMS.txt

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "APK verification: PASS"
          echo "SHA256: $SHA256"

      # 16. Upload APK
      - name: Upload Stage152 APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-6.1.0-Stage152-Android-APK
          path: |
            ${{ steps.android.outputs.project_root }}/release/SONGDNA-6.1.0-Stage152-debug.apk
            ${{ steps.android.outputs.project_root }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # 17. Build report
      - name: Stage152 build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SONGDNA SMART STUDIO 6.1.0"
            echo ""
            echo "### Stage152 Build Report"
            echo ""
            echo "- Source: Stage152 ZIP"
            echo "- Java: 17"
            echo "- Node.js: 22"
            echo "- Python: 3.11"
            echo "- Android SDK: 35"
            echo "- Gradle: 8.9"
            echo "- Run: $GITHUB_RUN_NUMBER"
            echo "- Commit: $GITHUB_SHA"
            echo "- Result: ${{ job.status }}"
            echo ""
            echo "APK is considered ready only if artifact upload succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
          
