
name: SONGDNA Studio 5.2.0 - Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_ZIP_PATTERN: 'SONGDNA_Studio_5_2_0_Integrated_Source_Package_*.zip'

concurrency:
  group: songdna-studio-5-2-0-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract source ZIP, verify, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
              -iname "$SOURCE_ZIP_PATTERN" \
              -not -path '*/.git/*' -print | sort
          )

          if [[ ${#ZIP_FILES[@]} -eq 0 ]]; then
            echo "::error::SONGDNA 5.2.0 kaynak ZIP bulunamadı."
            exit 1
          fi

          if [[ ${#ZIP_FILES[@]} -ne 1 ]]; then
            echo "::error::Birden fazla kaynak ZIP bulundu. Yalnızca güncel ZIP bırakın."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          EXTRACT_DIR="$GITHUB_WORKSPACE/songdna-source"

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          mapfile -t ROOTS < <(
            find "$EXTRACT_DIR" -type f \
              -path '*/backend/server.js' \
              -printf '%h\n' | sed 's#/backend$##' | sort -u
          )

          if [[ ${#ROOTS[@]} -ne 1 ]]; then
            echo "::error::ZIP içinde tek bir proje kökü bulunamadı."
            printf '%s\n' "${ROOTS[@]}"
            exit 1
          fi

          PROJECT_ROOT="${ROOTS[0]}"

          for required in \
            index.html \
            app.js \
            www/index.html \
            www/app.js \
            backend/server.js \
            backend/package.json \
            scripts/verify-source.py \
            android-wrapper/settings.gradle.kts \
            android-wrapper/build.gradle.kts \
            android-wrapper/app/build.gradle.kts \
            android-wrapper/app/src/main/AndroidManifest.xml
          do
            if [[ ! -f "$PROJECT_ROOT/$required" ]]; then
              echo "::error::Eksik kaynak dosyası: $required"
              exit 1
            fi
          done

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Kaynak ZIP başarıyla açıldı."
          echo "Proje kökü: $PROJECT_ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source and run tests
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-source.py

          node --check app.js
          node --check www/app.js
          node --check server.js
          node --check backend/server.js

          npm --prefix backend run check

          for test_file in scripts/test-*.js tests/test-*.js test-gemini-instruction-engine.js; do
            if [[ -f "$test_file" ]]; then
              echo "Running $test_file"
              node "$test_file"
            fi
          done

          for test_file in scripts/test-*.py; do
            if [[ -f "$test_file" ]]; then
              echo "Running $test_file"
              python3 "$test_file"
            fi
          done

          for file in \
            index.html \
            app.js \
            saved-library.js \
            production-history.js \
            adlib-catalog.js \
            global-cultural-adlib.js \
            genre-adlib-engine.js \
            production-preset-engine.js \
            scene-jargon-catalog.js \
            emotion-engine.js \
            production-adaptation-engine.js \
            energy-engine.js \
            adlib-intelligence-engine.js \
            atmosphere-engine.js \
            section-arrangement-engine.js \
            vocal-identity-engine.js
          do
            for target in \
              "$file" \
              "android-wrapper/app/src/main/assets/$file" \
              "android-wrapper/app/src/main/assets/www/$file"
            do
              if [[ ! -f "$target" ]]; then
                echo "::error::Android/WebView dosyası eksik: $target"
                exit 1
              fi
            done
          done

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_root }}
        run: |
          gradle --no-daemon --stacktrace --warning-mode all \
            -p android-wrapper clean assembleDebug

      - name: Verify APK and create checksum
        working-directory: ${{ steps.source.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK dosyası oluşturulamadı."
            exit 1
          fi

          sha256sum "$APK" | tee \
            android-wrapper/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.2.0-debug-APK
          path: |
            ${{ steps.source.outputs.project_root }}/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.source.outputs.project_root }}/android-wrapper/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Configure optional release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SONGDNA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SONGDNA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONGDNA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONGDNA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/songdna-release.jks"

            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"

            {
              echo "SONGDNA_KEYSTORE_FILE=$KEYSTORE_PATH"
              echo "SONGDNA_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "SONGDNA_KEY_ALIAS=$KEY_ALIAS"
              echo "SONGDNA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"

            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "İmzalama sırları bulunamadı. Debug APK üretilecek."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ${{ steps.source.outputs.project_root }}
        run: |
          gradle --no-daemon --stacktrace --warning-mode all \
            -p android-wrapper assembleRelease

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.2.0-signed-release-APK
          path: ${{ steps.source.outputs.project_root }}/android-wrapper/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
