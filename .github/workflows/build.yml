
name: SONGDNA SMART STUDIO 5.2.0 - Stage 60.1 APK Build

on:
  push:
    branches:
      - main
    paths:
      - 'SONGDNA_Studio_5_2_0_Stage60_1_Production_Prompt_Hotfix_v2.zip'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-stage60-1-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build SONGDNA Stage 60.1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded Stage 60.1 v2 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_Studio_5_2_0_Stage60_1_Production_Prompt_Hotfix_v2.zip"

          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "::error::Stage60.1 v2 ZIP file not found in repository root."
            exit 1
          fi

          DEST="$RUNNER_TEMP/songdna-stage60-1"
          mkdir -p "$DEST"

          unzip -q "$ZIP_FILE" -d "$DEST"

          SOURCE_ROOT="$DEST/stage58_work"

          if [[ ! -d "$SOURCE_ROOT" ]]; then
            echo "::error::stage58_work directory not found inside ZIP."
            echo "ZIP contents:"
            unzip -Z1 "$ZIP_FILE" | head -80
            exit 1
          fi

          if [[ ! -f "$SOURCE_ROOT/scripts/verify-source.py" ]]; then
            echo "::error::Source verification script missing."
            exit 1
          fi

          if [[ ! -f "$SOURCE_ROOT/android-wrapper/app/build.gradle.kts" ]]; then
            echo "::error::Android Gradle project missing."
            exit 1
          fi

          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

          echo "Stage60.1 v2 source extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Stage 60.1 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_ROOT"

          python3 scripts/verify-source.py

      - name: Verify synchronized build manifests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_ROOT"

          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("BUILD_MANIFEST.json"),
              Path("www/BUILD_MANIFEST.json"),
              Path("android-wrapper/app/src/main/assets/BUILD_MANIFEST.json"),
              Path("android-wrapper/app/src/main/assets/www/BUILD_MANIFEST.json")
          ]

          for path in paths:
              if not path.is_file():
                  raise SystemExit(f"Missing manifest: {path}")

          manifests = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in paths
          ]

          if not all(item == manifests[0] for item in manifests[1:]):
              raise SystemExit("BUILD_MANIFEST.json copies do not match.")

          print("PASS: All four build manifests are identical.")
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_ROOT"

          node --check app.js
          node --check www/app.js
          node --check backend/server.js

          echo "JavaScript syntax checks passed."

      - name: Run backend checks
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_ROOT"

          if node -e "process.exit(require('./backend/package.json').scripts?.check ? 0 : 1)"; then
            npm --prefix backend run check
          else
            echo "No backend check script declared; syntax checks already completed."
          fi

      - name: Run available regression tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_ROOT"

          shopt -s nullglob

          JS_TESTS=(
            scripts/test-*.js
            tests/test-*.js
            test-gemini-instruction-engine.js
          )

          for test_file in "${JS_TESTS[@]}"; do
            if [[ -f "$test_file" ]]; then
              echo "Running: $test_file"
              node "$test_file"
            fi
          done

          PY_TESTS=(scripts/test-*.py)

          for test_file in "${PY_TESTS[@]}"; do
            if [[ -f "$test_file" ]]; then
              echo "Running: $test_file"
              python3 "$test_file"
            fi
          done

      - name: Build Stage 60.1 Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_ROOT/android-wrapper"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean assembleDebug

      - name: Verify APK and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_ROOT/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          OUTPUT="$RUNNER_TEMP/songdna-stage60-1-output"

          mkdir -p "$OUTPUT"

          FINAL_APK="SONGDNA-Studio-5.2.0-Stage60.1-debug.apk"

          cp "$APK" "$OUTPUT/$FINAL_APK"

          SHA256="$(sha256sum "$OUTPUT/$FINAL_APK" | awk '{print $1}')"

          {
            echo "## SONGDNA SMART STUDIO 5.2.0 - Stage 60.1"
            echo ""
            echo "- Source ZIP: Stage60.1 v2"
            echo "- Source verification: passed"
            echo "- Manifest synchronization: passed"
            echo "- JavaScript syntax: passed"
            echo "- Android build: passed"
            echo "- APK: $FINAL_APK"
            echo "- SHA256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exactly one APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.2.0-Stage60.1-debug-APK
          path: ${{ runner.temp }}/songdna-stage60-1-output/SONGDNA-Studio-5.2.0-Stage60.1-debug.apk
          if-no-files-found: error
          retention-days: 14
          
