
name: SONGDNA SMART STUDIO 5.2.0 - Stage 60.1 APK Build

on:
  push:
    branches:
      - main
    paths:
      - 'SONGDNA_Studio_5_2_0_Stage60_1_Production_Prompt_Hotfix.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage60-1-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build SONGDNA 5.2.0 Stage 60.1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_Studio_5_2_0_Stage60_1_Production_Prompt_Hotfix.zip"
          test -s "$ZIP_FILE" || { echo "::error::ZIP not found"; exit 1; }
          DEST="$RUNNER_TEMP/songdna-stage60-1"
          mkdir -p "$DEST"
          unzip -q "$ZIP_FILE" -d "$DEST"
          SOURCE_ROOT="$DEST/stage58_work"
          test -d "$SOURCE_ROOT" || { echo "::error::stage58_work folder missing"; exit 1; }
          for required in index.html www/app.js backend/server.js backend/package.json android-wrapper/app/build.gradle.kts scripts/verify-source.py; do
            test -f "$SOURCE_ROOT/$required" || { echo "::error::Missing $required"; exit 1; }
          done
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install browser-test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source and run tests
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          python3 scripts/verify-source.py
          node --check www/app.js
          node --check server.js
          node --check backend/server.js
          npm --prefix backend run check
          shopt -s nullglob
          js_tests=(scripts/test-*.js tests/test-*.js test-gemini-instruction-engine.js)
          for test_file in "${js_tests[@]}"; do
            node "$test_file"
          done
          py_tests=(scripts/test-*.py)
          for test_file in "${py_tests[@]}"; do
            python3 "$test_file"
          done

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/android-wrapper"
          gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Verify APK and calculate SHA-256
        id: apk
        run: |
          set -euo pipefail
          APK="$SOURCE_ROOT/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo '## SONGDNA Stage 60.1 APK'
            echo ''
            echo '- Build: successful'
            echo '- APK: SONGDNA-Studio-5.2.0-Stage60.1-debug.apk'
            echo "- SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/songdna-apk-output"
          cp "$APK" "$RUNNER_TEMP/songdna-apk-output/SONGDNA-Studio-5.2.0-Stage60.1-debug.apk"

      - name: Upload one APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.2.0-Stage60.1-debug-APK
          path: ${{ runner.temp }}/songdna-apk-output/SONGDNA-Studio-5.2.0-Stage60.1-debug.apk
          if-no-files-found: error
          retention-days: 14
          
