
name: SONGDNA SMART STUDIO 6.1.0 - Stage168 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**/SONGDNA_SMART_STUDIO_6_1_0_STAGE168_KAYNAK.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: songdna-stage168-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Stage168 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Locate and extract Stage168 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -name 'SONGDNA_SMART_STUDIO_6_1_0_STAGE168_KAYNAK.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Stage168 source ZIP was not found."
            exit 1
          fi

          echo "Found source archive: $ZIP_FILE"

          unzip -t "$ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/songdna-stage168"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/songdna-stage168"

          ANDROID_DIR="$(find "$RUNNER_TEMP/songdna-stage168" -type f -name 'settings.gradle.kts' -path '*/android-wrapper/settings.gradle.kts' -print -quit | xargs -r dirname)"

          if [ -z "$ANDROID_DIR" ] || [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android project not found inside Stage168 ZIP."
            exit 1
          fi

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $ANDROID_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: false

      - name: Check Stage168 source and Android configuration
        shell: bash
        env:
          ANDROID_DIR: ${{ steps.source.outputs.android_dir }}
        run: |
          set -euo pipefail

          PROJECT_DIR="$(dirname "$ANDROID_DIR")"

          test -f "$PROJECT_DIR/BUILD_PACKAGE_MANIFEST_STAGE168.json"
          test -f "$PROJECT_DIR/QA_REPORT_6_1_0_STAGE168.md"
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          test -f "$ANDROID_DIR/app/src/main/assets/www/index.html"
          test -f "$ANDROID_DIR/app/src/main/assets/www/app.js"

          node --check "$ANDROID_DIR/app/src/main/assets/app.js"
          node --check "$ANDROID_DIR/app/src/main/assets/www/app.js"

          grep -q 'applicationId = "com.songdna.studio"' "$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionName = "6.1.0"' "$ANDROID_DIR/app/build.gradle.kts"

      - name: Build installable debug APK
        shell: bash
        env:
          ANDROID_DIR: ${{ steps.source.outputs.android_dir }}
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace -p "$ANDROID_DIR" clean assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-6.1.0-STAGE168-DEBUG-APK
          path: ${{ steps.source.outputs.android_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
