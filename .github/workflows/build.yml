
name: SONGDNA SMART STUDIO Stage172 Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SONGDNA_SMART_STUDIO_6_1_1_STAGE172_KAYNAK.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage172-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynak deposunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Stage172 kaynak ZIP dosyasını aç
        shell: bash
        run: |
          set -euo pipefail
          test -f SONGDNA_SMART_STUDIO_6_1_1_STAGE172_KAYNAK.zip
          mkdir -p source
          unzip -q SONGDNA_SMART_STUDIO_6_1_1_STAGE172_KAYNAK.zip -d source
          test -d source/SONGDNA_SMART_STUDIO_6_1_1_STAGE172
          echo "SOURCE_DIR=$GITHUB_WORKSPACE/source/SONGDNA_SMART_STUDIO_6_1_1_STAGE172" >> "$GITHUB_ENV"

      - name: Python test bağımlılıklarını kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$SOURCE_DIR/requirements-test.txt"

      - name: Playwright Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: Kaynak ve Android varlık bütünlüğünü doğrula
        working-directory: ${{ github.workspace }}
        run: python "$SOURCE_DIR/scripts/verify-source.py"

      - name: Backend JavaScript sözdizimini doğrula
        run: npm --prefix "$SOURCE_DIR/backend" run check

      - name: Tüm JavaScript regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          mapfile -d '' tests < <(find tests scripts -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          echo "JavaScript test sayısı: ${#tests[@]}"
          test "${#tests[@]}" -eq 130
          for test_file in "${tests[@]}"; do
            echo "--- $test_file"
            node "$test_file"
          done

      - name: Tüm Python ve tarayıcı regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          mapfile -d '' tests < <(find scripts -maxdepth 1 -type f -name 'test-*.py' -print0 | sort -z)
          echo "Python test sayısı: ${#tests[@]}"
          test "${#tests[@]}" -eq 7
          python scripts/ci-preflight.py
          for test_file in "${tests[@]}"; do
            echo "--- $test_file"
            python "$test_file"
          done

      - name: Android debug APK oluştur
        working-directory: ${{ github.workspace }}
        run: |
          cd "$SOURCE_DIR/android-wrapper"
          gradle :app:assembleDebug --no-daemon

      - name: APK ve SHA-256 doğrula
        shell: bash
        run: |
          set -euo pipefail
          APK="$SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/stage172-output"
          cp "$APK" "$GITHUB_WORKSPACE/stage172-output/SONGDNA_SMART_STUDIO_6_1_1_STAGE172_DEBUG.apk"
          sha256sum "$GITHUB_WORKSPACE/stage172-output/SONGDNA_SMART_STUDIO_6_1_1_STAGE172_DEBUG.apk" > "$GITHUB_WORKSPACE/stage172-output/SHA256SUMS.txt"

      - name: Debug APK çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-6.1.1-STAGE172-DEBUG-APK
          path: stage172-output/*
          if-no-files-found: error
          retention-days: 14
          
