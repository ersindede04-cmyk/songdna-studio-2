
name: SONGDNA SMART STUDIO 6.1.0 - Current Source APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app.js'
      - 'index.html'
      - 'www/**'
      - 'backend/**'
      - 'android-wrapper/**'
      - 'scripts/**'
      - 'tests/**'
      - 'BUILD_MANIFEST.json'
      - 'render.yaml'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-current-source-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Validate current source and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout current repository source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify synchronized source and manifests
        run: python3 scripts/verify-source.py

      - name: Run JavaScript and Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check www/app.js
          node --check backend/server.js
          npm --prefix backend run check

          shopt -s nullglob
          JS_TESTS=(scripts/test-*.js tests/test-*.js test-gemini-instruction-engine.js)

          for test_file in "${JS_TESTS[@]}"; do
            echo "Running $test_file"
            node "$test_file"
          done

          PY_TESTS=(scripts/test-*.py)

          for test_file in "${PY_TESTS[@]}"; do
            echo "Running $test_file"
            python3 "$test_file"
          done

      - name: Build debug APK from current repository source
        run: gradle --no-daemon --stacktrace --warning-mode all -p android-wrapper clean assembleDebug

      - name: Verify APK and write checksum to run summary
        shell: bash
        run: |
          set -euo pipefail
          APK='android-wrapper/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          {
            echo '## SONGDNA SMART STUDIO 6.1.0 — Current source build'
            echo ''
            echo '- Source: current checked-out repository'
            echo '- Source parity and regression checks: passed'
            echo '- APK: app-debug.apk'
            echo "- SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-6.1.0-current-source-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
