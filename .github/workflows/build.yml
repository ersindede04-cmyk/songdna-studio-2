
name: SONGDNA SMART STUDIO - Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'SONGDNA_SMART_STUDIO_7_0_0_STAGE179_KAYNAK.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify, Test and Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_SMART_STUDIO_7_0_0_STAGE179_KAYNAK.zip"

          test -s "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          SOURCE_DIR="$GITHUB_WORKSPACE/source/SONGDNA_SMART_STUDIO_7_0_0_STAGE177"

          test -d "$SOURCE_DIR"
          test -f "$SOURCE_DIR/requirements-test.txt"
          test -f "$SOURCE_DIR/scripts/verify-source.py"
          test -d "$SOURCE_DIR/android-wrapper"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Install Python test dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r "$SOURCE_DIR/requirements-test.txt"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify source integrity
        run: |
          python "$SOURCE_DIR/scripts/verify-source.py"

      - name: Check backend JavaScript
        run: |
          npm --prefix "$SOURCE_DIR/backend" run check

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find tests scripts \
              -maxdepth 1 \
              -type f \
              -name '*.js' \
              -print0 | sort -z
          )

          echo "JavaScript test files: ${#TESTS[@]}"

          test "${#TESTS[@]}" -gt 0

          for TEST_FILE in "${TESTS[@]}"; do
            echo "Running: $TEST_FILE"
            node "$TEST_FILE"
          done

      - name: Run CI preflight
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"
          python scripts/ci-preflight.py

      - name: Run Python regression tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find scripts \
              -maxdepth 1 \
              -type f \
              -name 'test-*.py' \
              -print0 | sort -z
          )

          echo "Python test files: ${#TESTS[@]}"

          test "${#TESTS[@]}" -gt 0

          for TEST_FILE in "${TESTS[@]}"; do
            echo "Running: $TEST_FILE"
            python "$TEST_FILE"
          done

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android-wrapper"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK and generate checksum
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/android-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/android-output/SONGDNA_SMART_STUDIO_7_0_0_DEBUG.apk"

          cd "$GITHUB_WORKSPACE/android-output"

          sha256sum SONGDNA_SMART_STUDIO_7_0_0_DEBUG.apk \
            > SHA256SUMS.txt

          {
            echo "## SONGDNA SMART STUDIO Android Build"
            echo ""
            echo "- Source archive extracted."
            echo "- Source verification passed."
            echo "- Backend syntax check passed."
            echo "- JavaScript regression tests passed."
            echo "- Python preflight and regression tests passed."
            echo "- Android debug APK generated."
            echo "- SHA-256 checksum generated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-ANDROID-DEBUG
          path: android-output/*
          if-no-files-found: error
          retention-days: 30
          
