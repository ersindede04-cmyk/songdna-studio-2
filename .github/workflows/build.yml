
name: SONGDNA Studio 3.0.0 - Gemini Android Build

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-studio-3-gemini-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract, validate and build 3.0.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract exact 3.0.0 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_Studio_3_0_0_Gemini_Developer.zip"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::SONGDNA 3.0.0 Gemini source ZIP not found."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/songdna-3.0.0"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/songdna-3.0.0"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/songdna-3.0.0" -type f -path '*/android-wrapper/settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android project settings file not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$(dirname "$SETTINGS_FILE")")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Using source: $PROJECT_ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate SONGDNA 3.0.0 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f scripts/verify-source.py
          test -f android-wrapper/settings.gradle.kts
          test -f android-wrapper/app/build.gradle.kts
          test -f android-wrapper/app/src/main/AndroidManifest.xml
          test -f android-wrapper/app/src/main/java/com/songdna/studio/MainActivity.kt
          test -f android-wrapper/app/src/main/assets/www/index.html
          test -f www/index.html
          test -f backend/server.js

          grep -Fq 'SONGDNA-Studio-3.0.0' android-wrapper/settings.gradle.kts
          grep -Fq 'versionName = "3.0.0"' android-wrapper/app/build.gradle.kts
          grep -Fq 'versionCode = 10' android-wrapper/app/build.gradle.kts

          python3 scripts/verify-source.py

      - name: Build SONGDNA Studio 3.0.0 APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -p "$PROJECT_ROOT/android-wrapper" \
            clean assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_ROOT/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "SONGDNA Studio 3.0.0 APK successfully generated:"
          ls -lh "$APK"

      - name: Upload SONGDNA 3.0.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-3.0.0-Gemini-debug-APK
          path: ${{ env.PROJECT_ROOT }}/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
