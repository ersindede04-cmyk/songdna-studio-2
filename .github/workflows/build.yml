
name: SONGDNA SMART STUDIO 6.1.0 - ZIP Source APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-610-zip-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Find ZIP, validate source and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v6

      - name: Find and extract the uploaded Stage151 ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import sys
          import zipfile
          import shutil
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"])
          temp = Path(os.environ["RUNNER_TEMP"]) / "songdna-610-stage151"
          temp.mkdir(parents=True, exist_ok=True)

          def normalized(value):
              return re.sub(r"[^A-Z0-9]", "", value.upper())

          zips = sorted(
              p for p in repo.rglob("*")
              if p.is_file()
              and p.suffix.lower() == ".zip"
              and ".git" not in p.parts
          )

          print(f"ZIP files found: {len(zips)}")
          for item in zips:
              print(f" - {item.relative_to(repo)}")

          matches = [
              p for p in zips
              if "SONGDNASMARTSTUDIO" in normalized(p.name)
              and "V610" in normalized(p.name)
              and "STAGE151" in normalized(p.name)
          ]

          if len(matches) != 1:
              print("::error::Stage151 ZIP selection failed.")
              print(f"Expected exactly one matching ZIP. Found: {len(matches)}")
              print("Filename must contain SONGDNA, 6.1.0 and STAGE151.")
              sys.exit(1)

          archive = matches[0]
          print(f"Selected ZIP: {archive.relative_to(repo)}")

          if not zipfile.is_zipfile(archive):
              print("::error::Selected file is not a valid ZIP.")
              sys.exit(1)

          extract = temp / "extracted"
          extract.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  print(f"::error::ZIP integrity error: {bad}")
                  sys.exit(1)
              zf.extractall(extract)

          required_dirs = ("android-wrapper", "backend", "www")
          roots = []

          for marker in extract.rglob("scripts/verify-source.py"):
              candidate = marker.parent.parent

              if (
                  (candidate / "app.js").is_file()
                  and all((candidate / d).is_dir() for d in required_dirs)
              ):
                  roots.append(candidate)

          roots = list(dict.fromkeys(roots))

          if len(roots) != 1:
              print("::error::Could not identify exactly one complete project root.")
              print(f"Valid roots found: {len(roots)}")
              for root in roots:
                  print(root)
              sys.exit(1)

          source = roots[0]
          print(f"Verified project root: {source.relative_to(extract)}")

          for item in source.iterdir():
              destination = repo / item.name

              if destination.exists():
                  if destination.is_dir():
                      shutil.rmtree(destination)
                  else:
                      destination.unlink()

              if item.is_dir():
                  shutil.copytree(item, destination)
              else:
                  shutil.copy2(item, destination)

          required = (
              "app.js",
              "scripts/verify-source.py",
              "android-wrapper",
              "backend",
              "www"
          )

          for name in required:
              if not (repo / name).exists():
                  print(f"::error::Missing extracted project file: {name}")
                  sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"zip_name={archive.name}\n")
              out.write(f"source_root={source.relative_to(extract)}\n")

          print("Stage151 source extraction completed successfully.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Verify extracted source
        run: python scripts/verify-source.py

      - name: Check JavaScript and backend syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check www/app.js
          node --check backend/server.js
          npm --prefix backend run check

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          TEST_FILES=(scripts/test-*.js tests/test-*.js test-gemini-instruction-engine.js)

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "No JavaScript test files found."
            exit 1
          fi

          for test_file in "${TEST_FILES[@]}"; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Run Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          TEST_FILES=(scripts/test-*.py scripts/test_*.py tests/test-*.py tests/test_*.py)

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "No Python test files found."
            exit 1
          fi

          for test_file in "${TEST_FILES[@]}"; do
            echo "Running $test_file"
            python "$test_file"
          done

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-wrapper clean assembleDebug --no-daemon

      - name: Verify APK and calculate SHA256
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Debug APK was not produced."
            find android-wrapper -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p build-output

          cp "$APK" \
            build-output/SONGDNA-SMART-STUDIO-6.1.0-Stage151-debug.apk

          SHA="$(sha256sum build-output/SONGDNA-SMART-STUDIO-6.1.0-Stage151-debug.apk | awk '{print $1}')"

          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "APK SHA256: $SHA"

      - name: Upload SONGDNA 6.1.0 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SONGDNA-6.1.0-Stage151-Android-Debug-APK
          path: build-output/SONGDNA-SMART-STUDIO-6.1.0-Stage151-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SONGDNA SMART STUDIO 6.1.0 — Stage151"
            echo ""
            echo "- Source ZIP: ${{ steps.source.outputs.zip_name }}"
            echo "- Project root: ${{ steps.source.outputs.source_root }}"
            echo "- Build type: Android debug APK"
            echo "- SHA256: ${{ steps.apk.outputs.sha256 }}"
            echo ""
            echo "APK is available in Actions Artifacts if the build succeeded."
          } >> "$GITHUB_STEP_SUMMARY"
          
