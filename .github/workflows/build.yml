
name: SONGDNA SMART STUDIO 7.0.0 Stage175 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: songdna-stage175-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify Stage175 source and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Kaynak deposunu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK ortamını hazırla
        uses: android-actions/setup-android@v3

      - name: Gerekli Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" \
            -type f -name sdkmanager -path '*/bin/sdkmanager' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$HOME" -type f -name sdkmanager \
              -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager bulunamadı."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK paketleri hazır."

      - name: Stage175 kaynak ZIP dosyasını güvenli şekilde bul ve aç
        shell: bash
        run: |
          set -euo pipefail

          echo "Stage175 kaynak arşivi aranıyor..."

          mapfile -d '' ARCHIVES < <(
            find . -type f -iname '*stage175*.zip' \
              -not -path './.git/*' \
              -print0 | sort -z
          )

          if [ "${#ARCHIVES[@]}" -eq 0 ]; then
            echo "::error::Stage175 adını taşıyan kaynak ZIP bulunamadı."

            echo "Depodaki ZIP dosyaları:"
            find . -type f -iname '*.zip' -print

            exit 1
          fi

          echo "Bulunan Stage175 arşivleri:"
          printf '%s\n' "${ARCHIVES[@]}"

          SOURCE_ZIP=""

          for ARCHIVE in "${ARCHIVES[@]}"; do
            if [[ "$ARCHIVE" =~ [Ss][Oo][Uu][Rr][Cc][Ee] ]]; then
              SOURCE_ZIP="$ARCHIVE"
              break
            fi
          done

          if [ -z "$SOURCE_ZIP" ]; then
            SOURCE_ZIP="${ARCHIVES[0]}"
          fi

          echo "Kullanılacak kaynak arşivi: $SOURCE_ZIP"

          unzip -tq "$SOURCE_ZIP"

          mkdir -p "$RUNNER_TEMP/songdna-source"

          unzip -q "$SOURCE_ZIP" \
            -d "$RUNNER_TEMP/songdna-source"

          echo "SONGDNA_SOURCE_DIR=$RUNNER_TEMP/songdna-source" \
            >> "$GITHUB_ENV"

          echo "Stage175 kaynak arşivi başarıyla açıldı."

      - name: Python test bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          ROOT="$SONGDNA_SOURCE_DIR"

          if [ -f "$ROOT/requirements.txt" ]; then
            python -m pip install -r "$ROOT/requirements.txt"
          elif [ -f "$ROOT/pyproject.toml" ]; then
            python -m pip install "$ROOT"
          else
            echo "Python bağımlılık dosyası bulunamadı."
            echo "Temel Python testleri için devam ediliyor."
          fi

          python -m pip install playwright

      - name: Playwright Chromium kur
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      - name: Kaynak ve Android varlık bütünlüğünü doğrula
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"

          VERIFY="$(find "$ROOT" -type f \
            -path '*/scripts/verify-source.py' -print -quit)"

          if [ -n "$VERIFY" ]; then
            python "$VERIFY"
          else
            echo "::error::verify-source.py bulunamadı."
            exit 1
          fi

      - name: Backend JavaScript sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"

          if [ -f "$ROOT/backend/package.json" ]; then
            cd "$ROOT/backend"

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            npm run check
          else
            echo "Backend package.json bulunamadı."
            exit 1
          fi

      - name: JavaScript regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"
          cd "$ROOT"

          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          fi

          COUNT=0

          while IFS= read -r -d '' TEST; do
            echo "Test çalıştırılıyor: $TEST"
            node "$TEST"
            COUNT=$((COUNT + 1))
          done < <(
            find scripts -maxdepth 1 -type f \
              -name 'test-*.js' -print0 2>/dev/null | sort -z
          )

          echo "Çalıştırılan JavaScript test sayısı: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::JavaScript test dosyası bulunamadı."
            exit 1
          fi

      - name: Python ve tarayıcı regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"
          cd "$ROOT"

          COUNT=0

          while IFS= read -r -d '' TEST; do
            echo "Python testi: $TEST"
            python "$TEST"
            COUNT=$((COUNT + 1))
          done < <(
            find scripts -maxdepth 1 -type f \
              \( -name 'test-*.py' -o -name 'test_*.py' \) \
              -print0 2>/dev/null | sort -z
          )

          echo "Çalıştırılan Python test sayısı: $COUNT"

      - name: Android Gradle projesini bul
        id: android
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"

          mapfile -d '' WRAPPERS < <(
            find "$ROOT" -type f -name gradlew \
              -not -path '*/.gradle/*' -print0 | sort -z
          )

          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "::error::Gradle wrapper bulunamadı."
            exit 1
          fi

          WRAPPER="${WRAPPERS[0]}"
          PROJECT_DIR="$(dirname "$WRAPPER")"

          chmod +x "$WRAPPER"

          echo "Gradle wrapper: $WRAPPER"
          echo "Android proje dizini: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"

      - name: Android debug APK oluştur
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.android.outputs.project_dir }}"
          WRAPPER="${{ steps.android.outputs.wrapper }}"

          cd "$PROJECT_DIR"

          "$WRAPPER" --version
          "$WRAPPER" assembleDebug --no-daemon

      - name: APK dosyasını ve SHA-256 değerini doğrula
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_SOURCE_DIR"

          mapfile -d '' APKS < <(
            find "$ROOT" -type f \
              -path '*/build/outputs/apk/*/debug/*.apk' \
              -print0 | sort -z
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Debug APK çıktısı bulunamadı."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          APK="${APKS[0]}"
          DEST="$GITHUB_WORKSPACE/artifacts/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk"

          cp "$APK" "$DEST"

          test -s "$DEST"

          sha256sum "$DEST" | tee \
            "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"

          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Stage175 debug APK çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG_APK
          path: |
            artifacts/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          
