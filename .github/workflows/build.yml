
name: SONGDNA SMART STUDIO 6.1.0 - Stage169 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SONGDNA_SMART_STUDIO_6_1_0_STAGE169_KAYNAK.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: songdna-stage169-apk
  cancel-in-progress: true

jobs:
  build:
    name: Stage169 Source Verification and APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Stage169 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SONGDNA_SMART_STUDIO_6_1_0_STAGE169_KAYNAK.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Stage169 source ZIP not found: $ZIP_FILE"
            exit 1
          fi

          unzip -t "$ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/songdna-stage169"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/songdna-stage169"

          ROOT="$RUNNER_TEMP/songdna-stage169/SONGDNA_SMART_STUDIO_6_1_0_STAGE169"

          if [ ! -d "$ROOT" ]; then
            echo "::error::Stage169 source directory not found"
            exit 1
          fi

          echo "SONGDNA_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "PASS: Stage169 source ZIP validated"

      - name: Verify Stage169 package manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$SONGDNA_ROOT/BUILD_PACKAGE_MANIFEST_STAGE169.json"

          test -f "$MANIFEST"

          python - "$MANIFEST" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          expected = {
              "package_stage": 169,
              "application_version": "6.1.0",
              "android_application_id": "com.songdna.studio",
              "package_type": "source_only",
              "catalog_profile_count": 75
          }

          for key, value in expected.items():
              actual = data.get(key)
              if actual != value:
                  raise SystemExit(
                      f"FAIL: {key}: expected {value!r}, got {actual!r}"
                  )

          print("PASS: Stage169 package manifest verified")
          PY

      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail

          ANDROID="$SONGDNA_ROOT/android-wrapper"

          test -f "$ANDROID/settings.gradle.kts"
          test -f "$ANDROID/app/build.gradle.kts"
          test -f "$ANDROID/app/src/main/AndroidManifest.xml"
          test -f "$ANDROID/app/src/main/java/com/songdna/studio/MainActivity.kt"

          grep -q 'applicationId = "com.songdna.studio"' \
            "$ANDROID/app/build.gradle.kts"

          grep -q 'versionName = "6.1.0"' \
            "$ANDROID/app/build.gradle.kts"

          echo "PASS: Android project structure verified"

      - name: Verify synchronized application files
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_ROOT"
          ANDROID="$ROOT/android-wrapper/app/src/main/assets"

          for FILE in index.html app.js; do
            test -f "$ROOT/$FILE"
            test -f "$ROOT/www/$FILE"
            test -f "$ANDROID/$FILE"
            test -f "$ANDROID/www/$FILE"

            cmp "$ROOT/$FILE" "$ROOT/www/$FILE"
            cmp "$ROOT/$FILE" "$ANDROID/$FILE"
            cmp "$ROOT/$FILE" "$ANDROID/www/$FILE"
          done

          echo "PASS: Application files synchronized"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          find "$SONGDNA_ROOT" \
            -type f \
            -name "*.js" \
            -not -path "*/node_modules/*" \
            -print0 |
          while IFS= read -r -d '' FILE; do
            node --check "$FILE"
          done

          echo "PASS: JavaScript syntax checks"

      - name: Run Stage169 regression tests
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SONGDNA_ROOT"

          TESTS=(
            "tests/test-stage166-interface-completion.js"
            "scripts/test-stage163-universal-content-standard.js"
            "tests/test-stage157-user-creative-input-fidelity.js"
            "tests/test-stage160-multilingual-songwriting-standard.js"
            "tests/test-stage161-28-language-profiles.js"
            "tests/test-stage165-pop-regional-production.js"
          )

          for TEST in "${TESTS[@]}"; do
            FILE="$ROOT/$TEST"

            if [ ! -f "$FILE" ]; then
              echo "::error::Missing regression test: $TEST"
              exit 1
            fi

            echo "Running $TEST"
            node "$FILE"
          done

          echo "PASS: Stage169 regression tests"

      - name: Validate Android XML files
        shell: bash
        run: |
          set -euo pipefail

          python - "$SONGDNA_ROOT/android-wrapper/app/src/main" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(sys.argv[1])
          files = list(root.rglob("*.xml"))

          if not files:
              raise SystemExit("FAIL: No Android XML files found")

          for file in files:
              ET.parse(file)

          print(f"PASS: {len(files)} Android XML files validated")
          PY

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_ROOT/android-wrapper"

          gradle --no-daemon --stacktrace clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK output not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/songdna-output"

          cp "$APK" \
            "$RUNNER_TEMP/songdna-output/SONGDNA-SMART-STUDIO-6.1.0-STAGE169-DEBUG.apk"

          echo "PASS: Android Debug APK created"

      - name: Upload Stage169 APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-6.1.0-STAGE169-DEBUG-APK
          path: ${{ runner.temp }}/songdna-output/SONGDNA-SMART-STUDIO-6.1.0-STAGE169-DEBUG.apk
          if-no-files-found: error
          retention-days: 14
          
