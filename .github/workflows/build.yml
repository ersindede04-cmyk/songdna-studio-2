
name: SONGDNA SMART STUDIO Stage164 APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "SONGDNA_SMART_STUDIO_6_1_0_STAGE164_SOURCE.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Stage164 Checks and Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Stage164 source archive
        shell: bash
        run: |
          ARCHIVE="SONGDNA_SMART_STUDIO_6_1_0_STAGE164_SOURCE.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Stage164 ZIP archive not found in repository root."
            exit 1
          fi

          mkdir -p _stage164_source
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE" -d _stage164_source

          if [ ! -d "_stage164_source/songdna95" ]; then
            echo "::error::Expected songdna95 source directory not found."
            exit 1
          fi

          echo "Stage164 source archive extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        working-directory: _stage164_source/songdna95
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Install Playwright Chromium
        working-directory: _stage164_source/songdna95
        run: |
          python -m playwright install --with-deps chromium

      - name: Verify Playwright installation
        working-directory: _stage164_source/songdna95
        run: |
          python scripts/ci-preflight.py

      - name: Verify Stage164 editorial standard
        working-directory: _stage164_source/songdna95
        run: |
          node tests/test-stage164-editorial-standard.js

      - name: Verify Stage163 universal content standard
        working-directory: _stage164_source/songdna95
        run: |
          node scripts/test-stage163-universal-content-standard.js

      - name: Run all JavaScript regression tests
        working-directory: _stage164_source/songdna95
        shell: bash
        run: |
          count=0

          while IFS= read -r file; do
            echo "Running: $file"
            node "$file"
            count=$((count + 1))
          done < <(find tests scripts -maxdepth 1 -type f \
            -name 'test-*.js' | sort)

          echo "JavaScript test files executed: $count"

          if [ "$count" -ne 124 ]; then
            echo "::error::Expected 124 JavaScript test files."
            exit 1
          fi

      - name: Run Python browser regression tests
        working-directory: _stage164_source/songdna95
        shell: bash
        run: |
          count=0

          while IFS= read -r file; do
            echo "Running: $file"
            python "$file"
            count=$((count + 1))
          done < <(find scripts -maxdepth 1 -type f \
            -name 'test-*.py' | sort)

          echo "Python test files executed: $count"

          if [ "$count" -ne 5 ]; then
            echo "::error::Expected 5 Python test files."
            exit 1
          fi

      - name: Check backend JavaScript
        working-directory: _stage164_source/songdna95
        run: |
          npm --prefix backend run check

      - name: Check Android project files
        working-directory: _stage164_source/songdna95
        run: |
          test -f android-wrapper/settings.gradle.kts
          test -f android-wrapper/build.gradle.kts
          test -f android-wrapper/app/build.gradle.kts
          test -f android-wrapper/app/src/main/AndroidManifest.xml

          grep -q 'applicationId = "com.songdna.studio"' \
            android-wrapper/app/build.gradle.kts

          grep -q 'versionName = "6.1.0"' \
            android-wrapper/app/build.gradle.kts

          grep -q 'versionCode = 32' \
            android-wrapper/app/build.gradle.kts

          echo "Android project identity verified."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android debug APK
        working-directory: _stage164_source/songdna95/android-wrapper
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Prepare APK release
        working-directory: _stage164_source/songdna95
        shell: bash
        run: |
          mkdir -p release

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          cp "$APK" release/SONGDNA_SMART_STUDIO_6_1_0_STAGE164_DEBUG.apk

          sha256sum release/*.apk > release/SHA256SUMS.txt

          ls -lh release/

      - name: Upload Stage164 APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA_SMART_STUDIO_6_1_0_STAGE164_APK
          path: |
            _stage164_source/songdna95/release/*.apk
            _stage164_source/songdna95/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          
