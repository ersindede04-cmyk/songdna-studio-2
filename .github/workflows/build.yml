
name: SONGDNA SMART STUDIO 6.1.0 Stage170 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Verify Stage170 and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Stage170 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -type f -name 'SONGDNA_SMART_STUDIO_6_1_0_STAGE170_KAYNAK.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Stage170 kaynak ZIP bulunamadı."
            exit 1
          fi
          unzip -t "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/songdna-stage170"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/songdna-stage170"
          PROJECT_DIR="$RUNNER_TEMP/songdna-stage170/SONGDNA_SMART_STUDIO_6_1_0_STAGE170"
          test -f "$PROJECT_DIR/android-wrapper/settings.gradle.kts"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run source integrity checks
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          python scripts/verify-source.py
          node --check app.js
          node --check backend/server.js

      - name: Run JavaScript regression tests
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mapfile -t TESTS < <(find tests scripts -maxdepth 1 -type f -name 'test-*.js' | sort)
          test "${#TESTS[@]}" -eq 129
          for test_file in "${TESTS[@]}"; do
            node "$test_file"
          done

      - name: Install Python test dependencies
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$PROJECT_DIR/requirements-test.txt"
          python -m playwright install --with-deps chromium

      - name: Run Python and browser tests
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python scripts/ci-preflight.py
          mapfile -t TESTS < <(find scripts -maxdepth 1 -type f -name 'test-*.py' | sort)
          test "${#TESTS[@]}" -eq 7
          for test_file in "${TESTS[@]}"; do
            python "$test_file"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: false

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR/android-wrapper" clean assembleDebug

      - name: Upload Stage170 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-6.1.0-STAGE170-DEBUG-APK
          path: ${{ steps.source.outputs.project_dir }}/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
