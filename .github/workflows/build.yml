
name: SONGDNA SMART STUDIO Stage166 APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*STAGE166*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Stage166 Checks and Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # 1. GitHub deposunu al
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Stage166 ZIP dosyasını bul, kontrol et ve aç
      - name: Extract Stage166 source
        shell: bash
        run: |
          ARCHIVE="$(find . -type f -iname '*STAGE166*.zip' \
            -not -path './.git/*' | sort | head -n 1)"

          if [ -z "$ARCHIVE" ]; then
            echo "::error::Stage166 ZIP file not found in repository."
            echo "Repository ZIP files:"
            find . -type f -iname '*.zip' \
              -not -path './.git/*'
            exit 1
          fi

          echo "Found archive: $ARCHIVE"

          unzip -t "$ARCHIVE"

          mkdir -p _stage166_source
          unzip -q "$ARCHIVE" -d _stage166_source

          SOURCE_DIR="_stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::Stage166 source directory not found."
            find _stage166_source -maxdepth 3 -type d
            exit 1
          fi

          echo "Stage166 source extracted successfully."

      # 3. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 4. Node.js 22
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 5. Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 6. Python test bağımlılıkları
      - name: Install Python test dependencies
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      # 7. Playwright Chromium
      - name: Install Playwright Chromium
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166
        run: |
          python -m playwright install --with-deps chromium

      # 8. Playwright sürüm kontrolü
      - name: Verify Playwright installation
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166
        run: |
          python scripts/ci-preflight.py

      # 9. Kaynak bütünlüğü ve Android/WebView senkronizasyonu
      - name: Verify Stage166 source integrity
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166
        run: |
          python scripts/verify-source.py

      # 10. Stage163 evrensel müzik standardı
      - name: Verify Stage163 universal content standard
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166
        run: |
          node scripts/test-stage163-universal-content-standard.js

      # 11. Stage166 menü sırası testlerini düzelt
      - name: Correct Stage166 drawer order tests
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(".")

          # Gerçek menü sırası:
          # Genel Ayarlar, Temalar, AI Configuration, Hakkında
          # Hakkında menüsü uygulamada Çıkış'ın hemen önündedir.

          py_file = root / "scripts/test-stage166-interface-browser.py"
          py_text = py_file.read_text(encoding="utf-8")

          old_py = """    order=page.locator('[data-drawer-target="generalPanel"], [data-drawer-target="appearancePanel"], [data-drawer-target="aboutPanel"], [data-drawer-target="aiPanel"]').evaluate_all('(es)=>es.map(e=>e.getAttribute("data-drawer-target"))')
              record('settings, themes, about and AI entries are ordered',order==['generalPanel','appearancePanel','aboutPanel','aiPanel'],str(order))"""

          new_py = """    order=page.locator('[data-drawer-target="generalPanel"], [data-drawer-target="appearancePanel"], [data-drawer-target="aiPanel"], [data-drawer-target="aboutPanel"]').evaluate_all('(es)=>es.map(e=>e.getAttribute("data-drawer-target"))')
              record('settings, themes, AI and about entries are ordered',order==['generalPanel','appearancePanel','aiPanel','aboutPanel'],str(order))"""

          if old_py not in py_text:
              raise SystemExit(
                  "Python Stage166 drawer assertion did not match expected source."
              )

          py_file.write_text(
              py_text.replace(old_py, new_py, 1),
              encoding="utf-8"
          )

          print("Python drawer order assertion updated.")

          # JavaScript testindeki eski sıra beklentisini düzelt.
          js_files = [
              root / "tests/test-stage166-interface-completion.js",
              root / "android-wrapper/app/src/main/assets/scripts/test-stage166-interface-completion.js"
          ]

          old_js = """const order = ['data-drawer-target="generalPanel"','data-drawer-target="appearancePanel"','data-drawer-target="aboutPanel"','data-drawer-target="aiPanel"'];"""

          new_js = """const order = ['data-drawer-target="generalPanel"','data-drawer-target="appearancePanel"','data-drawer-target="aiPanel"','data-drawer-target="aboutPanel"'];"""

          found = 0

          for file in js_files:
              if not file.is_file():
                  continue

              content = file.read_text(encoding="utf-8")

              if old_js in content:
                  content = content.replace(old_js, new_js, 1)
                  file.write_text(content, encoding="utf-8")
                  found += 1
              elif new_js in content:
                  print(f"Already corrected: {file}")
              else:
                  raise SystemExit(
                      f"JavaScript drawer assertion not found: {file}"
                  )

          if found == 0 and not any(
              file.is_file() and new_js in file.read_text(encoding="utf-8")
              for file in js_files
          ):
              raise SystemExit("No JavaScript drawer assertion was verified.")

          print("JavaScript drawer order assertion verified.")

          # Gerçek HTML menü sırasını ayrıca kontrol et.
          html = (root / "index.html").read_text(encoding="utf-8")

          import re

          targets = re.findall(
              r'<button\b[^>]*data-drawer-target="([^"]+)"[^>]*>',
              html
          )

          expected = [
              "generalPanel",
              "appearancePanel",
              "aiPanel",
              "introPanel",
              "vocalPanel",
              "archivePanel",
              "aboutPanel"
          ]

          positions = [targets.index(item) for item in expected]

          if positions != sorted(positions):
              raise SystemExit("Actual HTML drawer order is incorrect.")

          if targets[-1] != "aboutPanel":
              raise SystemExit("About must be the last drawer target before Exit.")

          print("Actual HTML drawer order verified.")
          PY

      # 12. JavaScript regresyon testleri
      # Eski Stage164 sürüm kontrolü hariç tutulur.
      - name: Run JavaScript regression tests
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166
        shell: bash
        run: |
          count=0

          while IFS= read -r file; do
            echo "Running: $file"
            node "$file"
            count=$((count + 1))
          done < <(
            find tests scripts -maxdepth 1 \
              -type f -name 'test-*.js' \
              ! -name 'test-stage164-editorial-standard.js' \
              | sort
          )

          echo "JavaScript test files: $count"

          if [ "$count" -ne 125 ]; then
            echo "::error::Expected 125 compatible JavaScript test files."
            exit 1
          fi

      # 13. Python regresyon testleri
      - name: Run Python regression tests
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166
        shell: bash
        run: |
          count=0

          while IFS= read -r file; do
            echo "Running: $file"
            python "$file"
            count=$((count + 1))
          done < <(
            find scripts -maxdepth 1 \
              -type f -name 'test-*.py' | sort
          )

          echo "Python test files: $count"

          if [ "$count" -ne 6 ]; then
            echo "::error::Expected 6 Python test files."
            exit 1
          fi

      # 14. Backend JavaScript kontrolü
      - name: Check backend JavaScript
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166
        run: |
          npm --prefix backend run check

      # 15. Android proje kimliği
      - name: Verify Android project
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166
        shell: bash
        run: |
          test -f android-wrapper/settings.gradle.kts
          test -f android-wrapper/build.gradle.kts
          test -f android-wrapper/app/build.gradle.kts
          test -f android-wrapper/app/src/main/AndroidManifest.xml

          grep -q 'applicationId = "com.songdna.studio"' \
            android-wrapper/app/build.gradle.kts

          grep -q 'versionName = "6.1.0"' \
            android-wrapper/app/build.gradle.kts

          grep -q 'versionCode = 32' \
            android-wrapper/app/build.gradle.kts

          echo "Stage166 Android project identity verified."

      # 16. Android SDK kurulumu
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 17. Android 35 platform ve build tools
      - name: Install Android build components
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 18. Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 19. Android APK derleme
      - name: Build Android debug APK
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166/android-wrapper
        run: |
          gradle clean assembleDebug --no-daemon

      # 20. APK dosyasını hazırla
      - name: Prepare Stage166 APK release
        working-directory: _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166
        shell: bash
        run: |
          mkdir -p release

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Stage166 APK was not generated."
            exit 1
          fi

          cp "$APK" \
            release/SONGDNA_SMART_STUDIO_6_1_0_STAGE166_DEBUG.apk

          sha256sum release/*.apk > release/SHA256SUMS.txt

          ls -lh release/

      # 21. APK ve SHA256 dosyasını GitHub'a yükle
      - name: Upload Stage166 APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA_SMART_STUDIO_6_1_0_STAGE166_APK
          path: |
            _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166/release/*.apk
            _stage166_source/SONGDNA_SMART_STUDIO_6_1_0_STAGE166/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
