          mapfile -t ZIP_CANDIDATES < <(
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
              -name 'SONGDNA_Studio_5_2_0_Stage77_150K_Prompt_Limit*.zip' \
              -print | sort
          )

          if [[ "${#ZIP_CANDIDATES[@]}" -eq 0 ]]; then
            echo "::error::Stage 77 ZIP not found in repository root."
            exit 1
          fi

          if [[ "${#ZIP_CANDIDATES[@]}" -gt 1 ]]; then
            echo "::error::Multiple Stage 77 ZIP files found. Keep only one."
            printf '%s\n' "${ZIP_CANDIDATES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_CANDIDATES[0]}"
          EXTRACT_DIR="$RUNNER_TEMP/songdna-stage78-source"

          mkdir -p "$EXTRACT_DIR"
          unzip -t "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Extracted archive: $ZIP_FILE"
