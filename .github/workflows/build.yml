
name: SONGDNA SMART STUDIO 7.5.0 - Stage195 Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-stage195-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify and Build Stage195 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Stage195 source
        uses: actions/checkout@v4

      - name: Locate Stage195 project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          if [ -f "requirements-test.txt" ] && [ -d "android-wrapper" ]; then
            PROJECT="$PWD"
          else
            REQUIREMENTS=$(find . -type f \
              -name requirements-test.txt \
              -not -path '*/node_modules/*' \
              -print -quit)

            if [ -n "$REQUIREMENTS" ]; then
              PROJECT="$(dirname "$(realpath "$REQUIREMENTS")")"
            else
              ZIP_FILE=$(find . -maxdepth 4 -type f \
                -iname '*STAGE195*.zip' -print -quit)

              if [ -z "$ZIP_FILE" ]; then
                echo "Stage195 kaynak ZIP dosyası bulunamadı."
                exit 1
              fi

              mkdir -p "$RUNNER_TEMP/stage195-source"
              unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/stage195-source"

              REQUIREMENTS=$(find "$RUNNER_TEMP/stage195-source" \
                -type f -name requirements-test.txt -print -quit)

              if [ -z "$REQUIREMENTS" ]; then
                echo "ZIP içinde requirements-test.txt bulunamadı."
                exit 1
              fi

              PROJECT="$(dirname "$REQUIREMENTS")"
            fi
          fi

          if [ ! -d "$PROJECT/android-wrapper" ]; then
            echo "android-wrapper klasörü bulunamadı."
            exit 1
          fi

          if [ ! -f "$PROJECT/android-wrapper/settings.gradle.kts" ]; then
            echo "Gradle settings dosyası bulunamadı."
            exit 1
          fi

          if [ ! -f "$PROJECT/android-wrapper/app/build.gradle.kts" ]; then
            echo "Android uygulama yapılandırması bulunamadı."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Stage195 proje dizini:"
          echo "$PROJECT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-cleanup: on-success

      - name: Install Python test dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            -r requirements-test.txt

          python -m playwright install --with-deps chromium

      - name: Verify Stage195 source and backend
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python scripts/verify-source.py

          npm --prefix backend run check

      - name: Run JavaScript regression tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' TESTS < <(
            find tests scripts \
              -maxdepth 1 \
              -type f \
              -name '*.js' \
              ! -name 'test-stage70-deployment-config.js' \
              -print0 | sort -z
          )

          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "JavaScript testleri bulunamadı."
            exit 1
          fi

          for test_file in "${TESTS[@]}"; do
            echo "Running: $test_file"
            node "$test_file"
          done

          echo "JavaScript testleri tamamlandı."

      - name: Run Python and browser regression tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python scripts/ci-preflight.py

          shopt -s nullglob
          TESTS=(scripts/test-*.py)

          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "Python testleri bulunamadı."
            exit 1
          fi

          for test_file in "${TESTS[@]}"; do
            echo "Running: $test_file"
            python "$test_file"
          done

          echo "Python ve tarayıcı testleri tamamlandı."

      - name: Build Stage195 Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_SUCCESS=false

          for ATTEMPT in 1 2 3; do
            echo "APK derleme denemesi: $ATTEMPT / 3"

            if gradle \
              -p android-wrapper \
              :app:assembleDebug \
              --no-daemon \
              --refresh-dependencies \
              --stacktrace; then

              BUILD_SUCCESS=true
              break
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              echo "Derleme başarısız. Tekrar denenecek."
              sleep 15
            fi
          done

          if [ "$BUILD_SUCCESS" != "true" ]; then
            echo "Stage195 APK derlemesi başarısız."
            exit 1
          fi

          echo "APK derlemesi başarılı."

      - name: Verify APK and calculate SHA256
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK bulunamadı veya boş."
            exit 1
          fi

          mkdir -p stage195-output

          cp "$APK" \
            stage195-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE195_DEBUG.apk

          cd stage195-output

          sha256sum *.apk > SHA256SUMS.txt

          echo "Oluşturulan APK:"
          ls -lh *.apk

          echo "SHA256:"
          cat SHA256SUMS.txt

      - name: Upload Stage195 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.5.0-STAGE195-ANDROID
          path: ${{ env.PROJECT_DIR }}/stage195-output/*
          if-no-files-found: error
          retention-days: 30
          
