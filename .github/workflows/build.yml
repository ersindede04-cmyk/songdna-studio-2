
name: SONGDNA SMART STUDIO 7.5.0 - Stage197 Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-stage197-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify and Build Stage197 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Stage197 source
        uses: actions/checkout@v4

      - name: Locate Stage197 project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=""

          if [ -f "requirements-test.txt" ] && [ -d "android-wrapper" ]; then
            PROJECT="$PWD"
          else
            REQUIREMENTS=$(find . -type f -name requirements-test.txt \
              -not -path '*/node_modules/*' -print -quit)

            if [ -n "$REQUIREMENTS" ]; then
              PROJECT="$(dirname "$(realpath "$REQUIREMENTS")")"
            else
              ZIP_FILE=$(find . -maxdepth 4 -type f \
                -iname '*STAGE197*.zip' -print -quit)
              if [ -z "$ZIP_FILE" ]; then
                echo "Stage197 source folder or ZIP not found."
                exit 1
              fi
              mkdir -p "$RUNNER_TEMP/stage197-source"
              unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/stage197-source"
              REQUIREMENTS=$(find "$RUNNER_TEMP/stage197-source" \
                -type f -name requirements-test.txt -print -quit)
              if [ -z "$REQUIREMENTS" ]; then
                echo "requirements-test.txt not found in ZIP."
                exit 1
              fi
              PROJECT="$(dirname "$REQUIREMENTS")"
            fi
          fi

          test -d "$PROJECT/android-wrapper"
          test -f "$PROJECT/android-wrapper/settings.gradle.kts"
          test -f "$PROJECT/android-wrapper/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Stage197 project: $PROJECT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-cleanup: on-success

      - name: Install Python test dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Verify Stage197 source and backend
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python scripts/verify-source.py
          npm --prefix backend run check

      - name: Run JavaScript regression tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' TESTS < <(
            find tests scripts -maxdepth 1 -type f -name '*.js' \
              ! -name 'test-stage70-deployment-config.js' \
              -print0 | sort -z
          )
          test "${#TESTS[@]}" -gt 0
          for test_file in "${TESTS[@]}"; do
            echo "Running: $test_file"
            node "$test_file"
          done

      - name: Run Python and browser regression tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci-preflight.py
          shopt -s nullglob
          TESTS=(scripts/test-*.py)
          test "${#TESTS[@]}" -gt 0
          for test_file in "${TESTS[@]}"; do
            echo "Running: $test_file"
            python "$test_file"
          done

      - name: Build Stage197 Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SUCCESS=false
          for ATTEMPT in 1 2 3; do
            echo "Gradle build attempt: $ATTEMPT / 3"
            if gradle -p android-wrapper :app:assembleDebug \
              --no-daemon --refresh-dependencies --stacktrace; then
              BUILD_SUCCESS=true
              break
            fi
            if [ "$ATTEMPT" -lt 3 ]; then sleep 15; fi
          done
          if [ "$BUILD_SUCCESS" != "true" ]; then
            echo "Stage197 APK build failed after 3 attempts."
            exit 1
          fi

      - name: Verify APK and calculate SHA256
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p stage197-output
          cp "$APK" stage197-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE197_DEBUG.apk
          cd stage197-output
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh *.apk
          cat SHA256SUMS.txt

      - name: Upload Stage197 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.5.0-STAGE197-ANDROID
          path: ${{ env.PROJECT_DIR }}/stage197-output/*
          if-no-files-found: error
          retention-days: 30
          
