
name: SONGDNA Studio 5.2.0 Stage 32 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract Stage 32 and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Stage 32 ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ARCHIVES < <(
            find . -maxdepth 1 -type f \
              -iname 'SONGDNA_Studio_Stage32_Son_Paket_Indir*.zip'
          )

          if [ "${#ARCHIVES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Stage 32 ZIP, found ${#ARCHIVES[@]}."
            find . -maxdepth 1 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/songdna-stage32"
          unzip -q "${ARCHIVES[0]}" -d "$RUNNER_TEMP/songdna-stage32"

          SOURCE="$RUNNER_TEMP/songdna-stage32/SONGDNA_Studio_5_2_0"

          test -f "$SOURCE/www/app.js"
          test -f "$SOURCE/backend/server.js"
          test -f "$SOURCE/android-wrapper/app/build.gradle.kts"

          echo "SONGDNA_SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "Stage 32 source extracted and verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Stage 32 source
        working-directory: ${{ env.SONGDNA_SOURCE }}
        run: |
          python3 scripts/verify-source.py
          node --check www/app.js

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "$SONGDNA_SOURCE/android-wrapper" \
            clean assembleDebug

      - name: Verify APK
        run: |
          APK="$SONGDNA_SOURCE/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.2.0-Stage32-APK
          path: ${{ env.SONGDNA_SOURCE }}/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
