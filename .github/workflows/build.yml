
      - name: Find and extract SONGDNA 6.1.0 ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching specifically for SONGDNA 6.1.0 Stage151 ZIP..."

          mapfile -t ZIP_FILES < <(
            find . -type f -iname 'SONGDNA_SMART_STUDIO_v6_1_0_STAGE151.zip' \
              -not -path './.git/*'
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one 6.1.0 Stage151 ZIP."
            echo "Matching files found: ${#ZIP_FILES[@]}"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          SELECTED="${ZIP_FILES[0]}"
          echo "Selected source ZIP: $SELECTED"

          EXTRACT_DIR="$RUNNER_TEMP/songdna-extracted"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$SELECTED" -d "$EXTRACT_DIR"

          SOURCE_DIR=""

          while IFS= read -r VERIFY_FILE; do
            CANDIDATE="$(dirname "$(dirname "$VERIFY_FILE")")"

            if [ -f "$CANDIDATE/scripts/verify-source.py" ] &&
               [ -f "$CANDIDATE/app.js" ] &&
               [ -d "$CANDIDATE/android-wrapper" ] &&
               [ -d "$CANDIDATE/backend" ] &&
               [ -d "$CANDIDATE/www" ]; then
              SOURCE_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find "$EXTRACT_DIR" -type f \
              -path '*/scripts/verify-source.py' \
              -not -path '*/android-wrapper/*' \
              -not -path '*/www/*'
          )

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: Complete project root could not be identified."
            echo "ZIP contents:"
            find "$EXTRACT_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Verified project root: $SOURCE_DIR"

          cp -a "$SOURCE_DIR/." "$GITHUB_WORKSPACE/"

          test -f scripts/verify-source.py
          test -f app.js
          test -d android-wrapper
          test -d backend
          test -d www

          echo "SONGDNA 6.1.0 source extraction successful."
          
