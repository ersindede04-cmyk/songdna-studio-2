
name: SONGDNA SMART STUDIO 7.0.0 Stage175 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "*.zip"

permissions:
  contents: read

concurrency:
  group: songdna-stage175-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify Stage175 source and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # --------------------------------------------------
      # 1. BUILD ENVIRONMENT
      # --------------------------------------------------

      - name: Kaynak deposunu al
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js 22 kur
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Python 3.11 kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      # --------------------------------------------------
      # 2. ANDROID SDK
      # --------------------------------------------------

      - name: Android SDK ortamını hazırla
        uses: android-actions/setup-android@v3

      - name: Gerekli Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 3. STAGE175 BUILD KIT DISCOVERY
      # --------------------------------------------------

      - name: Stage175 derleme kitini güvenli şekilde bul ve aç
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import sys

          root = Path.cwd()

          candidates = [
              p for p in root.rglob("*.zip")
              if "STAGE175" in p.name.upper()
              and "DERLEME_KITI" in p.name.upper()
          ]

          if len(candidates) != 1:
              print("Stage175 derleme kiti tekil olarak belirlenemedi.")
              for item in candidates:
                  print(item)
              sys.exit(1)

          selected = candidates[0]
          print(f"Seçilen derleme kiti: {selected}")
          Path("/tmp/songdna_stage175_kit.txt").write_text(
              str(selected.resolve()),
              encoding="utf-8"
          )
          PY

          KIT="$(cat /tmp/songdna_stage175_kit.txt)"
          mkdir -p "$RUNNER_TEMP/songdna_stage175_kit"

          unzip -q "$KIT" -d "$RUNNER_TEMP/songdna_stage175_kit"

          echo "Derleme kiti başarıyla açıldı."
          find "$RUNNER_TEMP/songdna_stage175_kit" \
            -maxdepth 3 -type f | head -100

      # --------------------------------------------------
      # 4. FIND AND EXTRACT REAL SOURCE ARCHIVE
      # --------------------------------------------------

      - name: Stage175 kaynak ZIP dosyasını bul ve proje kökünü belirle
        shell: bash
        run: |
          set -euo pipefail

          KIT_DIR="$RUNNER_TEMP/songdna_stage175_kit"
          CANDIDATE_DIR="$RUNNER_TEMP/songdna_stage175_candidates"

          mkdir -p "$CANDIDATE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          import sys

          kit = Path("/tmp")
          kit_dir = Path(__import__("os").environ["RUNNER_TEMP"]) / "songdna_stage175_kit"
          out_dir = Path(__import__("os").environ["RUNNER_TEMP"]) / "songdna_stage175_candidates"

          archives = sorted(kit_dir.rglob("*.zip"))

          if not archives:
              print("Derleme kitinin içinde ZIP arşivi bulunamadı.")
              sys.exit(1)

          extracted = 0

          for archive in archives:
              name = archive.name.upper()

              if "KAYNAK" not in name and "GITHUB_BUILD_ONLY" not in name:
                  continue

              target = out_dir / archive.stem
              target.mkdir(parents=True, exist_ok=True)

              try:
                  with zipfile.ZipFile(archive) as zf:
                      bad = zf.testzip()
                      if bad:
                          raise RuntimeError(f"Bozuk ZIP girdisi: {bad}")
                      zf.extractall(target)

                  print(f"Açıldı: {archive.name}")
                  extracted += 1

              except Exception as exc:
                  print(f"Arşiv açılamadı: {archive.name}: {exc}")
                  raise

          if extracted == 0:
              print("Kaynak veya GitHub build-only ZIP bulunamadı.")
              sys.exit(1)

          valid_roots = []

          for marker in out_dir.rglob("scripts/verify-source.py"):
              root = marker.parent.parent

              gradle_file = root / "android-wrapper/app/build.gradle.kts"
              gradle_wrapper = root / "android-wrapper/gradlew"

              if gradle_file.is_file() and gradle_wrapper.is_file():
                  valid_roots.append(root)

          if len(valid_roots) != 1:
              print("Gerçek Stage175 proje kökü tekil olarak belirlenemedi.")
              print("Bulunan doğrulama dosyaları:")
              for marker in out_dir.rglob("verify-source.py"):
                  print(marker)
              print("Bulunan Gradle projeleri:")
              for gradle in out_dir.rglob("android-wrapper/app/build.gradle.kts"):
                  print(gradle)
              sys.exit(1)

          project_root = valid_roots[0].resolve()

          Path("/tmp/songdna_stage175_project_root.txt").write_text(
              str(project_root),
              encoding="utf-8"
          )

          print(f"Doğrulanan proje kökü: {project_root}")
          PY

          PROJECT_ROOT="$(cat /tmp/songdna_stage175_project_root.txt)"
          echo "SONGDNA_PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Stage175 proje kökü belirlendi."

      # --------------------------------------------------
      # 5. PYTHON AND NODE DEPENDENCIES
      # --------------------------------------------------

      - name: Python test bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install playwright

          if [ -f "$SONGDNA_PROJECT_ROOT/requirements.txt" ]; then
            python -m pip install \
              -r "$SONGDNA_PROJECT_ROOT/requirements.txt"
          fi

          if [ -f "$SONGDNA_PROJECT_ROOT/pyproject.toml" ]; then
            python -m pip install "$SONGDNA_PROJECT_ROOT"
          fi

      - name: Playwright Chromium kur
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      - name: Backend Node.js bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail

          BACKEND="$SONGDNA_PROJECT_ROOT/backend"

          if [ -f "$BACKEND/package.json" ]; then
            cd "$BACKEND"

            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi
          else
            echo "Backend package.json bulunamadı."
            exit 1
          fi

      # --------------------------------------------------
      # 6. SOURCE INTEGRITY AND BACKEND VALIDATION
      # --------------------------------------------------

      - name: Kaynak ve Android varlık bütünlüğünü doğrula
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT"

          test -f scripts/verify-source.py
          test -f scripts/ci-preflight.py
          test -f android-wrapper/app/build.gradle.kts
          test -f android-wrapper/gradlew

          python scripts/verify-source.py
          python scripts/ci-preflight.py

      - name: Backend JavaScript sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT"

          node --check server.js
          node --check backend/server.js

          if ! cmp -s server.js backend/server.js; then
            echo "Root ve backend server.js dosyaları eşleşmiyor."
            exit 1
          fi

      - name: Backend kontrol komutunu çalıştır
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT/backend"

          npm run check --if-present

      # --------------------------------------------------
      # 7. JAVASCRIPT REGRESSION TESTS
      # --------------------------------------------------

      - name: JavaScript regression testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT"

          mapfile -d '' TEST_FILES < <(
            find scripts -type f -name 'test-*.js' -print0 | sort -z
          )

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "JavaScript test dosyası bulunamadı."
            exit 1
          fi

          echo "Bulunan JavaScript test dosyası: ${#TEST_FILES[@]}"

          for TEST in "${TEST_FILES[@]}"; do
            echo "Çalıştırılıyor: $TEST"
            node "$TEST"
          done

      # --------------------------------------------------
      # 8. PYTHON AND BROWSER REGRESSION TESTS
      # --------------------------------------------------

      - name: Python ve tarayıcı regression testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT"

          python -m compileall -q scripts

          mapfile -d '' TEST_FILES < <(
            find scripts -type f -name 'test-*.py' -print0 | sort -z
          )

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "Python test dosyası bulunamadı."
            exit 1
          fi

          echo "Bulunan Python test dosyası: ${#TEST_FILES[@]}"

          for TEST in "${TEST_FILES[@]}"; do
            echo "Çalıştırılıyor: $TEST"
            python "$TEST"
          done

      # --------------------------------------------------
      # 9. ANDROID GRADLE BUILD
      # --------------------------------------------------

      - name: Android Gradle projesini derle
        shell: bash
        run: |
          set -euo pipefail

          cd "$SONGDNA_PROJECT_ROOT/android-wrapper"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # --------------------------------------------------
      # 10. APK AND SHA-256 VALIDATION
      # --------------------------------------------------

      - name: APK dosyasını ve SHA-256 değerini doğrula
        shell: bash
        run: |
          set -euo pipefail

          APK="$SONGDNA_PROJECT_ROOT/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "Android Debug APK oluşturulamadı."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/songdna_stage175_output"

          cp "$APK" \
            "$RUNNER_TEMP/songdna_stage175_output/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk"

          cd "$RUNNER_TEMP/songdna_stage175_output"

          sha256sum \
            SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk \
            > SHA256SUMS.txt

          echo "APK boyutu:"
          ls -lh SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk

          echo "SHA-256:"
          cat SHA256SUMS.txt

      # --------------------------------------------------
      # 11. UPLOAD ARTIFACT
      # --------------------------------------------------

      - name: Stage175 debug APK çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA_SMART_STUDIO_7_0_0_STAGE175_ANDROID_DEBUG
          path: |
            ${{ runner.temp }}/songdna_stage175_output/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk
            ${{ runner.temp }}/songdna_stage175_output/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          
