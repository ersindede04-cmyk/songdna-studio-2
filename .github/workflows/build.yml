name: SONGDNA SMART STUDIO 5.7.0 - Stage 108 - Gemini Traditional Production Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'SONGDNA_SMART_STUDIO_v5_7_0_STAGE108_FINAL_TRADITIONAL_PRODUCTION.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage108-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract ZIP, verify source, run tests and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Stage 108 ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_SMART_STUDIO_v5_7_0_STAGE108_FINAL_TRADITIONAL_PRODUCTION.zip"
          EXTRACT_DIR="$RUNNER_TEMP/songdna-stage108-source"

          echo "Repository root:"
          ls -la "$GITHUB_WORKSPACE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Stage 108 ZIP not found in repository root."
            exit 1
          fi

          echo "Checking ZIP integrity..."
          unzip -t "$ZIP_FILE"

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/songdna95"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::songdna95 project folder not found."
            find "$EXTRACT_DIR" -maxdepth 3 -type d
            exit 1
          fi

          for required in \
            app.js \
            index.html \
            www/app.js \
            backend/server.js \
            backend/package.json \
            scripts/test-stage108-world-traditional-production.js \
            tests/test-stage107-production-hardening.js \
            tests/test-stage106-interface-localization.js \
            scripts/test-stage105-music-domains.js \
            android-wrapper/settings.gradle.kts \
            android-wrapper/build.gradle.kts \
            android-wrapper/app/build.gradle.kts \
            android-wrapper/app/src/main/AndroidManifest.xml \
            android-wrapper/app/src/main/assets/app.js
          do
            if [ ! -f "$PROJECT_DIR/$required" ]; then
              echo "::error::Missing required file: $required"
              exit 1
            fi
          done

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Stage 108 source synchronization
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python - <<'PY'
          from pathlib import Path
          import hashlib

          groups = {
              "app.js": [
                  "app.js",
                  "www/app.js",
                  "android-wrapper/app/src/main/assets/app.js",
                  "android-wrapper/app/src/main/assets/www/app.js",
              ],
              "index.html": [
                  "index.html",
                  "www/index.html",
                  "android-wrapper/app/src/main/assets/index.html",
                  "android-wrapper/app/src/main/assets/www/index.html",
              ],
          }

          for name, files in groups.items():
              hashes = set()

              for file in files:
                  path = Path(file)

                  if not path.is_file():
                      raise SystemExit(f"Missing file: {file}")

                  hashes.add(hashlib.sha256(path.read_bytes()).hexdigest())

              if len(hashes) != 1:
                  raise SystemExit(f"FAIL: {name} copies are not identical")

              print(f"PASS: {name} copies synchronized")

          app = Path("app.js").read_text(encoding="utf-8")

          for marker in [
              "pureTraditionalProduction",
              "PURE TRADITIONAL PRODUCTION — WORLDWIDE CULTURAL AUTHENTICITY LOCK",
              "Do not substitute generic",
          ]:
              if marker not in app:
                  raise SystemExit(f"Stage 108 marker missing: {marker}")

          gradle = Path("android-wrapper/app/build.gradle.kts").read_text()

          for marker in [
              "versionCode = 31",
              'versionName = "5.7.0"',
              "compileSdk = 35",
          ]:
              if marker not in gradle:
                  raise SystemExit(f"Android configuration missing: {marker}")

          print("PASS: Stage 108 and Android version checks")
          PY

      - name: Verify JavaScript syntax
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node --check app.js
          node --check www/app.js
          node --check backend/server.js
          node --check android-wrapper/app/src/main/assets/app.js
          node --check android-wrapper/app/src/main/assets/www/app.js

          echo "JavaScript syntax verification passed."

      - name: Install backend dependencies
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/backend"

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run backend checks
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/backend"

          npm run check

      - name: Run Stage 108 traditional production test
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node scripts/test-stage108-world-traditional-production.js

      - name: Run Stage 107 production hardening test
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node tests/test-stage107-production-hardening.js

      - name: Run Stage 106 localization test
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node tests/test-stage106-interface-localization.js

      - name: Run Stage 105 music domains test
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node scripts/test-stage105-music-domains.js

      - name: Run natural lyric intelligence test
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node tests/test-stage102-natural-lyric-intelligence.js

      - name: Run songwriter editing test
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node tests/test-stage103-songwriter-editing-pass.js

      - name: Run creative identity test
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node tests/test-stage104-creative-identity.js

      - name: Run Android debug APK build
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android-wrapper"

          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK and calculate SHA256
        id: apk
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK file was not created."
            find "$PROJECT_DIR/android-wrapper/app/build/outputs" -type f
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/songdna-release"

          cp "$APK" \
            "$RUNNER_TEMP/songdna-release/SONGDNA-SMART-STUDIO-5.7.0-STAGE108-debug.apk"

          cd "$RUNNER_TEMP/songdna-release"

          sha256sum SONGDNA-SMART-STUDIO-5.7.0-STAGE108-debug.apk \
            > SHA256SUMS.txt

          SHA256=$(awk '{print $1}' SHA256SUMS.txt)

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          ls -lh

      - name: Create build summary
        shell: bash
        run: |
          {
            echo "# SONGDNA SMART STUDIO 5.7.0"
            echo ""
            echo "## Stage 108 Android Build"
            echo ""
            echo "- Source: Stage 108 ZIP"
            echo "- Java: 17"
            echo "- Node.js: 20"
            echo "- Python: 3.11"
            echo "- Gradle: 8.9"
            echo "- Android SDK: 35"
            echo "- Version: 5.7.0"
            echo "- Version Code: 31"
            echo "- Build: Debug APK"
            echo "- SHA256: ${{ steps.apk.outputs.sha256 }}"
            echo ""
            echo "APK is available in GitHub Actions Artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Stage108-Android-Debug-APK
          path: |
            ${{ runner.temp }}/songdna-release/SONGDNA-SMART-STUDIO-5.7.0-STAGE108-debug.apk
            ${{ runner.temp }}/songdna-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
