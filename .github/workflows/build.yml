
name: SONGDNA SMART STUDIO 7.5.0 - Stage184 Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*STAGE184*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage184-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Stage184 Tests and Android APK Build
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Stage184 source package
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Stage184 ZIP..."

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname '*STAGE184*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Stage184 ZIP package not found."
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip'
            exit 1
          fi

          echo "Package found: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          SOURCE_DIR="$GITHUB_WORKSPACE/source/SONGDNA_SMART_STUDIO_7_5_0_STAGE184"

          if [ ! -d "$SOURCE_DIR" ]; then
            SOURCE_DIR="$(find "$GITHUB_WORKSPACE/source" \
              -type f \
              -path '*/backend/server.js' \
              -print -quit | xargs -r dirname | xargs -r dirname)"
          fi

          if [ -z "$SOURCE_DIR" ] || [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::Could not identify extracted source directory."
            find "$GITHUB_WORKSPACE/source" -maxdepth 4 -type f | head -100
            exit 1
          fi

          test -f "$SOURCE_DIR/backend/server.js"
          test -f "$SOURCE_DIR/backend/package.json"
          test -f "$SOURCE_DIR/requirements-test.txt"
          test -f "$SOURCE_DIR/android-wrapper/app/build.gradle.kts"
          test -f "$SOURCE_DIR/android-wrapper/settings.gradle.kts"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Stage184 source package verified."

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r "$SOURCE_DIR/requirements-test.txt"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check backend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$SOURCE_DIR/backend" run check

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find scripts -maxdepth 1 -type f \
              -name 'test-*.js' -print0 | sort -z
          )

          echo "Found ${#TESTS[@]} JavaScript test files."

          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "::error::No JavaScript regression tests found."
            exit 1
          fi

          for TEST_FILE in "${TESTS[@]}"; do
            echo "Running $TEST_FILE"
            node "$TEST_FILE"
          done

      - name: Run Python preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          python scripts/ci-preflight.py

      - name: Run all 7 Python regression tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find scripts -maxdepth 1 -type f \
              -name 'test-*.py' -print0 | sort -z
          )

          echo "Found ${#TESTS[@]} Python test files."

          if [ "${#TESTS[@]}" -ne 7 ]; then
            echo "::error::Expected 7 Python test files, found ${#TESTS[@]}."
            exit 1
          fi

          for TEST_FILE in "${TESTS[@]}"; do
            echo "Running $TEST_FILE"
            python "$TEST_FILE"
          done

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android-wrapper"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK and create checksum
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Android APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/stage184-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/stage184-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE184.apk"

          cd "$GITHUB_WORKSPACE/stage184-output"

          sha256sum SONGDNA_SMART_STUDIO_7_5_0_STAGE184.apk \
            > SHA256SUMS.txt

          echo "APK successfully generated."

      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SONGDNA SMART STUDIO 7.5.0 - Stage184"
            echo ""
            echo "- Source package: Stage184"
            echo "- Backend check: completed if previous step passed"
            echo "- JavaScript tests: completed if previous step passed"
            echo "- Python tests: completed if previous step passed"
            echo "- Android APK: see build result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.5.0-STAGE184-ANDROID-APK
          path: stage184-output/*
          if-no-files-found: error
          retention-days: 30
          
