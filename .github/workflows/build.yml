
name: SONGDNA SMART STUDIO 6.1.0 - ZIP Source APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: songdna-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract ZIP, validate source and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Find and extract SONGDNA 6.1.0 Stage151 ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching repository root for Stage151 ZIP..."

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f \
              -iname 'SONGDNA_SMART_STUDIO_v6_1_0_STAGE151*.zip' \
              -not -path './.git/*' \
              | sort
          )

          echo "Matching ZIP files: ${#ZIP_FILES[@]}"
          printf '%s\n' "${ZIP_FILES[@]}"

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Exactly one Stage151 ZIP is required."
            echo "Upload the project ZIP to the repository root."
            exit 1
          fi

          SELECTED="${ZIP_FILES[0]}"
          echo "Selected ZIP: $SELECTED"

          EXTRACT_DIR="$RUNNER_TEMP/songdna-extracted"
          mkdir -p "$EXTRACT_DIR"

          unzip -tq "$SELECTED"
          unzip -q "$SELECTED" -d "$EXTRACT_DIR"

          SOURCE_DIR=""

          while IFS= read -r VERIFY_FILE; do
            CANDIDATE="$(dirname "$(dirname "$VERIFY_FILE")")"

            if [ -f "$CANDIDATE/scripts/verify-source.py" ] &&
               [ -f "$CANDIDATE/app.js" ] &&
               [ -d "$CANDIDATE/android-wrapper" ] &&
               [ -d "$CANDIDATE/backend" ] &&
               [ -d "$CANDIDATE/www" ]; then
              SOURCE_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find "$EXTRACT_DIR" -type f \
              -path '*/scripts/verify-source.py' \
              -not -path '*/android-wrapper/*' \
              -not -path '*/www/*'
          )

          if [ -z "$SOURCE_DIR" ]; then
            echo "::error::Complete SONGDNA project root not found."
            find "$EXTRACT_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Verified project root: $SOURCE_DIR"

          cp -a "$SOURCE_DIR/." "$GITHUB_WORKSPACE/"

          test -f scripts/verify-source.py
          test -f app.js
          test -d android-wrapper
          test -d backend
          test -d www

          echo "SONGDNA source extraction successful."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python test dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install playwright

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f scripts/requirements.txt ]; then
            python -m pip install -r scripts/requirements.txt
          fi

          python -m playwright install --with-deps chromium

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f backend/package-lock.json ]; then
            npm --prefix backend ci
          else
            npm --prefix backend install
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify extracted source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-source.py

      - name: Check JavaScript and backend syntax
        shell: bash
        run: |
          set -euo pipefail

          node --check app.js
          node --check www/app.js
          node --check backend/server.js

          npm --prefix backend run check

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          TEST_FILES=(
            scripts/test-*.js
            tests/test-*.js
            test-gemini-instruction-engine.js
          )

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "::error::No JavaScript test files found."
            exit 1
          fi

          for TEST_FILE in "${TEST_FILES[@]}"; do
            echo "Running: $TEST_FILE"
            node "$TEST_FILE"
          done

      - name: Run Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          TEST_FILES=(
            scripts/test-*.py
            tests/test-*.py
          )

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "::error::No Python test files found."
            exit 1
          fi

          for TEST_FILE in "${TEST_FILES[@]}"; do
            echo "Running: $TEST_FILE"
            python "$TEST_FILE"
          done

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle -p android-wrapper clean assembleDebug

          APK_PATH="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK file was not generated."
            find android-wrapper -type f -name '*.apk'
            exit 1
          fi

          mkdir -p build-output
          cp "$APK_PATH" build-output/SONGDNA-SMART-STUDIO-6.1.0-debug.apk

      - name: Verify APK and calculate SHA256
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="build-output/SONGDNA-SMART-STUDIO-6.1.0-debug.apk"

          test -s "$APK_PATH"

          APK_SIZE="$(du -h "$APK_PATH" | cut -f1)"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"

          echo "size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

          echo "APK size: $APK_SIZE"
          echo "SHA256: $APK_SHA256"

      - name: Upload SONGDNA 6.1.0 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-6.1.0-Stage151-Android-Debug-APK
          path: build-output/SONGDNA-SMART-STUDIO-6.1.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# SONGDNA SMART STUDIO 6.1.0"
            echo
            echo "## Stage151 Android Build"
            echo
            echo "- Source ZIP: Stage151"
            echo "- Build type: Android Debug APK"
            echo "- Java: 17"
            echo "- Node.js: 22"
            echo "- Python: 3.11"
            echo "- Gradle: 8.9"
            echo "- Android SDK: 35"
            echo
            if [ -f build-output/SONGDNA-SMART-STUDIO-6.1.0-debug.apk ]; then
              echo "- APK size: ${{ steps.apk.outputs.size }}"
              echo "- SHA256: ${{ steps.apk.outputs.sha256 }}"
              echo
              echo "APK artifact was generated."
            else
              echo "APK was not generated. Check the failed workflow step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          
