
name: SONGDNA Studio 4.6.1 - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-studio-4-6-1-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build SONGDNA Studio 4.6.1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract 4.6.1 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="SONGDNA_Studio_4_6_1_Developer_Package.zip"

          if [[ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]]; then
            echo "::error::4.6.1 source ZIP not found"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/songdna-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/SONGDNA-Studio-4.6.1"

          if [[ ! -d "$PROJECT_DIR" ]]; then
            echo "::error::Project folder not found"
            find "$EXTRACT_DIR" -maxdepth 3 -type d
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          PIPE_STATUS=("${PIPESTATUS[@]}")
          set -e
          if [[ "${PIPE_STATUS[1]}" -ne 0 ]]; then
            exit "${PIPE_STATUS[1]}"
          fi

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate SONGDNA 4.6.1 source
        run: |
          python3 "$PROJECT_DIR/scripts/verify-source.py"

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace --warning-mode all \
            -p "$PROJECT_DIR/android-wrapper" \
            clean assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK file was not created"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload SONGDNA Studio 4.6.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-4.6.1-debug-APK
          path: ${{ runner.temp }}/songdna-source/SONGDNA-Studio-4.6.1/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
