      - name: Install browser regression dependencies
        env:
          SOURCE_DIR: ${{ steps.extract.outputs.source_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          test -f requirements-test.txt || {
            echo "::error::requirements-test.txt kaynak paketinde bulunamadı"
            exit 1
          }

          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
