name: SONGDNA SMART STUDIO 7.5.0 - Stage186 Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'SONGDNA_SMART_STUDIO_7_5_0_STAGE186_KAYNAK_PAKETI.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage186-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Stage186 source and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and validate exact Stage186 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME='SONGDNA_SMART_STUDIO_7_5_0_STAGE186_KAYNAK_PAKETI.zip'
          ZIP_FILE="$GITHUB_WORKSPACE/$ZIP_NAME"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Stage186 ZIP not found. Upload exactly '$ZIP_NAME' to the repository root."
            echo 'Repository-root ZIP files:'
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' || true
            exit 1
          fi

          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "::error::Stage186 ZIP is empty."
            exit 1
          fi

          python - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          p = sys.argv[1]
          required = 'SONGDNA_SMART_STUDIO_7_5_0_STAGE186/BUILD_PACKAGE_MANIFEST_STAGE186.json'

          try:
              with zipfile.ZipFile(p) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f'INVALID: CRC/integrity error in {bad}')

                  names = set(z.namelist())

                  if required not in names:
                      raise SystemExit(f'INVALID: required package file missing: {required}')

                  if any(
                      PurePosixPath(n).is_absolute()
                      or '..' in PurePosixPath(n).parts
                      for n in names
                  ):
                      raise SystemExit('INVALID: unsafe archive path detected')

          except (zipfile.BadZipFile, OSError) as e:
              raise SystemExit(f'INVALID: file is not a complete ZIP archive: {e}')

          print('Stage186 ZIP integrity and required package structure: OK')
          PY

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Stage186 source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="$GITHUB_WORKSPACE/stage186-source"
          mkdir -p "$SOURCE_ROOT"

          python - "$ZIP_FILE" "$SOURCE_ROOT" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as z:
              z.extractall(sys.argv[2])
          PY

          SOURCE_DIR="$SOURCE_ROOT/SONGDNA_SMART_STUDIO_7_5_0_STAGE186"

          test -d "$SOURCE_DIR"
          test -f "$SOURCE_DIR/BUILD_PACKAGE_MANIFEST_STAGE186.json"
          test -f "$SOURCE_DIR/requirements-test.txt"
          test -f "$SOURCE_DIR/android-wrapper/settings.gradle" || test -f "$SOURCE_DIR/android-wrapper/settings.gradle.kts"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Verify Stage186 package identity
        shell: bash
        run: |
          set -euo pipefail

          python - "$SOURCE_DIR/BUILD_PACKAGE_MANIFEST_STAGE186.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as f:
              m = json.load(f)

          assert m.get('package_stage') == 186, 'Manifest package_stage must be 186'
          assert m.get('application_version') == '7.5.0', 'Unexpected app version'

          print('Stage186 manifest identity: OK')
          PY

      - name: Install Python test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "$SOURCE_DIR/requirements-test.txt"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify source and Android asset integrity
        run: python "$SOURCE_DIR/scripts/verify-source.py"

      - name: Verify backend JavaScript syntax
        run: npm --prefix "$SOURCE_DIR/backend" run check

      - name: Verify Stage186 story blending endpoint
        run: node "$SOURCE_DIR/scripts/test-stage185-story-blend-deployment.js"

      - name: Run all JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find tests scripts -maxdepth 1 -type f -name '*.js' -print0 2>/dev/null | sort -z
          )

          echo "JavaScript regression files found: ${#TESTS[@]}"

          if [[ ${#TESTS[@]} -eq 0 ]]; then
            echo '::error::No JavaScript regression tests found.'
            exit 1
          fi

          for TEST_FILE in "${TESTS[@]}"; do
            echo "--- $TEST_FILE"
            node "$TEST_FILE"
          done

      - name: Run Python preflight and regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          python scripts/ci-preflight.py

          mapfile -d '' TESTS < <(
            find scripts -maxdepth 1 -type f -name 'test-*.py' -print0 | sort -z
          )

          echo "Python regression files found: ${#TESTS[@]}"

          for TEST_FILE in "${TESTS[@]}"; do
            echo "--- $TEST_FILE"
            python "$TEST_FILE"
          done

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR/android-wrapper"

          gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK and generate SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/stage186-output"

          cp "$APK" "$GITHUB_WORKSPACE/stage186-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE186_DEBUG.apk"

          sha256sum "$GITHUB_WORKSPACE/stage186-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE186_DEBUG.apk" \
            > "$GITHUB_WORKSPACE/stage186-output/SHA256SUMS.txt"

          {
            echo '## SONGDNA SMART STUDIO 7.5.0 — Stage186'
            echo ''
            echo '- Exact source archive validated before extraction.'
            echo '- All discovered JavaScript and Python regression tests completed.'
            echo '- Android debug APK generated.'
            echo '- SHA-256 checksum generated.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage186 APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.5.0-STAGE186-ANDROID
          path: stage186-output/*
          if-no-files-found: error
          retention-days: 30
