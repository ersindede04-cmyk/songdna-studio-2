
name: SONGDNA SMART STUDIO 6.1.0 - ZIP Source APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP, validate source and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Find and extract SONGDNA Stage151 ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -type f -iname '*.zip' \
            ! -path './.git/*' | grep -i 'stage151' | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Stage151 ZIP not found."
            exit 1
          fi

          mkdir -p _source
          unzip -q "$ZIP_FILE" -d _source

          echo "Source ZIP: $ZIP_FILE"
          echo "source_dir=_source" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

          if [ -f _source/requirements.txt ]; then
            pip install -r _source/requirements.txt
          fi

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail

          find _source -name package.json \
            -not -path '*/node_modules/*' -print0 |
          while IFS= read -r -d '' FILE; do
            DIR=$(dirname "$FILE")
            cd "$GITHUB_WORKSPACE/$DIR"

            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi
          done

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f _source/android-wrapper/gradlew ]; then
            ANDROID_DIR="_source/android-wrapper"
          else
            GRADLE_FILE=$(find _source -name gradlew \
              -type f -print -quit)

            if [ -z "$GRADLE_FILE" ]; then
              echo "ERROR: Gradle wrapper not found."
              exit 1
            fi

            ANDROID_DIR=$(dirname "$GRADLE_FILE")
          fi

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify extracted source
        shell: bash
        run: |
          set -euo pipefail

          test -f "${{ steps.android.outputs.android_dir }}/gradlew"

          if [ -f _source/scripts/verify-source.py ]; then
            python _source/scripts/verify-source.py
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          find _source -name '*.js' \
            -not -path '*/node_modules/*' -print0 |
          while IFS= read -r -d '' FILE; do
            node --check "$FILE"
          done

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail

          find _source -name package.json \
            -not -path '*/node_modules/*' -print0 |
          while IFS= read -r -d '' FILE; do
            DIR=$(dirname "$FILE")
            cd "$GITHUB_WORKSPACE/$DIR"
            npm test --if-present
          done

      - name: Run Python regression tests
        shell: bash
        run: |
          set -euo pipefail

          if [ -d _source/tests ]; then
            python -m pytest _source/tests -q
          else
            echo "No Python tests directory found."
          fi

      - name: Build Android debug APK
        working-directory: ${{ steps.android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "${{ steps.android.outputs.android_dir }}" \
            -type f -path '*/build/outputs/apk/*/*.apk' \
            -name '*debug*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/SONGDNA-6.1.0-Stage151-debug.apk

          sha256sum release/SONGDNA-6.1.0-Stage151-debug.apk \
            > release/SHA256SUMS.txt

      - name: Upload SONGDNA APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-6.1.0-Stage151-Android-APK
          path: |
            release/SONGDNA-6.1.0-Stage151-debug.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# SONGDNA SMART STUDIO 6.1.0"
            echo ""
            echo "## Stage151 Android Build"
            echo ""
            echo "- Java: 17"
            echo "- Node.js: 22"
            echo "- Python: 3.11"
            echo "- Android SDK: 35"
            echo "- Build Tools: 35.0.0"
            echo ""
            if [ -f release/SONGDNA-6.1.0-Stage151-debug.apk ]; then
              echo "APK generated successfully."
            else
              echo "APK was not generated. Check failed workflow step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          
