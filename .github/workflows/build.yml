name: SONGDNA SMART STUDIO 5.2.0 - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build SONGDNA 5.2.0 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify project files
        run: |
          test -f android-wrapper/settings.gradle
          test -f android-wrapper/build.gradle
          test -f android-wrapper/app/build.gradle
          test -f www/app.js
          test -f www/production-model-library.js
          test -f BUILD_MANIFEST.json

      - name: Validate JavaScript
        run: |
          node --check www/app.js
          node --check www/production-model-library.js

      - name: Verify source package
        run: |
          if [ -f scripts/verify-source.py ]; then
            python scripts/verify-source.py
          else
            echo "Source verification script not found; continuing with file checks."
          fi

      - name: Verify Android WebView assets
        run: |
          diff -qr www android-wrapper/app/src/main/assets/www

      - name: Build debug APK
        working-directory: android-wrapper
        run: |
          gradle clean assembleDebug

      - name: Verify debug APK
        run: |
          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.2.0-Stage60-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
