
name: SONGDNA Studio 4.6.1 - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-studio-4-6-1-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract, validate and build SONGDNA 4.6.1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded 4.6.1 developer ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/songdna-source"

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*4_6_1*GitHub*Fix*.zip' -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*4_6_1*Developer*Package*.zip' -print -quit)"
          fi

          if [[ -z "$ZIP_FILE" ]]; then
            echo "::error::4.6.1 ZIP not found in repository root."
            ls -la
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/songdna-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/songdna-source" -type f -path '*/scripts/verify-source.py' -print -quit | sed 's#/scripts/verify-source.py$##')"

          if [[ -z "$PROJECT_DIR" || ! -d "$PROJECT_DIR/android-wrapper" ]]; then
            echo "::error::Project files not found inside ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          PIPE_STATUS=("${PIPESTATUS[@]}")
          set -e

          SDKMANAGER_STATUS="${PIPE_STATUS[1]}"

          if [[ "$SDKMANAGER_STATUS" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$SDKMANAGER_STATUS"
          fi

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source
        run: python3 "$PROJECT_DIR/scripts/verify-source.py"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all -p "$PROJECT_DIR/android-wrapper" clean assembleDebug

      - name: Verify and stage debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p dist
          cp "$APK" dist/SONGDNA-Studio-4.6.1-debug.apk

          ls -lh dist/SONGDNA-Studio-4.6.1-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-4.6.1-debug-APK
          path: dist/SONGDNA-Studio-4.6.1-debug.apk
          if-no-files-found: error
          retention-days: 14
          
