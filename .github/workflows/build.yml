
name: SONG DNA SMART STUDIO 5.1.0 - Android APK

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: song-dna-smart-studio-5-1-0-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build SONG DNA SMART STUDIO 5.1.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unpack 5.1.0 source package if present
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          root = Path.cwd()
          archives = sorted(
              root.glob("SONG_DNA_SMART_STUDIO_5_1_0_Developer_Package*.zip")
          )

          if not archives:
              print("No uploaded source ZIP found; using repository files as-is.")
          else:
              archive = archives[0]
              temp = Path("/tmp/songdna510-unpack")
              shutil.rmtree(temp, ignore_errors=True)
              temp.mkdir(parents=True)

              with ZipFile(archive) as zf:
                  for member in zf.infolist():
                      target = (temp / member.filename).resolve()
                      if not target.is_relative_to(temp.resolve()):
                          raise SystemExit("Unsafe ZIP path detected.")
                  zf.extractall(temp)

              if (temp / "android-wrapper").is_dir():
                  source = temp
              else:
                  candidates = [
                      p for p in temp.iterdir()
                      if p.is_dir() and (p / "android-wrapper").is_dir()
                  ]
                  if len(candidates) != 1:
                      raise SystemExit(
                          "Could not identify the 5.1.0 Android source folder."
                      )
                  source = candidates[0]

              for item in source.iterdir():
                  if item.name == ".git":
                      continue
                  target = root / item.name
                  if item.is_dir():
                      shutil.copytree(item, target, dirs_exist_ok=True)
                  else:
                      shutil.copy2(item, target)

              print(f"Unpacked {archive.name} successfully.")
          PYCODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          PIPE_STATUS=("${PIPESTATUS[@]}")
          set -e

          SDKMANAGER_STATUS="${PIPE_STATUS[1]}"

          if [[ "$SDKMANAGER_STATUS" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$SDKMANAGER_STATUS"
          fi

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate 5.1.0 source
        run: python3 scripts/verify-source.py

      - name: Check JavaScript syntax
        run: node --check www/app.js

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace --warning-mode all \
            -p android-wrapper clean assembleDebug

      - name: Verify debug APK
        run: |
          test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONG-DNA-SMART-STUDIO-5.1.0-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SONGDNA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SONGDNA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONGDNA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONGDNA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$KEYSTORE_B64" &&
                -n "$STORE_PASSWORD" &&
                -n "$KEY_ALIAS" &&
                -n "$KEY_PASSWORD" ]]; then

            KEYSTORE_PATH="$RUNNER_TEMP/songdna-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"

            {
              echo "SONGDNA_KEYSTORE_FILE=$KEYSTORE_PATH"
              echo "SONGDNA_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "SONGDNA_KEY_ALIAS=$KEY_ALIAS"
              echo "SONGDNA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"

            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are incomplete."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          gradle --no-daemon --stacktrace \
            -p android-wrapper assembleRelease

      - name: Verify signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          test -s android-wrapper/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SONG-DNA-SMART-STUDIO-5.1.0-signed-release-APK
          path: android-wrapper/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
