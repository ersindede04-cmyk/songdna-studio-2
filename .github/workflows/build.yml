
name: SONGDNA SMART STUDIO 6.1.0 - ZIP Source APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SONGDNA_SMART_STUDIO_v6_1_0_STAGE151.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-6-1-0-zip-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract ZIP, validate source and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Find and extract SONGDNA 6.1.0 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SONGDNA_SMART_STUDIO_v6_1_0_STAGE151.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            echo "Upload the ZIP file to the repository root."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/songdna-extracted"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/songdna-extracted"

          SOURCE_DIR="$RUNNER_TEMP/songdna-extracted/songdna95"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: Expected songdna95 directory not found inside ZIP."
            find "$RUNNER_TEMP/songdna-extracted" -maxdepth 3 -type d
            exit 1
          fi

          if [ ! -f "$SOURCE_DIR/scripts/verify-source.py" ]; then
            echo "ERROR: ZIP source structure is incomplete."
            exit 1
          fi

          cp -a "$SOURCE_DIR/." "$GITHUB_WORKSPACE/"

          echo "ZIP extraction completed."
          echo "Source files copied to repository workspace."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify extracted source and manifests
        run: python3 scripts/verify-source.py

      - name: Run JavaScript and Python tests
        shell: bash
        run: |
          set -euo pipefail

          node --check app.js
          node --check www/app.js
          node --check backend/server.js
          npm --prefix backend run check

          shopt -s nullglob
          JS_TESTS=(scripts/test-*.js tests/test-*.js test-gemini-instruction-engine.js)

          for test_file in "${JS_TESTS[@]}"; do
            echo "Running $test_file"
            node "$test_file"
          done

          PY_TESTS=(scripts/test-*.py)

          for test_file in "${PY_TESTS[@]}"; do
            echo "Running $test_file"
            python3 "$test_file"
          done

      - name: Build Android debug APK
        run: |
          gradle --no-daemon --stacktrace --warning-mode all \
            -p android-wrapper clean assembleDebug

      - name: Verify APK and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          {
            echo "## SONGDNA SMART STUDIO 6.1.0"
            echo ""
            echo "- ZIP extraction: successful"
            echo "- Source validation: successful"
            echo "- APK build: successful"
            echo "- APK: app-debug.apk"
            echo "- SHA256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-6.1.0-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
