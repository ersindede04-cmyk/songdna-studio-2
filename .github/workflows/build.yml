
name: SONGDNA SMART STUDIO 7.6.3 - Stage197 Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-smart-studio-stage197-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify Stage197 ZIP and Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Find and extract the exact 7.6.3 Stage197 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="SONGDNA_SMART_STUDIO_7_6_3_STAGE197_KAYNAK.zip"
          ZIP_PATH="$GITHUB_WORKSPACE/$ZIP_NAME"

          if [ ! -s "$ZIP_PATH" ]; then
            echo "ERROR: $ZIP_NAME was not found in the repository root."
            echo "Upload the complete source ZIP to the repository root, then run this workflow again."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/songdna-stage197-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_PATH" -d "$EXTRACT_DIR"

          REQUIREMENTS_FILE=$(find "$EXTRACT_DIR" -type f -name requirements-test.txt -print -quit)
          if [ -z "$REQUIREMENTS_FILE" ]; then
            echo "ERROR: requirements-test.txt was not found inside the uploaded ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$REQUIREMENTS_FILE")"

          test -f "$PROJECT_DIR/android-wrapper/settings.gradle.kts"
          test -f "$PROJECT_DIR/android-wrapper/app/build.gradle.kts"
          test -f "$PROJECT_DIR/backend/package.json"
          test -f "$PROJECT_DIR/scripts/verify-source.py"
          test -f "$PROJECT_DIR/scripts/ci-preflight.py"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Stage197 source extracted to: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-cleanup: on-success

      - name: Install Python and Playwright dependencies
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Verify source integrity and backend syntax
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-source.py
          npm --prefix backend run check

      - name: Verify release version is 7.6.3 / Stage197
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 48' android-wrapper/app/build.gradle.kts
          grep -q 'versionName = "7.6.3"' android-wrapper/app/build.gradle.kts
          node -e "const p=require('./backend/package.json'); if(p.version!=='7.6.3') process.exit(1); console.log('Backend version:',p.version)"
          echo "PASS: Android and backend release versions match 7.6.3."

      - name: Run JavaScript regression tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' TESTS < <(
            find tests scripts -maxdepth 1 -type f -name '*.js' \
              ! -name 'test-stage70-deployment-config.js' \
              -print0 | sort -z
          )

          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "ERROR: No JavaScript regression tests were found."
            exit 1
          fi

          echo "JavaScript test files: ${#TESTS[@]}"
          for test_file in "${TESTS[@]}"; do
            echo "=================================================="
            echo "Running: $test_file"
            node "$test_file"
          done

      - name: Run Python preflight and browser regression tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci-preflight.py

          shopt -s nullglob
          TESTS=(scripts/test-*.py)
          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "ERROR: No Python regression tests were found."
            exit 1
          fi

          echo "Python test files: ${#TESTS[@]}"
          for test_file in "${TESTS[@]}"; do
            echo "=================================================="
            echo "Running: $test_file"
            python "$test_file"
          done

      - name: Build SONGDNA SMART STUDIO 7.6.3 Android APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SUCCESS=false

          for ATTEMPT in 1 2 3 4; do
            echo "Gradle build attempt: $ATTEMPT / 4"
            if gradle -p android-wrapper :app:assembleDebug \
              --no-daemon --max-workers=2 --stacktrace; then
              BUILD_SUCCESS=true
              break
            fi

            if [ "$ATTEMPT" -lt 4 ]; then
              WAIT_TIME=$((ATTEMPT * 45))
              echo "Build failed. Waiting ${WAIT_TIME}s before retry."
              sleep "$WAIT_TIME"
            fi
          done

          if [ "$BUILD_SUCCESS" != "true" ]; then
            echo "ERROR: Android APK build failed after four attempts."
            exit 1
          fi

      - name: Verify APK and generate SHA256 checksum
        id: apk
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_SOURCE"

          OUTPUT_DIR="$GITHUB_WORKSPACE/stage197-output"
          mkdir -p "$OUTPUT_DIR"
          cp "$APK_SOURCE" "$OUTPUT_DIR/SONGDNA_SMART_STUDIO_7_6_3_STAGE197_DEBUG.apk"

          cd "$OUTPUT_DIR"
          sha256sum SONGDNA_SMART_STUDIO_7_6_3_STAGE197_DEBUG.apk > SHA256SUMS.txt
          echo "apk_path=$OUTPUT_DIR/SONGDNA_SMART_STUDIO_7_6_3_STAGE197_DEBUG.apk" >> "$GITHUB_OUTPUT"

          ls -lh SONGDNA_SMART_STUDIO_7_6_3_STAGE197_DEBUG.apk SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Android APK and checksum as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.6.3-STAGE197-ANDROID
          path: ${{ github.workspace }}/stage197-output/*
          if-no-files-found: error
          retention-days: 30
          
