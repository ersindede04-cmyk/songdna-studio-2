
name: SONGDNA SMART STUDIO 6.1.0 Stage171 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Verify uploaded Stage171 ZIP, test and build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository (including uploaded source ZIP)
        uses: actions/checkout@v4

      - name: Find, validate and extract Stage171 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="SONGDNA_SMART_STUDIO_6_1_0_STAGE171_KAYNAK.zip"

          mapfile -t ZIP_MATCHES < <(find . -type f -name "$ZIP_NAME" -not -path './.git/*' -print | sort)
          if [ "${#ZIP_MATCHES[@]}" -eq 0 ]; then
            echo "::error::Stage171 kaynak ZIP bulunamadı. ZIP dosyasını workflow ile aynı branch'e GitHub deposuna yükleyip commit edin."
            echo "Depoda bulunan ZIP dosyaları:"
            find . -type f -iname '*.zip' -not -path './.git/*' -print || true
            exit 1
          fi
          if [ "${#ZIP_MATCHES[@]}" -ne 1 ]; then
            echo "::error::Aynı Stage171 ZIP dosyasından birden fazla bulundu. Tek bir kopya bırakın."
            printf '%s\n' "${ZIP_MATCHES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_MATCHES[0]}"
          echo "Kaynak ZIP bulundu: ${ZIP_FILE}"
          unzip -t "$ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/songdna-stage171-source"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/SONGDNA_SMART_STUDIO_6_1_0_STAGE171"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::ZIP içindeki beklenen proje klasörü bulunamadı."
            find "$EXTRACT_DIR" -maxdepth 3 -type d -print
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Stage171 kaynak klasörü hazır: $PROJECT_DIR"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ steps.source.outputs.project_dir }}/requirements-test.txt

      - name: Verify Stage171 source, manifests and WebView synchronization
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          node --check app.js
          node --check backend/server.js
          python scripts/verify-source.py

      - name: Run all JavaScript regression tests
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mapfile -t TEST_FILES < <(find tests scripts -maxdepth 1 -type f -name 'test-*.js' -print | sort)
          echo "Bulunan JavaScript test dosyası: ${#TEST_FILES[@]}"
          if [ "${#TEST_FILES[@]}" -ne 129 ]; then
            echo "::error::Kaynak envanteri 129 JavaScript testi bekliyor; bulunan: ${#TEST_FILES[@]}"
            exit 1
          fi
          for TEST_FILE in "${TEST_FILES[@]}"; do
            echo "===== $TEST_FILE ====="
            node "$TEST_FILE"
          done

      - name: Install pinned Python test dependencies and Chromium
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "$PROJECT_DIR/requirements-test.txt"
          python -m playwright install --with-deps chromium

      - name: Run Python preflight and all browser regression tests
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python scripts/ci-preflight.py
          mapfile -t TEST_FILES < <(find scripts -maxdepth 1 -type f -name 'test-*.py' -print | sort)
          echo "Bulunan Python test dosyası: ${#TEST_FILES[@]}"
          if [ "${#TEST_FILES[@]}" -ne 7 ]; then
            echo "::error::Stage171 kaynak envanteri 7 Python testi bekliyor; bulunan: ${#TEST_FILES[@]}"
            exit 1
          fi
          for TEST_FILE in "${TEST_FILES[@]}"; do
            echo "===== $TEST_FILE ====="
            python "$TEST_FILE"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Stage171 debug APK
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR/android-wrapper" clean assembleDebug
          APK="$PROJECT_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK successfully built: $APK"

      - name: Upload Stage171 debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-6.1.0-STAGE171-DEBUG-APK
          path: ${{ steps.source.outputs.project_dir }}/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
  
