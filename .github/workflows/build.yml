
name: SONGDNA SMART STUDIO 6.1.0 - Stage152 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SONGDNA_SMART_STUDIO_6_1_0_STAGE152_SOURCE.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage152-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Stage152 source validation and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. GitHub deposunu indir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Stage152 kaynak ZIP dosyasını doğrula ve aç
      - name: Find and extract exact Stage152 ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_SMART_STUDIO_6_1_0_STAGE152_SOURCE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Stage152 source ZIP not found."
            echo "Expected: SONGDNA_SMART_STUDIO_6_1_0_STAGE152_SOURCE.zip"
            exit 1
          fi

          python3 - "$ZIP_FILE" "$RUNNER_TEMP/stage152-source" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])

          if not zipfile.is_zipfile(archive):
              raise SystemExit("ERROR: Invalid ZIP archive.")

          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ERROR: Corrupt ZIP member: {bad}")

              for item in zf.infolist():
                  name = item.filename.replace("\\", "/")
                  parts = Path(name).parts
                  if name.startswith("/") or ".." in parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

              zf.extractall(destination)

          print("Stage152 ZIP integrity verified.")
          PY

          echo "source_root=$RUNNER_TEMP/stage152-source" >> "$GITHUB_OUTPUT"

      # 3. Android projesini otomatik tespit et
      - name: Locate Android project automatically
        id: android
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="${{ steps.source.outputs.source_root }}"

          mapfile -t SETTINGS_FILES < <(
            find "$SOURCE_ROOT" -type f \
              \( -path '*/android-wrapper/settings.gradle.kts' \
              -o -path '*/android-wrapper/settings.gradle' \) \
              | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Android project."
            echo "Found: ${#SETTINGS_FILES[@]}"
            find "$SOURCE_ROOT" -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \) -print
            exit 1
          fi

          ANDROID_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          PROJECT_ROOT="$(dirname "$ANDROID_DIR")"

          test -f "$ANDROID_DIR/app/build.gradle.kts" \
            || test -f "$ANDROID_DIR/app/build.gradle"

          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_ROOT/scripts/verify-source.py"

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          echo "Android project detected:"
          echo "$ANDROID_DIR"

      # 4. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Node.js 22
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 6. Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 7. Android SDK - deprecated tools paketi devre dışı
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 8. Yalnızca gerekli Android paketlerini kur
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

          sdkmanager --list_installed

      # 9. Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 10. Kaynak bütünlüğü
      - name: Verify source integrity
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-source.py

      # 11. JavaScript ve backend kontrolü
      - name: Check JavaScript and backend syntax
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          test -f app.js
          test -f www/app.js
          test -f backend/server.js

          node --check app.js
          node --check www/app.js
          node --check backend/server.js

          npm --prefix backend run check

      # 12. JavaScript testleri
      - name: Run JavaScript regression tests
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          TESTS=(
            scripts/test-*.js
            tests/test-*.js
            test-gemini-instruction-engine.js
          )

          COUNT=0

          for test_file in "${TESTS[@]}"; do
            [ -f "$test_file" ] || continue

            echo "::group::$(basename "$test_file")"
            node "$test_file"
            echo "::endgroup::"

            COUNT=$((COUNT + 1))
          done

          echo "Passed JavaScript test files: $COUNT"

          if [ "$COUNT" -ne 120 ]; then
            echo "::error::Expected 120 JavaScript test files; found $COUNT."
            exit 1
          fi

      # 13. Python testleri
      - name: Run Python regression tests
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          TESTS=(scripts/test-*.py)
          COUNT=0

          for test_file in "${TESTS[@]}"; do
            echo "Running $test_file"
            python3 "$test_file"
            COUNT=$((COUNT + 1))
          done

          echo "Passed Python test files: $COUNT"

          if [ "$COUNT" -ne 5 ]; then
            echo "::error::Expected 5 Python test files; found $COUNT."
            exit 1
          fi

      # 14. Android APK derle
      - name: Build Android debug APK
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -p "${{ steps.android.outputs.android_dir }}" \
            clean assembleDebug

      # 15. APK doğrula ve SHA-256 oluştur
      - name: Verify APK and generate SHA256
        id: apk
        working-directory: ${{ steps.android.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.android.outputs.android_dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/SONGDNA-6.1.0-Stage152-debug.apk

          SHA256="$(
            sha256sum release/SONGDNA-6.1.0-Stage152-debug.apk \
            | awk '{print $1}'
          )"

          echo "$SHA256  SONGDNA-6.1.0-Stage152-debug.apk" \
            > release/SHA256SUMS.txt

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          sha256sum --check release/SHA256SUMS.txt

          {
            echo "## SONGDNA SMART STUDIO 6.1.0 - Stage152"
            echo ""
            echo "- Source ZIP: verified"
            echo "- Android project: detected"
            echo "- Android SDK: 35"
            echo "- JavaScript tests: 120 passed"
            echo "- Python tests: 5 passed"
            echo "- Gradle: 8.9"
            echo "- APK: generated and verified"
            echo "- SHA-256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      # 16. APK ve checksum yükle
      - name: Upload Stage152 APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-6.1.0-Stage152-Android-APK
          path: |
            ${{ steps.android.outputs.project_root }}/release/SONGDNA-6.1.0-Stage152-debug.apk
            ${{ steps.android.outputs.project_root }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # 17. Sonuç özeti
      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Stage152 Build Result"
            echo ""
            echo "- Workflow: SONGDNA SMART STUDIO 6.1.0"
            echo "- Stage: 152"
            echo "- Run: $GITHUB_RUN_NUMBER"
            echo "- Commit: $GITHUB_SHA"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
          
