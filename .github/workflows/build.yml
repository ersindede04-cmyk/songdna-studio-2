
name: SONGDNA SMART STUDIO 7.5.0 - Stage190 Stable Build

on:
  workflow_dispatch:
  push:
    paths:
      - '*STAGE190*KAYNAK*PAKETI*.zip'
      - '*STAGE190*KAYNAK*.zip'
      - '.github/workflows/build.yml'
      - '.github/workflows/songdna-stage190.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage190-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify Stage190 and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate and validate Stage190 ZIP
        id: source_zip
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import pathlib
          import zipfile
          import json

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          found = set()

          for pattern in (
              "*STAGE190*KAYNAK*PAKETI*.zip",
              "*STAGE190*KAYNAK*.zip"
          ):
              found.update(
                  p for p in root.glob(pattern) if p.is_file()
              )

          candidates = sorted(found)

          if len(candidates) != 1:
              raise SystemExit(
                  "::error::Depoda tam olarak bir Stage190 ZIP bulunmalı: "
                  + str([p.name for p in candidates])
              )

          archive = candidates[0]

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()

              if bad:
                  raise SystemExit("ZIP CRC hatası: " + bad)

              names = z.namelist()

              for name in names:
                  path = pathlib.PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Güvensiz ZIP yolu: " + name)

              manifests = [
                  n for n in names
                  if pathlib.PurePosixPath(n).name
                  == "BUILD_PACKAGE_MANIFEST_STAGE190.json"
              ]

              if len(manifests) != 1:
                  raise SystemExit(
                      "Stage190 manifest tam olarak bir adet olmalı"
                  )

              manifest_data = json.loads(z.read(manifests[0]))

              if manifest_data.get("package_stage") != 190:
                  raise SystemExit("Paket Stage190 değil")

              if manifest_data.get("application_version") != "7.5.0":
                  raise SystemExit("Uygulama sürümü 7.5.0 değil")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"zip_path={archive}\n")
              f.write(f"manifest_path={manifests[0]}\n")

          print("Stage190 ZIP ve manifest doğrulandı:", archive.name)
          PY

      - name: Extract Stage190 source safely
        id: extract
        shell: bash
        env:
          ZIP_PATH: ${{ steps.source_zip.outputs.zip_path }}
          MANIFEST_PATH: ${{ steps.source_zip.outputs.manifest_path }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import pathlib
          import zipfile
          import json

          dest = (
              pathlib.Path(os.environ["RUNNER_TEMP"])
              / "songdna-stage190"
          )

          dest.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(os.environ["ZIP_PATH"]) as z:
              z.extractall(dest)

          manifest = dest / os.environ["MANIFEST_PATH"]

          if not manifest.is_file():
              raise SystemExit("Stage190 manifest bulunamadı")

          root = manifest.parent
          data = json.loads(manifest.read_text(encoding="utf-8"))

          if data.get("package_stage") != 190:
              raise SystemExit("Stage190 kimliği geçersiz")

          if data.get("application_version") != "7.5.0":
              raise SystemExit("Uygulama sürümü geçersiz")

          required = [
              "requirements-test.txt",
              "backend/server.js",
              "server.js",
              "android-wrapper/settings.gradle.kts",
              "android-wrapper/app/build.gradle.kts",
              "BUILD_PACKAGE_MANIFEST_STAGE190.json"
          ]

          for item in required:
              if not (root / item).exists():
                  raise SystemExit(
                      "Gerekli dosya bulunamadı: " + item
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"source_dir={root}\n")

          print("Stage190 kaynak dizini:", root)
          PY

      - name: Verify backend and Render deployment contract
        env:
          SOURCE_DIR: ${{ steps.extract.outputs.source_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          node --check backend/server.js
          node --check server.js

          node tests/test-stage189-render-story-blend.js
          node tests/test-stage181-story-api-integration.js
          node tests/test-stage179-story-blending.js
          node tests/test-stage179-story-lyrics-alignment.js

          python - <<'PY'
          from pathlib import Path
          import json

          root = Path(".")

          manifest = json.loads(
              (root / "BUILD_PACKAGE_MANIFEST_STAGE190.json")
              .read_text(encoding="utf-8")
          )

          assert manifest["render_deployment"]["root_directory"] == "backend"
          assert manifest["backend_contract"]["health_stage"] == 190

          assert (
              (root / "server.js").read_bytes()
              == (root / "backend/server.js").read_bytes()
          )

          print("Render ve Stage190 deployment doğrulandı")
          PY

      - name: Run complete JavaScript regression suite
        env:
          SOURCE_DIR: ${{ steps.extract.outputs.source_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find tests -type f -name '*.js' -print0 | sort -z
          )

          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "::error::JavaScript test dosyası bulunamadı"
            exit 1
          fi

          for test_file in "${TESTS[@]}"; do
            echo "--- $test_file"
            node "$test_file"
          done

          echo "JavaScript regression files passed: ${#TESTS[@]}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Install browser regression dependencies
        env:
          SOURCE_DIR: ${{ steps.extract.outputs.source_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          test -f requirements-test.txt || {
            echo "::error::requirements-test.txt bulunamadı"
            exit 1
          }

          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run Python browser regression suite
        env:
          SOURCE_DIR: ${{ steps.extract.outputs.source_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          TESTS=(
            scripts/test-stage166-interface-browser.py
            scripts/test-stage170-workspace-browser.py
            scripts/test-stage30-2-two-tab-navigation.py
            scripts/test-stage30-3-output-layout.py
            scripts/test-stage30-4-theme-persistence.py
            scripts/test-stage31-scene-jargon-browser.py
            scripts/test-stage54-unified-menus.py
          )

          for test_file in "${TESTS[@]}"; do
            if [ ! -f "$test_file" ]; then
              echo "::error::Test dosyası bulunamadı: $test_file"
              exit 1
            fi

            echo "--- $test_file"
            python "$test_file"
          done

          echo "Python browser regression files passed: 7" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Locate Android Gradle project
        id: android_project
        env:
          SOURCE_DIR: ${{ steps.extract.outputs.source_dir }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import pathlib

          root = pathlib.Path(os.environ["SOURCE_DIR"])

          settings = (
              list(root.rglob("settings.gradle"))
              + list(root.rglob("settings.gradle.kts"))
          )

          settings = [
              p for p in settings
              if "node_modules" not in p.parts
              and ".gradle" not in p.parts
          ]

          preferred = [
              p for p in settings
              if p.parent.name == "android-wrapper"
          ]

          options = preferred or settings

          if len(options) != 1:
              raise SystemExit(
                  "Android Gradle projesi bulunamadı veya belirsiz"
              )

          project = options[0].parent

          if not (project / "app").is_dir():
              raise SystemExit("Android app klasörü bulunamadı")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"project_dir={project}\n")

          print("Android project:", project)
          PY

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 35 SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK yolu bulunamadı"
            exit 1
          fi

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager PATH içinde bulunamadı"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          sdkmanager \
            --sdk_root="$SDK_ROOT" \
            --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools'

          echo "Android SDK 35 bileşenleri kuruldu"

      - name: Verify Android SDK installation
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"
          test -x "$SDK_ROOT/platform-tools/adb"

          sdkmanager --version

          echo "Android SDK doğrulaması başarılı"

      - name: Build Android debug APK
        env:
          PROJECT_DIR: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK and create checksum
        env:
          PROJECT_DIR: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT="$GITHUB_WORKSPACE/stage190-output"

          if [ ! -s "$APK" ]; then
            echo "::error::Android APK oluşturulamadı"
            exit 1
          fi

          mkdir -p "$OUTPUT"

          cp "$APK" \
            "$OUTPUT/SONGDNA_SMART_STUDIO_7_5_0_STAGE190_DEBUG.apk"

          (
            cd "$OUTPUT"
            sha256sum *.apk > SHA256SUMS.txt
          )

          {
            echo "## SONGDNA SMART STUDIO 7.5.0 - Stage190"
            echo ""
            echo "- Stage190 source ZIP validated."
            echo "- Backend and Render contract verified."
            echo "- JavaScript regression suite passed."
            echo "- Python browser regression suite passed."
            echo "- Android SDK 35 verified."
            echo "- Android debug APK built."
            echo "- SHA-256 checksum generated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage190 APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.5.0-STAGE190-ANDROID
          path: stage190-output/*
          if-no-files-found: error
          retention-days: 30
          
