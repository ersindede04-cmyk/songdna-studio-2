
name: SONG DNA SMART STUDIO 5.1.1 - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Validate and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source files
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "www/app.js" && -f "android-wrapper/app/build.gradle.kts" ]]; then
            echo "Repository root source detected."
          else
            ZIP_FILE="SONG_DNA_SMART_STUDIO_5_1_1_Final_Integrated_Developer_Package.zip"

            if [[ ! -f "$ZIP_FILE" ]]; then
              echo "::error::Expected 5.1.1 ZIP package was not found in repository root."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/songdna-package"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/songdna-package"

            APP_JS="$(find "$RUNNER_TEMP/songdna-package" -type f -path '*/www/app.js' -print -quit)"

            if [[ -z "$APP_JS" ]]; then
              echo "::error::www/app.js was not found inside the ZIP."
              exit 1
            fi

            SOURCE_DIR="${APP_JS%/www/app.js}"
            cp -a "$SOURCE_DIR/." "$GITHUB_WORKSPACE/"
          fi

          test -f www/app.js
          test -f backend/server.js
          test -f android-wrapper/app/build.gradle.kts
          test -f scripts/verify-source.py

          echo "Source preparation completed."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          STATUS="${PIPESTATUS[1]}"
          set -e
          if [[ "$STATUS" -ne 0 ]]; then
            exit "$STATUS"
          fi

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source code
        run: python scripts/verify-source.py

      - name: Check JavaScript syntax
        run: |
          node --check www/app.js
          node --check backend/server.js

      - name: Build Android debug APK
        run: |
          gradle --no-daemon --stacktrace \
            -p android-wrapper clean assembleDebug

      - name: Verify APK
        run: |
          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.1.1-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
