
name: SONGDNA SMART STUDIO 7.0.0 Stage175 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: songdna-stage175-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify Stage175 source and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      JAVA_VERSION: "17"
      NODE_VERSION: "20"
      PYTHON_VERSION: "3.11"

    steps:
      - name: Kaynak deposunu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK ortamını hazırla
        uses: android-actions/setup-android@v3

      - name: Gerekli Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Stage175 kaynak ZIP dosyasını güvenli şekilde bul ve aç
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -type f \
            -iname '*STAGE175*DERLEME*KITI*.zip' \
            -print -quit)"

          if [[ -z "$SOURCE_ZIP" ]]; then
            echo "::error::Stage175 derleme ZIP dosyası bulunamadı."
            echo "Depoya şu adlandırma düzeninde kaynak ZIP yükleyin:"
            echo "SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DERLEME_KITI.zip"
            echo "Bulunan ZIP dosyaları:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "Kullanılacak kaynak arşivi: $SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP"
          mkdir -p "$RUNNER_TEMP/songdna-stage175-source"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/songdna-stage175-source"

          GRADLE_SETTINGS="$(find "$RUNNER_TEMP/songdna-stage175-source" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [[ -z "$GRADLE_SETTINGS" ]]; then
            echo "::error::Kaynak ZIP içinde settings.gradle veya settings.gradle.kts bulunamadı."
            find "$RUNNER_TEMP/songdna-stage175-source" -maxdepth 4 -type f -print | head -200
            exit 1
          fi

          GRADLE_ROOT="$(dirname "$GRADLE_SETTINGS")"
          echo "source_zip=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
          echo "source_root=$RUNNER_TEMP/songdna-stage175-source" >> "$GITHUB_OUTPUT"
          echo "gradle_root=$GRADLE_ROOT" >> "$GITHUB_OUTPUT"
          echo "Android Gradle proje dizini: $GRADLE_ROOT"

      - name: Python test bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright pytest

          REQUIREMENTS_FILE="$(find "${{ steps.source.outputs.source_root }}" \
            -maxdepth 4 -type f -name requirements.txt -print -quit)"
          if [[ -n "$REQUIREMENTS_FILE" ]]; then
            echo "Python bağımlılık dosyası bulundu: $REQUIREMENTS_FILE"
            python -m pip install -r "$REQUIREMENTS_FILE"
          else
            echo "requirements.txt bulunamadı; temel test araçları kuruldu."
          fi

      - name: Playwright Chromium kur
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      - name: Backend Node.js bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_DIR="${{ steps.source.outputs.source_root }}/backend"

          if [[ -f "$BACKEND_DIR/package-lock.json" ]]; then
            npm --prefix "$BACKEND_DIR" ci
          elif [[ -f "$BACKEND_DIR/package.json" ]]; then
            npm --prefix "$BACKEND_DIR" install --no-audit --no-fund
          else
            echo "Backend package.json bulunamadı; bağımlılık kurulumu atlandı."
          fi

      - name: Kaynak ve Android varlık bütünlüğünü doğrula
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="${{ steps.source.outputs.source_root }}"
          VERIFY_SCRIPT="$(find "$SOURCE_ROOT" -type f -path '*/scripts/verify-source.py' -print -quit)"

          if [[ -n "$VERIFY_SCRIPT" ]]; then
            PROJECT_ROOT="$(dirname "$(dirname "$VERIFY_SCRIPT")")"
            cd "$PROJECT_ROOT"
            python "$VERIFY_SCRIPT"
          else
            echo "::error::scripts/verify-source.py bulunamadı."
            exit 1
          fi

      - name: Backend JavaScript sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="${{ steps.source.outputs.source_root }}"
          while IFS= read -r -d '' FILE; do
            node --check "$FILE"
          done < <(find "$SOURCE_ROOT" -type f -name '*.js' \
            -not -path '*/node_modules/*' -print0)

      - name: Backend kontrol komutunu çalıştır
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_DIR="${{ steps.source.outputs.source_root }}/backend"
          if [[ -f "$BACKEND_DIR/package.json" ]] && \
             node -e "const p=require(process.argv[1]); process.exit(p.scripts && p.scripts.check ? 0 : 1)" "$BACKEND_DIR/package.json"; then
            npm --prefix "$BACKEND_DIR" run check
          else
            echo "Backend check komutu tanımlı değil; sözdizimi kontrolü tamamlandı."
          fi

      - name: JavaScript regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="${{ steps.source.outputs.source_root }}"
          mapfile -d '' TEST_FILES < <(
            find "$SOURCE_ROOT" -type f -path '*/scripts/test-*.js' \
              -not -path '*/node_modules/*' -print0 | sort -z
          )

          if (( ${#TEST_FILES[@]} == 0 )); then
            echo "::error::JavaScript regresyon testi bulunamadı."
            exit 1
          fi

          for TEST_FILE in "${TEST_FILES[@]}"; do
            echo "::group::$(basename "$TEST_FILE")"
            node "$TEST_FILE"
            echo "::endgroup::"
          done

      - name: Python ve tarayıcı regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="${{ steps.source.outputs.source_root }}"

          PREFLIGHT="$(find "$SOURCE_ROOT" -type f -path '*/scripts/ci-preflight.py' -print -quit)"
          if [[ -n "$PREFLIGHT" ]]; then
            PROJECT_ROOT="$(dirname "$(dirname "$PREFLIGHT")")"
            cd "$PROJECT_ROOT"
            python "$PREFLIGHT"
          fi

          mapfile -d '' TEST_FILES < <(
            find "$SOURCE_ROOT" -type f -path '*/scripts/test-*.py' \
              -not -path '*/.venv/*' -print0 | sort -z
          )

          for TEST_FILE in "${TEST_FILES[@]}"; do
            echo "::group::$(basename "$TEST_FILE")"
            python "$TEST_FILE"
            echo "::endgroup::"
          done

      - name: Android Gradle projesini derle
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ROOT="${{ steps.source.outputs.gradle_root }}"
          cd "$GRADLE_ROOT"

          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

          APK_PATH="$(find "$GRADLE_ROOT" -type f \
            -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [[ -z "$APK_PATH" ]]; then
            echo "::error::Gradle işlemi tamamlandı ancak debug APK bulunamadı."
            find "$GRADLE_ROOT" -type f -path '*/build/outputs/*' -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/songdna-stage175-artifacts"
          cp "$APK_PATH" "$RUNNER_TEMP/songdna-stage175-artifacts/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk"
          sha256sum "$RUNNER_TEMP/songdna-stage175-artifacts/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk" \
            | tee "$RUNNER_TEMP/songdna-stage175-artifacts/SHA256SUMS.txt"

      - name: Stage175 debug APK çıktısını yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.0.0-STAGE175-DEBUG-APK
          path: |
            ${{ runner.temp }}/songdna-stage175-artifacts/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk
            ${{ runner.temp }}/songdna-stage175-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          
