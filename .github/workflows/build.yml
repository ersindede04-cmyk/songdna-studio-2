
name: SONGDNA SMART STUDIO 5.2.0 - Stage 60.1 APK Build

on:
  push:
    branches:
      - main
    # Yalnızca kaynak ZIP yüklendiğinde derleme başlar.
    # YAML güncellemesi ikinci bir derleme başlatmaz.
    paths:
      - 'SONGDNA_Studio_5_2_0_Stage60_1_Production_Prompt_Hotfix.zip'

permissions:
  contents: read

# Aynı proje için derlemeler sıraya alınır, çalışan derleme iptal edilmez.
concurrency:
  group: songdna-stage60-1-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build SONGDNA 5.2.0 Stage 60.1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP and verify source layout
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_Studio_5_2_0_Stage60_1_Production_Prompt_Hotfix.zip"
          if [[ ! -s "$ZIP_FILE" ]]; then
            echo '::error::Source ZIP not found in repository root. Check the exact ZIP filename.'
            exit 1
          fi

          DEST="$RUNNER_TEMP/songdna-stage60-1"
          mkdir -p "$DEST"
          unzip -q "$ZIP_FILE" -d "$DEST"

          SOURCE_ROOT="$DEST/stage58_work"
          if [[ ! -d "$SOURCE_ROOT" ]]; then
            echo '::error::Expected stage58_work directory was not found inside the ZIP.'
            unzip -Z1 "$ZIP_FILE" | head -80
            exit 1
          fi

          REQUIRED_FILES=(
            "index.html"
            "www/app.js"
            "server.js"
            "backend/server.js"
            "backend/package.json"
            "android-wrapper/app/build.gradle.kts"
            "scripts/verify-source.py"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$SOURCE_ROOT/$file" ]]; then
              echo "::error::Required file missing: stage58_work/$file"
              exit 1
            fi
          done

          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo 'ZIP extraction and source layout verification completed.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source and run tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"

          python3 scripts/verify-source.py
          node --check www/app.js
          node --check server.js
          node --check backend/server.js
          npm --prefix backend run check

          shopt -s nullglob
          JS_TESTS=(scripts/test-*.js tests/test-*.js test-gemini-instruction-engine.js)
          for test_file in "${JS_TESTS[@]}"; do
            echo "Running JavaScript test: $test_file"
            node "$test_file"
          done

          PY_TESTS=(scripts/test-*.py)
          for test_file in "${PY_TESTS[@]}"; do
            echo "Running Python test: $test_file"
            python3 "$test_file"
          done

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/android-wrapper"
          gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Verify APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="$SOURCE_ROOT/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo '::error::APK output was not created.'
            exit 1
          fi

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          mkdir -p "$RUNNER_TEMP/songdna-apk-output"
          cp "$APK" "$RUNNER_TEMP/songdna-apk-output/SONGDNA-Studio-5.2.0-Stage60.1-debug.apk"

          {
            echo '## SONGDNA Stage 60.1 APK'
            echo ''
            echo '- Build: successful'
            echo '- Artifact: SONGDNA-Studio-5.2.0-Stage60.1-debug-APK'
            echo '- APK file: SONGDNA-Studio-5.2.0-Stage60.1-debug.apk'
            echo "- SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.2.0-Stage60.1-debug-APK
          path: ${{ runner.temp }}/songdna-apk-output/SONGDNA-Studio-5.2.0-Stage60.1-debug.apk
          if-no-files-found: error
          retention-days: 14
          
