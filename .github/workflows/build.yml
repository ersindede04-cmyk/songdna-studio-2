
name: SONGDNA SMART STUDIO 7.5.0 - Stage184 Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'SONGDNA_SMART_STUDIO_7_5_0_STAGE184_KAYNAK_PAKET_KITI.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage184-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Stage184 Tests and Android APK Build
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Stage184 source package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_SMART_STUDIO_7_5_0_STAGE184_KAYNAK_PAKET_KITI.zip"

          test -s "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          SOURCE_DIR="$GITHUB_WORKSPACE/source/SONGDNA_SMART_STUDIO_7_5_0_STAGE184"

          test -d "$SOURCE_DIR"
          test -f "$SOURCE_DIR/requirements-test.txt"
          test -f "$SOURCE_DIR/backend/server.js"
          test -f "$SOURCE_DIR/android-wrapper/app/build.gradle.kts"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Install Python test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "$SOURCE_DIR/requirements-test.txt"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify backend JavaScript syntax
        run: npm --prefix "$SOURCE_DIR/backend" run check

      - name: Run all 141 JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          mapfile -d '' TESTS < <(
            find tests scripts -maxdepth 1 -type f -name '*.js' -print0 | sort -z
          )

          echo "JavaScript regression files: ${#TESTS[@]}"

          test "${#TESTS[@]}" -eq 141

          for TEST_FILE in "${TESTS[@]}"; do
            echo "Running: $TEST_FILE"
            node "$TEST_FILE"
          done

      - name: Run Python preflight and 7 regression tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python scripts/ci-preflight.py

          mapfile -d '' TESTS < <(
            find scripts -maxdepth 1 -type f -name 'test-*.py' -print0 | sort -z
          )

          echo "Python regression files: ${#TESTS[@]}"

          test "${#TESTS[@]}" -eq 7

          for TEST_FILE in "${TESTS[@]}"; do
            echo "Running: $TEST_FILE"
            python "$TEST_FILE"
          done

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android-wrapper"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK and generate SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/stage184-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/stage184-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE184_DEBUG.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/stage184-output/SONGDNA_SMART_STUDIO_7_5_0_STAGE184_DEBUG.apk" \
            > "$GITHUB_WORKSPACE/stage184-output/SHA256SUMS.txt"

          {
            echo "## SONGDNA SMART STUDIO 7.5.0 - Stage184"
            echo ""
            echo "- Source package extracted."
            echo "- Backend JavaScript syntax check passed."
            echo "- 141 JavaScript regression tests passed."
            echo "- 7 Python regression tests passed."
            echo "- Android Debug APK generated."
            echo "- SHA-256 checksum generated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage184 APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-SMART-STUDIO-7.5.0-STAGE184-ANDROID-APK
          path: stage184-output/*
          if-no-files-found: error
          retention-days: 30
          
