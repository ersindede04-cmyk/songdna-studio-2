
name: SONGDNA SMART STUDIO 7.0.0 Stage175 Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-stage175-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Verify Stage175 source and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # --------------------------------------------------
      # 1. Kaynak deposunu al
      # --------------------------------------------------
      - name: Kaynak deposunu al
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Node.js 20 - önbellek kapalı
      # --------------------------------------------------
      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          check-latest: true

      # --------------------------------------------------
      # 4. Python 3.11 - pip cache kapalı
      # --------------------------------------------------
      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 5. Gradle
      # --------------------------------------------------
      - name: Gradle ortamını hazırla
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------
      # 6. Android SDK
      # --------------------------------------------------
      - name: Android SDK ortamını hazırla
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            platforms;android-36
            build-tools;35.0.0
            build-tools;36.0.0

      # --------------------------------------------------
      # 7. Stage175 kaynak ZIP dosyasını bul ve aç
      # --------------------------------------------------
      - name: Stage175 kaynak ZIP dosyasını güvenli şekilde bul ve aç
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP=""

          PREFERRED="./SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DERLEME_KILIT.zip"

          if [ -f "$PREFERRED" ]; then
            SOURCE_ZIP="$PREFERRED"
          else
            SOURCE_ZIP="$(python - <<'PY'
          from pathlib import Path

          ignored = {".git", ".github", "node_modules"}
          candidates = []

          for path in Path(".").rglob("*.zip"):
              if any(part in ignored for part in path.parts):
                  continue
              if "stage175" in path.name.lower():
                  candidates.append(path)

          candidates.sort(
              key=lambda p: (
                  "derleme_kilit" not in p.name.lower(),
                  len(p.parts),
                  p.name.lower()
              )
          )

          if candidates:
              print(candidates[0].as_posix())
          PY
          )"
          fi

          if [ -z "$SOURCE_ZIP" ] || [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Stage175 kaynak ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "Kullanılacak kaynak: $SOURCE_ZIP"

          unzip -t "$SOURCE_ZIP"

          mkdir -p "$RUNNER_TEMP/songdna-source"

          python - "$SOURCE_ZIP" "$RUNNER_TEMP/songdna-source" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  target = (destination / item.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(
                          f"Güvenli olmayan ZIP yolu: {item.filename}"
                      )
              zf.extractall(destination)

          print("Stage175 kaynak ZIP başarıyla açıldı.")
          PY

          echo "SOURCE_DIR=$RUNNER_TEMP/songdna-source" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. Kaynak dizinini belirle
      # --------------------------------------------------
      - name: Android ve uygulama kaynak dizinini belirle
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SOURCE_DIR"

          if [ -f "$ROOT/gradlew" ]; then
            PROJECT_ROOT="$ROOT"
          else
            PROJECT_ROOT="$(find "$ROOT" -type f -name gradlew \
              -not -path '*/.gradle/*' \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_ROOT" ] || [ ! -d "$PROJECT_ROOT" ]; then
            echo "::error::Gradle projesi bulunamadı."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Gradle proje dizini: $PROJECT_ROOT"

          find "$PROJECT_ROOT" -maxdepth 3 \
            \( -name settings.gradle -o -name settings.gradle.kts \
            -o -name build.gradle -o -name build.gradle.kts \) \
            -print

      # --------------------------------------------------
      # 9. Python bağımlılıkları
      # --------------------------------------------------
      - name: Python test bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f "$PROJECT_ROOT/requirements.txt" ]; then
            python -m pip install -r "$PROJECT_ROOT/requirements.txt"
          elif [ -f "$PROJECT_ROOT/pyproject.toml" ]; then
            python -m pip install "$PROJECT_ROOT"
          else
            echo "Python bağımlılık dosyası bulunamadı."
            echo "Temel Python test ortamı hazırlanıyor."
          fi

          python -m pip install playwright

      # --------------------------------------------------
      # 10. Playwright Chromium
      # --------------------------------------------------
      - name: Playwright Chromium kur
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      # --------------------------------------------------
      # 11. Node bağımlılıkları
      # --------------------------------------------------
      - name: JavaScript bağımlılıklarını kur
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_ROOT/package-lock.json" ]; then
            npm ci --prefix "$PROJECT_ROOT"
          elif [ -f "$PROJECT_ROOT/package.json" ]; then
            npm install --prefix "$PROJECT_ROOT"
          fi

          if [ -f "$PROJECT_ROOT/backend/package-lock.json" ]; then
            npm ci --prefix "$PROJECT_ROOT/backend"
          elif [ -f "$PROJECT_ROOT/backend/package.json" ]; then
            npm install --prefix "$PROJECT_ROOT/backend"
          fi

      # --------------------------------------------------
      # 12. Kaynak bütünlüğü
      # --------------------------------------------------
      - name: Kaynak ve Android varlık bütünlüğünü doğrula
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_ROOT/scripts/verify-source.py" ]; then
            python "$PROJECT_ROOT/scripts/verify-source.py"
          else
            echo "::error::verify-source.py bulunamadı."
            exit 1
          fi

      # --------------------------------------------------
      # 13. Backend JavaScript kontrolü
      # --------------------------------------------------
      - name: Backend JavaScript sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_ROOT/backend/package.json" ]; then
            npm --prefix "$PROJECT_ROOT/backend" run check --if-present
          fi

          if [ -f "$PROJECT_ROOT/server.js" ]; then
            node --check "$PROJECT_ROOT/server.js"
          fi

          if [ -f "$PROJECT_ROOT/backend/server.js" ]; then
            node --check "$PROJECT_ROOT/backend/server.js"
          fi

      # --------------------------------------------------
      # 14. JavaScript regresyon testleri
      # --------------------------------------------------
      - name: JavaScript regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          TEST_COUNT=0

          while IFS= read -r -d '' TEST_FILE; do
            echo "Test: $TEST_FILE"
            node "$TEST_FILE"
            TEST_COUNT=$((TEST_COUNT + 1))
          done < <(
            find "$PROJECT_ROOT/scripts" \
              -maxdepth 1 \
              -type f \
              -name 'test-*.js' \
              -print0 | sort -z
          )

          echo "Çalıştırılan JavaScript test dosyası: $TEST_COUNT"

      # --------------------------------------------------
      # 15. Python regresyon testleri
      # --------------------------------------------------
      - name: Python ve tarayıcı regresyon testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail

          TEST_COUNT=0

          while IFS= read -r -d '' TEST_FILE; do
            echo "Python testi: $TEST_FILE"
            python "$TEST_FILE"
            TEST_COUNT=$((TEST_COUNT + 1))
          done < <(
            find "$PROJECT_ROOT/scripts" \
              -maxdepth 1 \
              -type f \
              -name 'test-*.py' \
              -print0 | sort -z
          )

          echo "Çalıştırılan Python test dosyası: $TEST_COUNT"

      # --------------------------------------------------
      # 16. Android Gradle projesini bul
      # --------------------------------------------------
      - name: Android Gradle projesini doğrula
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_ROOT/gradlew" ]; then
            echo "::error::Gradle wrapper bulunamadı."
            exit 1
          fi

          chmod +x "$PROJECT_ROOT/gradlew"

          cd "$PROJECT_ROOT"
          ./gradlew --version

      # --------------------------------------------------
      # 17. Android Debug APK
      # --------------------------------------------------
      - name: Android debug APK oluştur
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # --------------------------------------------------
      # 18. APK ve SHA-256 doğrulama
      # --------------------------------------------------
      - name: APK dosyasını ve SHA-256 değerini doğrula
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_ROOT" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Debug APK oluşturulamadı."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/songdna-artifacts"

          cp "$APK_FILE" \
            "$RUNNER_TEMP/songdna-artifacts/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk"

          cd "$RUNNER_TEMP/songdna-artifacts"

          sha256sum SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk \
            | tee SHA256SUMS.txt

          ls -lh

      # --------------------------------------------------
      # 19. Debug APK çıktısını yükle
      # --------------------------------------------------
      - name: Stage175 debug APK çıktısını yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG_APK
          path: |
            ${{ runner.temp }}/songdna-artifacts/SONGDNA_SMART_STUDIO_7_0_0_STAGE175_DEBUG.apk
            ${{ runner.temp }}/songdna-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          
