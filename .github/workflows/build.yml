
name: SONGDNA Studio 4.8.0 - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-studio-4-8-0-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build SONGDNA 4.8.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract SONGDNA Studio 4.8.0 package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname '*4_8_0*Developer*Package*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::SONGDNA 4.8.0 Developer ZIP not found."
            exit 1
          fi

          python3 - "$ZIP_FILE" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          import sys

          archive = Path(sys.argv[1])
          temp = Path("/tmp/songdna-4.8.0")
          shutil.rmtree(temp, ignore_errors=True)
          temp.mkdir(parents=True)

          with ZipFile(archive) as z:
              z.extractall(temp)

          candidates = [
              p for p in temp.iterdir()
              if p.is_dir() and p.name == "SONGDNA-Studio-4.8.0"
          ]

          if len(candidates) != 1:
              raise SystemExit("Expected one SONGDNA-Studio-4.8.0 folder.")

          source = candidates[0]
          root = Path.cwd()

          for item in source.iterdir():
              target = root / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)

          print("SONGDNA Studio 4.8.0 package extracted successfully.")
          PY

          test -f scripts/verify-source.py
          test -f .github/workflows/build-apk.yml
          test -d android-wrapper
          test -d backend
          test -d www

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          status=${PIPESTATUS[1]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$status"
          fi

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify 4.8.0 source
        run: python3 scripts/verify-source.py

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace \
            --warning-mode all \
            -p android-wrapper \
            clean assembleDebug

      - name: Verify debug APK
        run: |
          test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-4.8.0-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SONGDNA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SONGDNA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONGDNA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONGDNA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$KEYSTORE_B64" &&
                -n "$STORE_PASSWORD" &&
                -n "$KEY_ALIAS" &&
                -n "$KEY_PASSWORD" ]]; then

            KEYSTORE_PATH="$RUNNER_TEMP/songdna-release.jks"

            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"

            {
              echo "SONGDNA_KEYSTORE_FILE=$KEYSTORE_PATH"
              echo "SONGDNA_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "SONGDNA_KEY_ALIAS=$KEY_ALIAS"
              echo "SONGDNA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"

            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets incomplete. Release APK skipped."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          gradle --no-daemon --stacktrace \
            -p android-wrapper \
            assembleRelease

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-4.8.0-signed-release-APK
          path: android-wrapper/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
