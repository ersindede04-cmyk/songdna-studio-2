name: SONGDNA SMART STUDIO 6.1.0 - Stage156 APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "SONGDNA_SMART_STUDIO_6_1_0_STAGE156_SOURCE.zip"

permissions:
  contents: read

concurrency:
  group: songdna-stage156-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Stage156 Source Validation and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SOURCE_ARCHIVE: SONGDNA_SMART_STUDIO_6_1_0_STAGE156_SOURCE.zip
      EXPECTED_GRADLE: "8.9"
      EXPECTED_JAVA: "17"
      EXPECTED_NODE: "22"
      EXPECTED_PYTHON: "3.11"

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------
      # 2. Java
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Node.js
      # --------------------------------------------------
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # --------------------------------------------------
      # 4. Python
      # --------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 5. Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 35 packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          sdkmanager --list_installed

      # --------------------------------------------------
      # 6. Gradle
      # --------------------------------------------------
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      # --------------------------------------------------
      # 7. Find exact Stage156 source archive
      # --------------------------------------------------
      - name: Find exact Stage156 source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ARCHIVES < <(
            find . \
              -type f \
              -name "$SOURCE_ARCHIVE" \
              -not -path "./.git/*"
          )

          if [ "${#ARCHIVES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Stage156 source archive."
            echo "Found: ${#ARCHIVES[@]}"
            printf '%s\n' "${ARCHIVES[@]}"
            exit 1
          fi

          ARCHIVE="${ARCHIVES[0]}"

          echo "Found: $ARCHIVE"
          sha256sum "$ARCHIVE"

          WORK_DIR="$RUNNER_TEMP/songdna-stage156"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          unzip -q "$ARCHIVE" -d "$WORK_DIR"

          PROJECT_ROOT="$WORK_DIR/songdna95"

          if [ ! -d "$PROJECT_ROOT" ]; then
            echo "ERROR: Expected source root songdna95/ was not found."
            exit 1
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          echo "Stage156 source archive extracted successfully."

      # --------------------------------------------------
      # 8. Validate package identity and metadata
      # --------------------------------------------------
      - name: Validate and normalize Stage156 package metadata
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          manifests = [
              root / "BUILD_MANIFEST.json",
              root / "www/BUILD_MANIFEST.json",
              root / "android-wrapper/app/src/main/assets/BUILD_MANIFEST.json",
              root / "android-wrapper/app/src/main/assets/www/BUILD_MANIFEST.json",
          ]

          for path in manifests:
              if not path.is_file():
                  raise SystemExit(f"Missing manifest: {path}")

          data = [json.loads(p.read_text(encoding="utf-8")) for p in manifests]

          if any(item != data[0] for item in data[1:]):
              raise SystemExit("The four application manifests do not match.")

          if data[0].get("version") != "6.1.0":
              raise SystemExit("Application version is not 6.1.0.")

          if data[0].get("stage") != 156:
              raise SystemExit("Application manifest does not identify Stage156.")

          old_manifest = root / "BUILD_PACKAGE_MANIFEST_STAGE155.json"
          new_manifest = root / "BUILD_PACKAGE_MANIFEST_STAGE156.json"

          if old_manifest.exists():
              package = json.loads(old_manifest.read_text(encoding="utf-8"))
          elif new_manifest.exists():
              package = json.loads(new_manifest.read_text(encoding="utf-8"))
          else:
              raise SystemExit("Package manifest is missing.")

          package["package_stage"] = 156
          package["package_name"] = "SONGDNA SMART STUDIO 6.1.0 Stage156 Source Package"
          package["application_manifest_stage"] = 156
          package["application_manifest_policy"] = (
              "Stage156 package metadata synchronized with all four Stage156 application manifests."
          )
          package["source_root"] = "songdna95/"
          package["android_project"] = "android-wrapper/"
          package["gradle_wrapper_present"] = False
          package["github_workflow_in_source_archive"] = False
          package["python_test_requirements"] = "requirements-test.txt"
          package["python_browser_launcher"] = "scripts/browser_test_utils.py"

          if old_manifest.exists():
              old_manifest.unlink()

          new_manifest.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          package["source_file_count"] = sum(
              1 for p in root.rglob("*") if p.is_file()
          )

          new_manifest.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("PASS: Stage156 application manifests match.")
          print("PASS: Stage156 package metadata synchronized.")
          PY

      # --------------------------------------------------
      # 9. Locate Android project
      # --------------------------------------------------
      - name: Locate Android project using Gradle settings
        id: android
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          SETTINGS="android-wrapper/settings.gradle.kts"
          APP_BUILD="android-wrapper/app/build.gradle.kts"

          test -f "$SETTINGS"
          test -f "$APP_BUILD"

          grep -q 'include(":app")' "$SETTINGS"
          grep -q 'applicationId = "com.songdna.studio"' "$APP_BUILD"
          grep -q 'versionName = "6.1.0"' "$APP_BUILD"
          grep -q 'versionCode = 32' "$APP_BUILD"

          ANDROID_DIR="$PROJECT_ROOT/android-wrapper"

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project verified:"
          echo "$ANDROID_DIR"

      # --------------------------------------------------
      # 10. Install Python test dependencies
      # --------------------------------------------------
      - name: Install Python test dependencies
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f requirements-test.txt
          test -f scripts/ci-preflight.py

          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      # --------------------------------------------------
      # 11. Correct Playwright version validation
      # --------------------------------------------------
      - name: Verify Playwright distribution metadata
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python scripts/ci-preflight.py

      # --------------------------------------------------
      # 12. Install Chromium
      # --------------------------------------------------
      - name: Install Playwright Chromium
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python -m playwright install --with-deps chromium

      # --------------------------------------------------
      # 13. Verify source integrity
      # --------------------------------------------------
      - name: Verify source integrity and synchronized assets
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python scripts/verify-source.py

      # --------------------------------------------------
      # 14. JavaScript syntax and backend checks
      # --------------------------------------------------
      - name: Check JavaScript syntax and backend
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          node --check app.js
          node --check www/app.js
          node --check backend/server.js

          npm --prefix backend run check

      # --------------------------------------------------
      # 15. JavaScript regression tests
      # --------------------------------------------------
      - name: Run JavaScript regression tests
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          mapfile -t TESTS < <(
            find scripts tests \
              -type f \
              -name 'test-*.js' \
              -print | sort
          )

          TESTS+=("test-gemini-instruction-engine.js")

          if [ "${#TESTS[@]}" -ne 120 ]; then
            echo "ERROR: Expected 120 JavaScript tests."
            echo "Found: ${#TESTS[@]}"
            exit 1
          fi

          for test_file in "${TESTS[@]}"; do
            if [ ! -f "$test_file" ]; then
              echo "Missing test: $test_file"
              exit 1
            fi

            echo "Running: $test_file"
            node "$test_file"
          done

          echo "PASS: All 120 JavaScript regression tests."

      # --------------------------------------------------
      # 16. Python browser regression tests
      # --------------------------------------------------
      - name: Run Python browser regression tests
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          mapfile -t TESTS < <(
            find scripts \
              -maxdepth 1 \
              -type f \
              -name 'test-*.py' \
              -print | sort
          )

          if [ "${#TESTS[@]}" -ne 5 ]; then
            echo "ERROR: Expected 5 Python regression tests."
            echo "Found: ${#TESTS[@]}"
            exit 1
          fi

          python scripts/ci-preflight.py

          for test_file in "${TESTS[@]}"; do
            echo "Running: $test_file"
            python "$test_file"
          done

          echo "PASS: All 5 Python browser regression tests."

      # --------------------------------------------------
      # 17. Build Android APK
      # --------------------------------------------------
      - name: Build Stage156 Android debug APK
        id: build
        shell: bash
        env:
          ANDROID_DIR: ${{ steps.android.outputs.android_dir }}
        run: |
          set -euo pipefail

          test -d "$ANDROID_DIR"
          test -f "$ANDROID_DIR/settings.gradle.kts"
          test -f "$ANDROID_DIR/app/build.gradle.kts"

          java -version
          gradle --version

          gradle \
            -p "$ANDROID_DIR" \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      # --------------------------------------------------
      # 18. Verify APK and generate SHA256
      # --------------------------------------------------
      - name: Verify APK and generate SHA256
        id: verify
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
          ANDROID_DIR: ${{ steps.android.outputs.android_dir }}
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$PROJECT_ROOT/release"

          cp "$APK" \
            "$PROJECT_ROOT/release/SONGDNA-6.1.0-Stage156-debug.apk"

          cd "$PROJECT_ROOT/release"

          sha256sum \
            SONGDNA-6.1.0-Stage156-debug.apk \
            > SHA256SUMS.txt

          sha256sum --check SHA256SUMS.txt

          APK_SIZE=$(stat -c%s SONGDNA-6.1.0-Stage156-debug.apk)
          APK_HASH=$(sha256sum SONGDNA-6.1.0-Stage156-debug.apk | awk '{print $1}')

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_HASH" >> "$GITHUB_OUTPUT"

          echo "APK successfully generated and verified."

      # --------------------------------------------------
      # 19. Upload APK
      # --------------------------------------------------
      - name: Upload Stage156 APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-6.1.0-Stage156-Android-APK
          path: |
            ${{ steps.source.outputs.project_root }}/release/SONGDNA-6.1.0-Stage156-debug.apk
            ${{ steps.source.outputs.project_root }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 20. Build summary
      # --------------------------------------------------
      - name: Stage156 build summary
        if: always()
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
          APK_SIZE: ${{ steps.verify.outputs.apk_size }}
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
        run: |
          {
            echo "## SONGDNA SMART STUDIO 6.1.0 - Stage156"
            echo ""
            echo "### Build report"
            echo ""
            echo "- Source archive: $SOURCE_ARCHIVE"
            echo "- Java: 17"
            echo "- Node.js: 22"
            echo "- Python: 3.11"
            echo "- Android SDK: 35"
            echo "- Gradle: 8.9"
            echo "- JavaScript regression tests: 120"
            echo "- Python browser tests: 5"
            echo "- Package stage: 156"
            echo ""
            if [ -n "$APK_SIZE" ]; then
              echo "- APK size: $APK_SIZE bytes"
              echo "- APK SHA256: $APK_SHA256"
            else
              echo "- APK: not generated or not verified"
            fi
            echo ""
            echo "APK is considered ready only when build, verification and artifact upload succeed."
          } >> "$GITHUB_STEP_SUMMARY"
