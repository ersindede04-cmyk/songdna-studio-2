
name: SONGDNA SMART STUDIO 5.2.0 - Stage 75 ZIP to Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SONGDNA_Studio_5_2_0_Stage75_Prompt_Context_Deduplication.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: songdna-stage75-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract Stage 75 ZIP, test source and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Check and extract Stage 75 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SONGDNA_Studio_5_2_0_Stage75_Prompt_Context_Deduplication.zip"
          SOURCE_DIR="$RUNNER_TEMP/songdna-stage75-source"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Stage 75 ZIP file not found in repository root."
            echo "Expected path: $ZIP_FILE"
            exit 1
          fi

          echo "Checking ZIP integrity..."
          unzip -t "$ZIP_FILE"

          mkdir -p "$SOURCE_DIR"

          echo "Extracting Stage 75 source..."
          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          if [ ! -f "$SOURCE_DIR/app.js" ]; then
            echo "ERROR: app.js not found after extraction."
            exit 1
          fi

          if [ ! -d "$SOURCE_DIR/android-wrapper" ]; then
            echo "ERROR: android-wrapper directory not found."
            exit 1
          fi

          echo "Copying extracted Stage 75 source into workspace..."
          cp -a "$SOURCE_DIR/." "$GITHUB_WORKSPACE/"

          echo "Stage 75 ZIP extraction completed successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Stage 75 source synchronization
        run: |
          python3 scripts/verify-source.py

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check app.js
          node --check www/app.js
          node --check backend/server.js

      - name: Check backend
        run: npm --prefix backend run check

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          JS_TESTS=(scripts/test-*.js tests/test-*.js test-gemini-instruction-engine.js)

          if [ ${#JS_TESTS[@]} -eq 0 ]; then
            echo "ERROR: No JavaScript regression tests found."
            exit 1
          fi

          for test_file in "${JS_TESTS[@]}"; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Run Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          PY_TESTS=(scripts/test-*.py)

          for test_file in "${PY_TESTS[@]}"; do
            echo "Running $test_file"
            python3 "$test_file"
          done

      - name: Build Android debug APK
        run: |
          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            -p android-wrapper \
            clean assembleDebug

      - name: Verify APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          echo "APK successfully generated."
          echo "SHA-256: $SHA256"

          {
            echo "## SONGDNA SMART STUDIO 5.2.0 - Stage 75"
            echo ""
            echo "- ZIP extraction: PASSED"
            echo "- Source validation: PASSED"
            echo "- Regression tests: PASSED"
            echo "- Android APK build: PASSED"
            echo "- APK: app-debug.apk"
            echo "- SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-5.2.0-Stage75-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
